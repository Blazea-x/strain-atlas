<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#07110d">
  <title>Cannabis Strain Wisdom | Migration Preview</title>
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <header class="preview-head">
    <div>
      <div class="eyebrow">MASTER MIGRATION PREVIEW</div>
      <h1>Cannabis Strain Wisdom</h1>
    </div>
    <div class="data-state" id="data-state">LOADING</div>
  </header>

  <main class="shell">
    <section class="control-panel" aria-label="品種を探す">
      <div class="search-wrap">
        <label class="sr-only" for="search">品種を検索</label>
        <input id="search" type="search" autocomplete="off" placeholder="品種名・香り・系譜から検索">
      </div>
      <div class="explore" aria-label="TYPEから探索">
        <button type="button" class="explore-chip is-active" data-explore="all">ALL</button>
        <button type="button" class="explore-chip" data-explore="sativa">SATIVA系</button>
        <button type="button" class="explore-chip" data-explore="indica">INDICA系</button>
        <button type="button" class="explore-chip" data-explore="hybrid">HYBRID</button>
      </div>
      <div class="result-line"><span id="result-label">読み込み中</span><span id="catalog-meta"></span></div>
    </section>

    <section class="cultivar-grid" id="cultivar-grid" aria-live="polite"></section>
    <div class="empty" id="empty" hidden>該当する品種はありません。</div>
  </main>

  <dialog class="detail-dialog" id="detail-dialog">
    <div class="detail-shell" id="detail-shell"></div>
  </dialog>

  <script src="app.js?v=1" defer></script>
</body>
</html>
