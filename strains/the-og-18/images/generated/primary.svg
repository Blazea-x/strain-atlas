  <title id="title">The OG #18 reference flower</title>
  <desc id="desc">AI-created botanical reference illustration inspired by documented The OG #18 flower photographs, showing a dense green resinous cola with pale trichomes and orange pistils.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="43%" r="72%">
      <stop offset="0" stop-color="#24392b"/>
      <stop offset="0.56" stop-color="#111b15"/>
      <stop offset="1" stop-color="#070b08"/>
