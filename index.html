<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cannabis Wisdom</title><meta name="description" content="Cannabis Wisdom — 3品種から始めるカンナビス品種図鑑。"><style>:root{--bg:#07110d;--panel:#0e1913;--line:#23352b;--text:#f3f0df;--muted:#9ba89f;--gold:#d9b65d;--cream:#efe9d4}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07110d,#0b1711 55%,#08100c);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}.wrap{max-width:1100px;margin:auto;padding:0 16px 72px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid #183024}.brand{font-weight:800;color:var(--gold);font-size:18px}.hero{padding:24px 0 26px}.heroimg{display:block;width:100%;max-width:760px;margin:0 auto 24px;border-radius:24px;border:1px solid #24382d;background:#050806}.hero p{max-width:720px;color:#c6cec8;line-height:1.8;font-size:14px;margin:0 auto;text-align:center}.searchbox{margin:24px auto 0;display:flex;gap:8px;max-width:760px}.searchbox input{flex:1;background:#f2f0e7;color:#102017;border:0;border-radius:14px;padding:15px 16px;font-size:16px}.searchbox button{border:0;border-radius:14px;padding:0 18px;background:#174d2a;color:white;font-weight:700}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin:28px 0 12px}.sectionhead h2{font-size:18px;margin:0}.sectionhead span{color:var(--muted);font-size:11px}.grid{display:grid;grid-template-columns:1fr;gap:14px}.card{background:var(--cream);color:#101711;border-radius:20px;overflow:hidden;border:1px solid #d8d1bc;box-shadow:0 10px 30px #0002;cursor:pointer}.visual{height:210px;position:relative;background:radial-gradient(circle at 45% 40%,#5a7a4d 0,#1d3925 36%,#0a1710 70%)}.visual::before{content:"";position:absolute;inset:12%;border-radius:50%;background:radial-gradient(circle at 45% 35%,#d6d0a8 0 4%,#7f9d5a 5% 13%,#3f653c 14% 30%,#203f28 31% 46%,transparent 47%);transform:rotate(-8deg);box-shadow:0 0 60px #9abf7544}.visual.wedding{background:radial-gradient(circle at 50% 35%,#745f73 0,#3a2d3a 38%,#141115 72%)}.visual.og{background:radial-gradient(circle at 50% 35%,#6e6a3a 0,#34391f 40%,#10160c 72%)}.badge{position:absolute;top:14px;left:14px;background:#d8b74e;color:#1b1708;font-size:10px;font-weight:800;padding:6px 9px;border-radius:999px}.body{padding:16px 16px 18px}.body h3{margin:0;font-size:22px}.jp{color:#657069;font-size:11px;margin-top:3px}.type{display:inline-block;margin-top:10px;background:#e0efe2;color:#174d2a;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800}.facts{margin-top:14px;display:grid;gap:8px}.fact label{display:block;color:#7d847e;font-size:10px;font-weight:700;letter-spacing:.08em}.fact div{font-size:12px;line-height:1.6}.more{margin-top:16px;padding-top:12px;border-top:1px solid #d4cfbf;font-size:12px;font-weight:700}.notice{margin-top:24px;border:1px solid #22352b;border-radius:16px;padding:14px;color:#9da99f;font-size:11px;line-height:1.75}.modal{position:fixed;inset:0;background:#050805e8;display:none;z-index:20;overflow:auto}.modal.show{display:block}.detail{max-width:860px;margin:auto;min-height:100vh;background:#0b1510}.detailHero{height:300px;position:relative;background:radial-gradient(circle at 50% 35%,#536d42,#1b3220 42%,#08100b 78%)}.detailTop{position:absolute;inset:0;padding:18px}.back{border:1px solid #ffffff2b;background:#0a120dcc;color:white;border-radius:999px;padding:9px 12px}.detailTitle{position:absolute;left:20px;right:20px;bottom:22px}.detailTitle .type2{color:var(--gold);font-size:11px;font-weight:800}.detailTitle h2{font-size:40px;line-height:.95;margin:8px 0 6px}.detailTitle p{margin:0;color:#c5cec7;font-size:12px}.detailBody{padding:20px}.section{padding:18px 0;border-bottom:1px solid #213127}.section h4{margin:0 0 10px;color:#aa9b68;font-size:11px;letter-spacing:.14em}.section p{margin:0;color:#d7ded9;font-size:14px;line-height:1.8}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #31463a;border-radius:999px;padding:7px 9px;color:#bcc8bf;font-size:11px}.source{margin-top:12px;font-size:12px;color:#d7bd6b}.foot{padding:28px 0 6px;color:#69776e;font-size:10px}@media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr)}.visual{height:240px}}</style></head><body><div class="wrap"><header class="topbar"><div class="brand">Cannabis Wisdom</div><div style="font-size:11px;color:#8da096">3 CULTIVARS</div></header><section class="hero"><img class="heroimg" src="images/cannabis-wisdom-hero.webp" alt="Cannabis Strains Wisdom"><p>販売ページではなく、品種の系譜・香り・由来・情報の確度を整理する図鑑。まずは3品種から始め、構造を壊さずに増やしていく。</p><div class="searchbox"><input id="search" placeholder="品種名・親品種・香りから検索"><button id="go">検索</button></div></section><div class="sectionhead"><h2>掲載中の品種</h2><span id="count">3件</span></div><main id="grid" class="grid"></main><div class="notice">このサイトは品種史・系譜・香りなどの一般情報を整理する図鑑です。医療効果、摂取量、栽培方法、購入方法は扱いません。同名品種でも breeder・phenotype・流通経路によって情報が異なる場合があります。</div><div class="foot">Cannabis Wisdom prototype — review free for now.</div></div><div id="modal" class="modal"><article class="detail"><div id="detail"></div></article></div><script>const STRAINS=[{id:'super-lemon-haze',name:'Super Lemon Haze',jp:'スーパーレモンヘイズ',type_jp:'サティバ優勢',lineage:['Lemon Skunk','Super Silver Haze'],aroma:['レモン','シトラス','ハーブ','ヘイズ'],summary:'Green House Seed Co. が公開する系譜では、Lemon Skunk と Super Silver Haze の交配。柑橘系の香りで知られる Haze 系の代表的な品種のひとつ。',certainty:'高',source:'Green House Seed Co.',visual:'slh'},{id:'wedding-cake',name:'Wedding Cake',jp:'ウェディングケーキ',type_jp:'インディカ優勢',lineage:['Triangle Kush','Animal Mints'],aroma:['バニラ','ペッパー','アーシー'],summary:'Triangle Kush と Animal Mints の交配として紹介されることが多い品種。名称や系譜には別説もあるため、単一の説明を絶対視しない前提で整理する。',certainty:'中',source:'Leafly / breeder references',visual:'wedding'},{id:'og-kush',name:'OG Kush',jp:'OGクッシュ',type_jp:'ハイブリッド',lineage:['系譜に複数説あり'],aroma:['レモン','パイン','フューエル'],summary:'West Coast 系品種の系譜に大きな影響を与えたクラシック。正確な遺伝的起源には複数説があり、図鑑では断定しない表示を採用する。',certainty:'低〜中',source:'複数資料を要照合',visual:'og'}];const grid=document.getElementById('grid'),search=document.getElementById('search'),count=document.getElementById('count'),modal=document.getElementById('modal'),detail=document.getElementById('detail');function render(){const q=search.value.trim().toLowerCase();const list=STRAINS.filter(s=>[s.name,s.jp,s.type_jp,...s.lineage,...s.aroma].join(' ').toLowerCase().includes(q));count.textContent=`${list.length}件`;grid.innerHTML=list.map((s,i)=>`<article class="card" data-id="${s.id}"><div class="visual ${s.visual}"><span class="badge">No. 0${i+1}</span></div><div class="body"><h3>${s.name}</h3><div class="jp">${s.jp}</div><span class="type">${s.type_jp}</span><div class="facts"><div class="fact"><label>LINEAGE</label><div>${s.lineage.join(' × ')}</div></div><div class="fact"><label>AROMA</label><div>${s.aroma.join('・')}</div></div><div class="fact"><label>CERTAINTY</label><div>${s.certainty}</div></div></div><div class="more">詳細を見る →</div></div></article>`).join('')||'<div style="color:#9ba89f;padding:30px 0">一致する品種がありません。</div>';document.querySelectorAll('.card').forEach(el=>el.onclick=()=>openDetail(el.dataset.id))}function openDetail(id){const s=STRAINS.find(x=>x.id===id);detail.innerHTML=`<div class="detailHero"><div class="detailTop"><button class="back" id="back">← 一覧に戻る</button></div><div class="detailTitle"><div class="type2">${s.type_jp} ・ 情報確度 ${s.certainty}</div><h2>${s.name}</h2><p>${s.jp}</p></div></div><div class="detailBody"><section class="section"><h4>OVERVIEW</h4><p>${s.summary}</p></section><section class="section"><h4>LINEAGE</h4><div class="chips">${s.lineage.map(x=>`<span class="chip">${x}</span>`).join('')}</div></section><section class="section"><h4>AROMA</h4><div class="chips">${s.aroma.map(x=>`<span class="chip">${x}</span>`).join('')}</div></section><section class="section"><h4>SOURCE STATUS</h4><p>情報確度：${s.certainty}</p><div class="source">主な参照先：${s.source}</div></section></div>`;modal.classList.add('show');document.body.style.overflow='hidden';document.getElementById('back').onclick=closeDetail}function closeDetail(){modal.classList.remove('show');document.body.style.overflow=''}search.addEventListener('input',render);document.getElementById('go').onclick=render;modal.addEventListener('click',e=>{if(e.target===modal)closeDetail()});render();</script></body></html>
