name: FILTER UX V1 Regression Final Once
"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/filter-ux-v1-regression-final-once.yml"
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PUBLIC_URL: https://blazea-x.github.io/strain-atlas/
      CATALOG_URL: https://raw.githubusercontent.com/Blazea-x/strain-atlas/master-migration/runtime/catalog.json
      PUBLICATION_URL: https://raw.githubusercontent.com/Blazea-x/strain-atlas/master-migration/production/publication.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard data branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/filter-regression-final
          git fetch origin master-migration
          git rev-parse origin/master-migration > /tmp/filter-regression-final/master-start.txt
      - name: Install Selenium
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q selenium
          command -v google-chrome
          command -v chromedriver
      - name: Run remaining public regression E2E
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/filter-regression-final/e2e.py <<'PY'
          import json, os, re, time, traceback, urllib.request
          from datetime import datetime
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait, Select

          OUT=Path('/tmp/filter-regression-final')
          BASE=os.environ['PUBLIC_URL']
          def load(url):
              req=urllib.request.Request(url,headers={'User-Agent':'filter-regression-final'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          catalog=load(os.environ['CATALOG_URL']); publication=load(os.environ['PUBLICATION_URL'])
          cultivars=catalog['cultivars']; entities=catalog.get('entities',{}); ids_all={c['id'] for c in cultivars}
          labels={'sativa':'SATIVA','indica':'INDICA','hybrid':'HYBRID','sativa-dominant-hybrid':'SATIVA系 HYBRID','indica-dominant-hybrid':'INDICA系 HYBRID','balanced-hybrid':'BALANCED HYBRID','unknown':'未分類'}
          role_labels={'originator':'ORIGINATOR','breeder':'BREEDER','seedCompany':'SEED COMPANY','producer':'PRODUCER','brand':'BRAND','distributor':'DISTRIBUTOR'}
          def s(v):return '' if v is None else str(v)
          def blob(c):
              vals=[c.get('id'),c.get('name'),c.get('jp')]+(c.get('aliases') or [])
              t=(c.get('classification') or {}).get('type'); vals += [t,labels.get(t,t),(c.get('breeding') or {}).get('generation')]
              l=c.get('lineage') or {}; vals += [l.get('display')]+(l.get('parents') or [])+[l.get('note')]
              vals += ((c.get('aromas') or {}).get('items') or [])+((c.get('terpenes') or {}).get('items') or [])
              vals += [(c.get('origin') or {}).get('text'),(c.get('history') or {}).get('text')]
              for r in c.get('relations') or []:
                  vals.append((entities.get(r.get('entityId')) or {}).get('name',r.get('entityId')))
                  vals.extend(role_labels.get(x,x) for x in (r.get('roles') or []))
              return ' '.join(s(v) for v in vals if s(v).strip()).lower()
          def expected(t='all',gens=None,breeder='',q=''):
              gens=set(gens or []); q=q.strip().lower(); tids=ids_all if t=='all' else set((catalog.get('explore') or {}).get(t) or [])
              out=[]
              for c in cultivars:
                  if c['id'] not in tids:continue
                  g=s((c.get('breeding') or {}).get('generation')).strip()
                  if gens and g not in gens:continue
                  if breeder and not any(r.get('entityId')==breeder and 'breeder' in (r.get('roles') or []) for r in c.get('relations') or []):continue
                  if q and q not in blob(c):continue
                  out.append(c['id'])
              return sorted(out)
          def gkey(v):
              if v=='S1':return(0,1,v)
              m=re.fullmatch(r'F([1-9][0-9]*)',v)
              if m:return(1,int(m.group(1)),v)
              m=re.fullmatch(r'BX([1-9][0-9]*)',v)
              if m:return(2,int(m.group(1)),v)
              if v=='IBL':return(3,0,v)
              return(4,0,v.lower())
          gens=sorted({s((c.get('breeding') or {}).get('generation')).strip() for c in cultivars if s((c.get('breeding') or {}).get('generation')).strip() and s((c.get('breeding') or {}).get('generation')).strip().lower()!='unknown'},key=gkey)
          breeder_map={}
          for c in cultivars:
              for r in c.get('relations') or []:
                  if 'breeder' in (r.get('roles') or []):
                      name=s((entities.get(r.get('entityId')) or {}).get('name')).strip()
                      if name:breeder_map[r.get('entityId')]=name
          breeder_entries=sorted(breeder_map.items(),key=lambda x:x[1].lower())
          def ts(v):
              try:return datetime.fromisoformat(v.replace('Z','+00:00')).timestamp() if v else float('-inf')
              except:return float('-inf')
          pubs=[(e,i) for i,e in enumerate(publication.get('entries') or []) if e.get('state')=='published' and e.get('strainId') in ids_all]
          pubs.sort(key=lambda x:(-ts(x[0].get('publishedAt')),-x[1],s(x[0].get('strainId'))))
          latest_expected=[e.get('strainId') for e,i in pubs[:6]]

          opt=Options(); opt.add_argument('--headless=new'); opt.add_argument('--no-sandbox'); opt.add_argument('--disable-dev-shm-usage'); opt.add_argument('--window-size=430,1800')
          d=webdriver.Chrome(service=Service('/usr/bin/chromedriver'),options=opt); wait=WebDriverWait(d,35)
          report={'status':'FAIL','catalog_count':len(cultivars),'generation_values':gens,'breeders':[n for i,n in breeder_entries],'type_counts':{},'search_counts':{},'latest_expected':latest_expected,'regressions':{}}
          def js(x,*a):return d.execute_script(x,*a)
          def ready():
              wait.until(lambda x:x.find_element(By.ID,'catalog-total').text.strip()!='収録数を読み込み中')
              wait.until(lambda x:len(x.find_elements(By.CSS_SELECTOR,'#cultivar-grid [data-strain-id]'))>0)
              wait.until(lambda x:len(x.find_elements(By.CSS_SELECTOR,'#latest-grid [data-strain-id]'))==6)
              wait.until(lambda x:len(x.find_elements(By.CSS_SELECTOR,'#cultivar-grid .tile-display-name'))==len(x.find_elements(By.CSS_SELECTOR,'#cultivar-grid [data-strain-id]')))
          def ids():return sorted(e.get_attribute('data-strain-id') for e in d.find_elements(By.CSS_SELECTOR,'#cultivar-grid [data-strain-id]'))
          def click_type(k):js('arguments[0].click()',d.find_element(By.CSS_SELECTOR,f'[data-explore="{k}"]'));time.sleep(.08)
          def query(q):
              e=d.find_element(By.ID,'search');js("arguments[0].value=arguments[1];arguments[0].dispatchEvent(new Event('input',{bubbles:true}));",e,q);time.sleep(.08)
          try:
              d.get(BASE+'?regression-final='+os.environ.get('GITHUB_RUN_ID','0'));ready()
              assert ids()==expected()
              assert d.find_element(By.ID,'catalog-total').text.strip()==f'{len(cultivars)}品種を収録'
              latest_ids=[e.get_attribute('data-strain-id') for e in d.find_elements(By.CSS_SELECTOR,'#latest-grid [data-strain-id]')]
              assert latest_ids==latest_expected and len(latest_ids)==6
              report['regressions']['latest_six']=True

              for k in ['all','sativa','indica','hybrid']:
                  click_type(k); got=ids(); exp=expected(t=k); assert got==exp,(k,got,exp); report['type_counts'][k]=len(got)
              click_type('all'); assert len(ids())==len(cultivars)

              for q in ['Bubble Gum','Wedding Cake','Humboldt CSI','S1','Kush']:
                  query(q);got=ids();exp=expected(q=q);assert got==exp,(q,got,exp);report['search_counts'][q]=len(got);query('')
              query('zzzz-no-cultivar-filter-ux-v1');assert ids()==[];assert d.find_element(By.ID,'empty').is_displayed();assert '該当する品種はありません' in d.find_element(By.ID,'empty').text;query('');assert len(ids())==len(cultivars)
              report['regressions']['search_zero_and_restore']=True

              for sid,display,g in [('wedding-cake-s1','Wedding Cake','S1'),('bubba-kush-s1','Bubba Kush','S1'),('f1-durb-s1','F1 Durb','S1'),('ak-47','AK-47','F1')]:
                  if sid not in ids_all:continue
                  card=d.find_element(By.CSS_SELECTOR,f'#cultivar-grid [data-strain-id="{sid}"]')
                  wait.until(lambda x:card.find_element(By.CSS_SELECTOR,'.tile-display-name').text.strip()!='')
                  assert card.find_element(By.CSS_SELECTOR,'.tile-display-name').text.strip()==display
                  assert card.find_element(By.CSS_SELECTOR,'.generation-badge').text.strip()==g
              report['regressions']['generation_presentation']=True

              hero=d.find_element(By.ID,'home-hero-image');wait.until(lambda x:hero.get_attribute('src'))
              assert 'Bubble Gum' in d.find_element(By.ID,'home-hero-caption').text
              legal=d.find_element(By.ID,'legal-alert');assert '重要なお知らせ' in legal.text;assert len(legal.find_elements(By.CSS_SELECTOR,'a[href]'))>=3
              report['regressions']['hero_legal']=True

              card=d.find_element(By.CSS_SELECTOR,'#cultivar-grid [data-strain-id="wedding-cake"]')
              js("window.scrollTo(0,arguments[0].getBoundingClientRect().top+window.scrollY-100)",card);time.sleep(.2);before=js('return window.scrollY');js('arguments[0].click()',card)
              wait.until(lambda x:x.find_element(By.ID,'detail-dialog').get_attribute('open') is not None)
              wait.until(lambda x:'正式登録名:' in x.find_element(By.ID,'detail-shell').text)
              wait.until(lambda x:all(t in x.find_element(By.ID,'detail-shell').text for t in ['系譜 / LINEAGE','香り / AROMA','テルペン / TERPENE','歴史 / HISTORY','出典 / SOURCES']))
              detail=d.find_element(By.ID,'detail-shell');source_toggle=detail.find_element(By.CSS_SELECTOR,'.detail-sources [data-detail-toggle]');js('arguments[0].click()',source_toggle);time.sleep(.12);assert detail.find_elements(By.CSS_SELECTOR,'.source-detail-link')
              js('arguments[0].click()',detail.find_element(By.CSS_SELECTOR,'.close-detail'));wait.until(lambda x:x.find_element(By.ID,'detail-dialog').get_attribute('open') is None);time.sleep(.25);after=js('return window.scrollY');assert abs(after-before)<35,(before,after)
              report['regressions']['detail_close_scroll_sources']=True

              d.get(BASE+'?strain=wedding-cake&regression-final='+os.environ.get('GITHUB_RUN_ID','0'));wait.until(lambda x:x.find_element(By.ID,'detail-dialog').get_attribute('open') is not None);wait.until(lambda x:'正式登録名: Wedding Cake' in x.find_element(By.ID,'detail-shell').text)
              assert '正式登録名: Wedding Cake' in d.find_element(By.ID,'detail-shell').text
              report['regressions']['deep_link']=True

              d.get(BASE+'?regression-final=footer-'+os.environ.get('GITHUB_RUN_ID','0'));ready();link=d.find_element(By.CSS_SELECTOR,'#catalog-meta a[href="#cultivars"]');assert link.text.strip()=='品種一覧';js('arguments[0].click()',link);wait.until(lambda x:js('return location.hash')=='#cultivars');assert d.find_element(By.ID,'cultivars')
              report['regressions']['footer_anchor']=True
              report['robots_meta']=d.find_element(By.CSS_SELECTOR,'meta[name="robots"]').get_attribute('content')
              assert report['robots_meta']=='noindex,nofollow,noarchive'
              report['status']='PASS';OUT.joinpath('report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n');OUT.joinpath('PASS').write_text('PASS\n')
          except Exception:
              OUT.joinpath('failure.txt').write_text(traceback.format_exc());raise
          finally:d.quit()
          PY
          python /tmp/filter-regression-final/e2e.py
      - name: Confirm master unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master-migration
          git rev-parse origin/master-migration > /tmp/filter-regression-final/master-end.txt
          test "$(cat /tmp/filter-regression-final/master-start.txt)" = "$(cat /tmp/filter-regression-final/master-end.txt)"
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filter-ux-v1-regression-final-${{ github.run_id }}
          path: /tmp/filter-regression-final
          if-no-files-found: error
      - name: Cleanup verifier
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status=FAIL; test -f /tmp/filter-regression-final/PASS && status=PASS
          git fetch origin main; git checkout main; git reset --hard origin/main
          if [ -f .github/workflows/filter-ux-v1-regression-final-once.yml ]; then
            git rm .github/workflows/filter-ux-v1-regression-final-once.yml
            git config user.name filter-ux-v1-regression-final-bot
            git config user.email actions@users.noreply.github.com
            git commit -m "Remove FILTER UX V1 regression final ${GITHUB_RUN_ID} ${status} [skip ci]"
            git push origin HEAD:main
          fi
