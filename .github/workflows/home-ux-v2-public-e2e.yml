name: HOME UX V2 Public E2E

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/home-ux-v2-public-e2e.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://blazea-x.github.io/strain-atlas/
      EXPECTED_UI_COMMIT: b87b7ef0f093433e94a55ef27ffa03fb9ceb402e
      EXPECTED_MASTER_SHA: 910ae4c794193f75bb588fec0ca80941546bf8f7
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Confirm master-migration has not moved
        shell: bash
        run: |
          set -euo pipefail
          actual="$(curl -fsSL -H 'Accept: application/vnd.github+json' -H 'Authorization: Bearer ${{ github.token }}' 'https://api.github.com/repos/Blazea-x/strain-atlas/commits/master-migration' | python -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          echo "master-migration=$actual"
          test "$actual" = "$EXPECTED_MASTER_SHA"

      - name: Wait for exact public index bytes
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sha256sum index.html | awk '{print $1}')"
          ok=0
          for attempt in $(seq 1 30); do
            if curl -fsSL --retry 2 --retry-delay 1 "${SITE_URL}?home-ux-v2-e2e=${attempt}" -o /tmp/public-index.html; then
              actual="$(sha256sum /tmp/public-index.html | awk '{print $1}')"
              echo "attempt=$attempt expected=$expected actual=$actual"
              if [ "$actual" = "$expected" ]; then ok=1; break; fi
            fi
            sleep 4
          done
          test "$ok" = 1
          grep -q 'preview/home-ux-v2.js?v=2' /tmp/public-index.html
          grep -q '新着の品種' /tmp/public-index.html
          grep -q 'すべての品種' /tmp/public-index.html
          ! grep -q 'COMING LATER' /tmp/public-index.html
          ! grep -q 'data-home-target="media"' /tmp/public-index.html
          ! grep -q 'data-home-target="explore"' /tmp/public-index.html

      - name: Install browser test dependency
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version
          chromedriver --version
          python -m pip install --disable-pip-version-check --quiet selenium

      - name: Run public browser E2E
        id: browser_e2e
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time, traceback, urllib.request
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          SITE = os.environ['SITE_URL']
          OUT = Path('home-ux-v2-e2e')
          OUT.mkdir(exist_ok=True)
          result = {
              'runId': os.environ.get('GITHUB_RUN_ID'),
              'expectedUiCommit': os.environ['EXPECTED_UI_COMMIT'],
              'masterMigrationSha': os.environ['EXPECTED_MASTER_SHA'],
              'site': SITE,
              'checks': {},
              'errors': []
          }

          def fetch_json(url):
              req = urllib.request.Request(url, headers={'User-Agent':'home-ux-v2-e2e'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          catalog = fetch_json('https://raw.githubusercontent.com/Blazea-x/strain-atlas/master-migration/runtime/catalog.json')
          publication = fetch_json('https://raw.githubusercontent.com/Blazea-x/strain-atlas/master-migration/production/publication.json')
          runtime_ids = {c['id'] for c in catalog['cultivars']}
          ranked = []
          for i, entry in enumerate(publication['entries']):
              if entry.get('state') != 'published' or entry.get('strainId') not in runtime_ids:
                  continue
              ts = entry.get('publishedAt') or ''
              ranked.append((ts, i, entry['strainId']))
          ranked.sort(key=lambda x: (x[0] != '', x[0], x[1], x[2]), reverse=True)
          expected_latest = [x[2] for x in ranked[:6]]
          result['expectedLatest'] = expected_latest
          result['catalogCounts'] = catalog.get('counts', {})

          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--disable-gpu')
          options.add_argument('--window-size=390,844')
          driver = webdriver.Chrome(service=Service('/usr/bin/chromedriver'), options=options)
          wait = WebDriverWait(driver, 25)

          def check(name, fn):
              try:
                  value = fn()
                  result['checks'][name] = {'pass': True, 'detail': value if isinstance(value, (str,int,float,bool,list,dict)) else 'PASS'}
                  return value
              except Exception as e:
                  result['checks'][name] = {'pass': False, 'detail': f'{type(e).__name__}: {e}'}
                  result['errors'].append(name)
                  raise

          def load(width=390, height=844, suffix=''):
              driver.set_window_size(width, height)
              driver.get(SITE + suffix)
              wait.until(lambda d: len(d.find_elements(By.CSS_SELECTOR, '#cultivar-grid [data-strain-id]')) == catalog['counts']['cultivars'])
              wait.until(lambda d: len(d.find_elements(By.CSS_SELECTOR, '#latest-grid [data-strain-id]')) == 6)
              return True

          def ids(selector):
              return [e.get_attribute('data-strain-id') for e in driver.find_elements(By.CSS_SELECTOR, selector)]

          def set_search(value):
              driver.execute_script("const s=document.getElementById('search'); s.value=arguments[0]; s.dispatchEvent(new Event('input',{bubbles:true}));", value)
              time.sleep(.25)
              return ids('#cultivar-grid [data-strain-id]')

          try:
              check('home-load-390', lambda: load(390, 844))
              check('brand-title', lambda: driver.find_element(By.ID, 'site-title').text if 'Cannabis' in driver.find_element(By.ID, 'site-title').text else (_ for _ in ()).throw(AssertionError('brand missing')))
              check('bubble-gum-hero', lambda: (wait.until(lambda d: 'is-ready' in d.find_element(By.ID,'home-hero-image').get_attribute('class')), driver.find_element(By.ID,'home-hero-caption').text)[1] if 'Bubble Gum' in driver.find_element(By.ID,'home-hero-caption').text else (_ for _ in ()).throw(AssertionError('Bubble Gum caption missing')))
              check('no-recommendation-language', lambda: 'PASS' if not any(x in driver.find_element(By.TAG_NAME,'body').text for x in ['FEATURED','RECOMMENDED','おすすめ']) else (_ for _ in ()).throw(AssertionError('recommendation wording present')))
              check('media-and-giant-explore-removed', lambda: 'PASS' if not driver.find_elements(By.CSS_SELECTOR,'[data-home-target="media"],[data-home-target="explore"],.media-placeholder') else (_ for _ in ()).throw(AssertionError('legacy entrance remains')))
              check('search-ui', lambda: driver.find_element(By.ID,'search-title').text + ' | ' + driver.find_element(By.ID,'search').get_attribute('placeholder'))

              def legal():
                  details = driver.find_element(By.ID,'legal-alert')
                  details.find_element(By.TAG_NAME,'summary').click()
                  wait.until(lambda d: d.find_element(By.ID,'legal-alert').get_attribute('open') is not None)
                  links = details.find_elements(By.CSS_SELECTOR,'.legal-alert-sources a')
                  assert len(links) == 3
                  return {'links': len(links), 'summary': details.find_element(By.CSS_SELECTOR,'.legal-alert-copy').text}
              check('important-notice', legal)

              check('latest-six-order', lambda: ids('#latest-grid [data-strain-id]') if ids('#latest-grid [data-strain-id]') == expected_latest else (_ for _ in ()).throw(AssertionError(f'expected {expected_latest}, got {ids("#latest-grid [data-strain-id]")}')))
              before = ids('#latest-grid [data-strain-id]')
              driver.refresh()
              wait.until(lambda d: len(d.find_elements(By.CSS_SELECTOR,'#latest-grid [data-strain-id]')) == 6)
              check('latest-reload-stable', lambda: ids('#latest-grid [data-strain-id]') if ids('#latest-grid [data-strain-id]') == before else (_ for _ in ()).throw(AssertionError('latest order changed')))
              check('all-cultivars-38', lambda: len(ids('#cultivar-grid [data-strain-id]')) if len(ids('#cultivar-grid [data-strain-id]')) == catalog['counts']['cultivars'] else (_ for _ in ()).throw(AssertionError('catalog count mismatch')))

              def mobile_columns(width):
                  load(width, 844, f'?viewport={width}')
                  cards = driver.find_elements(By.CSS_SELECTOR,'#latest-grid [data-strain-id]')
                  tops = [round(c.rect['y']) for c in cards[:3]]
                  assert tops[0] == tops[1] and tops[2] > tops[1]
                  return tops
              check('mobile-390-two-columns', lambda: mobile_columns(390))
              check('mobile-430-two-columns', lambda: mobile_columns(430))
              check('desktop-load', lambda: load(1280, 900, '?viewport=desktop'))

              def filters():
                  driver.find_element(By.CSS_SELECTOR,'[data-explore="sativa"]').click(); time.sleep(.2)
                  sativa = len(ids('#cultivar-grid [data-strain-id]'))
                  assert sativa == len(catalog['explore']['sativa'])
                  driver.find_element(By.CSS_SELECTOR,'[data-explore="all"]').click(); time.sleep(.2)
                  assert len(ids('#cultivar-grid [data-strain-id]')) == catalog['counts']['cultivars']
                  return {'sativa': sativa, 'all': catalog['counts']['cultivars']}
              check('type-filter', filters)

              search_expectations = {
                  'Bubble Gum': 'bubble-gum',
                  'Wedding Cake': 'wedding-cake-s1',
                  'Humboldt CSI': 'wedding-cake-s1',
                  'S1': 'f1-durb-s1',
                  'Kush': 'bubba-kush-s1'
              }
              search_results = {}
              for query, required in search_expectations.items():
                  found = set_search(query)
                  assert required in found, (query, required, found)
                  search_results[query] = {'count': len(found), 'contains': required}
              check('search-five-cases', lambda: search_results)
              check('search-clear-restores-all', lambda: len(set_search('')) if len(set_search('')) == catalog['counts']['cultivars'] else (_ for _ in ()).throw(AssertionError('clear did not restore all')))

              def search_resets_filter():
                  driver.find_element(By.CSS_SELECTOR,'[data-explore="sativa"]').click(); time.sleep(.2)
                  found = set_search('Wedding Cake S1')
                  assert 'wedding-cake-s1' in found
                  assert driver.find_element(By.CSS_SELECTOR,'[data-explore="all"]').get_attribute('class').find('is-active') >= 0
                  return found
              check('search-targets-full-catalog', search_resets_filter)

              def card_identity(query, sid, expected_name, expected_gen):
                  set_search(query)
                  card = driver.find_element(By.CSS_SELECTOR, f'#cultivar-grid [data-strain-id="{sid}"]')
                  name = card.find_element(By.CSS_SELECTOR,'.tile-display-name').text
                  gen = card.find_element(By.CSS_SELECTOR,'.generation-badge').text
                  assert name == expected_name and gen == expected_gen
                  return {'name':name,'generation':gen}
              check('wedding-cake-s1-display', lambda: card_identity('Wedding Cake S1','wedding-cake-s1','Wedding Cake','S1'))
              check('bubba-kush-s1-display', lambda: card_identity('Bubba Kush S1','bubba-kush-s1','Bubba Kush','S1'))
              check('f1-durb-s1-display', lambda: card_identity('F1 Durb S1','f1-durb-s1','F1 Durb','S1'))
              check('ak47-f1-display', lambda: card_identity('AK-47','ak-47','AK-47','F1'))

              def detail_test():
                  set_search('Wedding Cake S1')
                  card = driver.find_element(By.CSS_SELECTOR,'#cultivar-grid [data-strain-id="wedding-cake-s1"]')
                  driver.execute_script('arguments[0].scrollIntoView({block:"center"})', card)
                  y = driver.execute_script('return window.scrollY')
                  card.click()
                  wait.until(lambda d: d.find_element(By.ID,'detail-dialog').get_attribute('open') is not None)
                  formal = driver.find_element(By.CSS_SELECTOR,'.detail-registered-name').text
                  heading = driver.find_element(By.CSS_SELECTOR,'.detail-hero-copy h2').text
                  assert '正式登録名: Wedding Cake S1' in formal
                  assert 'Wedding Cake' in heading and 'S1' in heading
                  for text in ['系譜 / LINEAGE','香り / AROMA','出典 / SOURCES']:
                      assert text in driver.find_element(By.ID,'detail-shell').text
                  driver.find_element(By.CSS_SELECTOR,'.close-detail').click()
                  wait.until(lambda d: d.find_element(By.ID,'detail-dialog').get_attribute('open') is None)
                  time.sleep(.2)
                  y2 = driver.execute_script('return window.scrollY')
                  assert abs(y2-y) < 40, (y,y2)
                  return {'formal':formal,'scrollDelta':abs(y2-y)}
              check('detail-and-scroll-restore', detail_test)

              def deep_link():
                  driver.get(SITE + '?strain=ak-47')
                  wait.until(lambda d: d.find_element(By.ID,'detail-dialog').get_attribute('open') is not None)
                  formal = wait.until(lambda d: d.find_element(By.CSS_SELECTOR,'.detail-registered-name').text)
                  assert formal == '正式登録名: AK-47'
                  return formal
              check('direct-strain-deep-link', deep_link)

              def footer():
                  driver.get(SITE)
                  wait.until(lambda d: '38 品種' in d.find_element(By.ID,'catalog-meta').text)
                  text = driver.find_element(By.ID,'catalog-meta').text
                  assert f"{catalog['counts']['cultivars']} 品種" in text
                  assert f"{catalog['counts']['sources']} 出典" in text
                  assert f"{catalog['counts']['entities']} 関連組織・ブリーダー" in text
                  return text
              check('footer-runtime-counts', footer)

              driver.set_window_size(390,844)
              driver.get(SITE)
              wait.until(lambda d: len(d.find_elements(By.CSS_SELECTOR,'#latest-grid [data-strain-id]')) == 6)
              driver.save_screenshot(str(OUT/'public-home-390.png'))
              driver.set_window_size(1280,900)
              driver.get(SITE)
              wait.until(lambda d: len(d.find_elements(By.CSS_SELECTOR,'#latest-grid [data-strain-id]')) == 6)
              driver.save_screenshot(str(OUT/'public-home-desktop.png'))
              result['checks']['screenshots'] = {'pass': True, 'detail': ['public-home-390.png','public-home-desktop.png']}

              # Real browser mock: block only publication registry. Catalog/main UI must keep working.
              driver.execute_cdp_cmd('Network.enable', {})
              driver.execute_cdp_cmd('Network.setBlockedURLs', {'urls':['*production/publication.json*']})
              driver.set_window_size(390,844)
              driver.get(SITE + '?publication-failure=e2e')
              wait.until(lambda d: len(d.find_elements(By.CSS_SELECTOR,'#cultivar-grid [data-strain-id]')) == catalog['counts']['cultivars'])
              state = wait.until(lambda d: d.find_element(By.ID,'latest-state'))
              wait.until(lambda d: '新着情報を取得できません' in d.find_element(By.ID,'latest-state').text)
              assert len(driver.find_elements(By.CSS_SELECTOR,'#cultivar-grid [data-strain-id]')) == catalog['counts']['cultivars']
              assert driver.find_element(By.ID,'site-title').is_displayed()
              assert driver.find_element(By.ID,'search').is_displayed()
              result['checks']['publication-failure-fail-closed'] = {'pass': True, 'detail': state.text}
              driver.execute_cdp_cmd('Network.setBlockedURLs', {'urls':[]})

          except Exception:
              result['errors'].append('browser-e2e-aborted')
              result['traceback'] = traceback.format_exc()
          finally:
              result['pass'] = not result['errors'] and all(v.get('pass') for v in result['checks'].values())
              (OUT/'result.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
              driver.quit()

          if not result['pass']:
              raise SystemExit(1)
          PY
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Upload public E2E screenshots and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-ux-v2-public-e2e-${{ github.run_id }}
          path: home-ux-v2-e2e/
          if-no-files-found: warn

      - name: Persist compact E2E result for connector inspection
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/home-ux-v2-e2e
          if [ -f home-ux-v2-e2e/result.json ]; then
            cp home-ux-v2-e2e/result.json .github/home-ux-v2-e2e/result.json
          else
            printf '{"pass":false,"runId":"%s","errors":["result-missing"]}\n' '${{ github.run_id }}' > .github/home-ux-v2-e2e/result.json
          fi
          git config user.name 'home-ux-v2-e2e-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/home-ux-v2-e2e/result.json
          git commit -m 'Record HOME UX V2 public E2E [skip ci]'
          git push origin HEAD:main

      - name: Fail job when browser E2E failed
        if: steps.browser_e2e.outcome != 'success'
        shell: bash
        run: exit 1
