name: FILTER UX V1 Byte Apply Once
"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/filter-ux-v1-byte-apply-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      EXPECTED_BASE: b50cd646d28f707e6d1e444fd2957942948e9c65
      EXPECTED_MASTER: 910ae4c794193f75bb588fec0ca80941546bf8f7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard remote state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main master-migration
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          test "$(git diff --name-only "$EXPECTED_BASE"..HEAD)" = ".github/workflows/filter-ux-v1-byte-apply-once.yml"
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
          test "$(git rev-parse origin/master-migration)" = "$EXPECTED_MASTER"
      - name: Apply locally verified FILTER UX V1 patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/filter-ux-v1.patch.gz.b64 <<'B64'
          
          B64
          base64 -d /tmp/filter-ux-v1.patch.gz.b64 | gzip -dc > /tmp/filter-ux-v1-apply.sh
          bash /tmp/filter-ux-v1-apply.sh
      - name: Verify exact UI diff
        shell: bash
        run: |
          set -euo pipefail
          node --check preview/app.js
          node --check preview/home-ux-v2.js
          grep -q 'id="filter-disclosure"' index.html
          grep -q 'preview/app.js?v=6' index.html
          grep -q 'preview/home-ux-v2.js?v=4' index.html
          grep -q 'preview/home-entrance-v1.css?v=5' index.html
          test "$(grep -o 'id="explore"' index.html | wc -l)" -eq 1
          ! grep -q 'data-explore="unclassified"' index.html
          grep -q 'const matchesFilters' preview/app.js
          grep -q 'FILTER UX V1' preview/home-entrance-v1.css
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "index.html preview/app.js preview/home-entrance-v1.css preview/home-ux-v2.js "
      - name: Commit UI atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name filter-ux-v1-bot
          git config user.email actions@users.noreply.github.com
          git add index.html preview/app.js preview/home-ux-v2.js preview/home-entrance-v1.css
          git commit -m "Implement FILTER UX V1"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD^)"
          git push origin HEAD:main
      - name: Remove one-shot workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          if [ -f .github/workflows/filter-ux-v1-byte-apply-once.yml ]; then
            git rm .github/workflows/filter-ux-v1-byte-apply-once.yml
            git config user.name filter-ux-v1-bot
            git config user.email actions@users.noreply.github.com
            git commit -m "Remove FILTER UX V1 byte helper [skip ci]"
            git push origin HEAD:main
          fi
