name: FILTER UX V1 Pages Dispatch Once
"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/filter-ux-v1-pages-dispatch-once.yml"
permissions:
  contents: write
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      UI_SHA: 3dab30ba2403a4c030c31ae88af77a0165563ba4
      TEMP_BRANCH: filter-ux-v1-pages-e2e-ref
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dispatch exact UI commit to Pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name filter-ux-v1-pages-bot
          git config user.email actions@users.noreply.github.com
          git push origin "$UI_SHA:refs/heads/$TEMP_BRANCH"
          gh workflow run deploy-public-ui-pages.yml --ref "$TEMP_BRANCH"
          for i in $(seq 1 45); do
            json="$(gh run list --workflow deploy-public-ui-pages.yml --limit 20 --json databaseId,headSha,status,conclusion,event,createdAt,url --jq '[.[] | select(.headSha == env.UI_SHA and .event == "workflow_dispatch")][0]')"
            if [ -n "$json" ] && [ "$json" != "null" ]; then
              status="$(printf '%s' "$json" | jq -r .status)"
              conclusion="$(printf '%s' "$json" | jq -r .conclusion)"
              if [ "$status" = "completed" ]; then
                printf '%s\n' "$json" > /tmp/pages-run.json
                test "$conclusion" = "success"
                exit 0
              fi
            fi
            sleep 4
          done
          echo "Timed out waiting for exact FILTER UX V1 Pages deployment" >&2
          exit 1
      - name: Delete temporary deployment ref
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete "$TEMP_BRANCH" || true
      - name: Remove dispatcher workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          if [ -f .github/workflows/filter-ux-v1-pages-dispatch-once.yml ]; then
            git rm .github/workflows/filter-ux-v1-pages-dispatch-once.yml
            git config user.name filter-ux-v1-pages-bot
            git config user.email actions@users.noreply.github.com
            git commit -m "Remove FILTER UX V1 Pages dispatcher [skip ci]"
            git push origin HEAD:main
          fi
