name: Preserve OpenAI multi-visuals once

on:
  push:
    branches: [master-migration]
    paths:
      - ".github/workflows/preserve-openai-multivisuals-once.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: preserve-openai-multivisuals-once
  cancel-in-progress: false

jobs:
  preserve:
    if: github.repository == 'Blazea-x/strain-atlas'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@v4
        with:
          ref: master-migration
          fetch-depth: 0

      - name: Guard remote base and one-shot trigger
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE="f307f10657a1e0fbe3b5eb9d1ea1553cebbfcda1"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          git fetch origin master-migration
          test "$(git rev-parse origin/master-migration)" = "$GITHUB_SHA"
          changed="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          test "$changed" = ".github/workflows/preserve-openai-multivisuals-once.yml"
          echo "BASE GUARD: PASS"

      - name: Download preserved benchmark artifact only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/openai-preserved"
          gh run download 32196764747 \
            --repo "$GITHUB_REPOSITORY" \
            --name "openai-pending-cultivar-benchmark-32196764747" \
            --dir "$RUNNER_TEMP/openai-preserved"
          test -f "$RUNNER_TEMP/openai-preserved/benchmark-summary.json"
          echo "ARTIFACT DOWNLOAD: PASS"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image conversion dependency
        run: python -m pip install --disable-pip-version-check --quiet Pillow

      - name: Verify source bytes and prepare preserved visuals
        env:
          SOURCE_DIR: ${{ runner.temp }}/openai-preserved
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import datetime, hashlib, json, os

          ROOT = Path.cwd()
          SRC = Path(os.environ['SOURCE_DIR'])
          RUN_ID = 'content-production-20260818T060700Z-01'
          WORKFLOW_RUN_ID = 32196764747
          ARTIFACT_ID = 9346290136
          ARTIFACT_NAME = 'openai-pending-cultivar-benchmark-32196764747'
          BENCHMARK_SOURCE_COMMIT = 'bb48e32fd0bf7fa429b1d742cca710b27a09e122'
          NOW = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')

          targets = {
              'kali-mist': {
                  'name': 'Kali Mist',
                  'primary_file': 'kali-mist__candidate-1.jpg',
                  'primary_sha': 'd43c11efcb13d26e494af126dc80b8396b4e8db7d097e2f890f71961c927a498',
                  'secondary_file': 'kali-mist__candidate-2.jpg',
                  'secondary_sha': '86185b3c410ca0fd49f3e0704828a1e532206c8b5def1fe53dad6d8920142f67',
              },
              'warlock': {
                  'name': 'Warlock',
                  'primary_file': 'warlock__candidate-1.jpg',
                  'primary_sha': '068cc399ffe16c521e4134e2fb76d75ff677e8066c984629fb85451ada7405cf',
                  'secondary_file': 'warlock__candidate-2.jpg',
                  'secondary_sha': '822db5cadd7eddc4b0f6411eabbc09f3212ef5215669f4220a1e8c961dac1539',
              },
          }

          def load(path):
              return json.loads(path.read_text(encoding='utf-8'))

          def save(path, obj):
              path.write_text(json.dumps(obj, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          def sha256_file(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def blob_sha(path):
              data = path.read_bytes()
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()

          summary = load(SRC / 'benchmark-summary.json')
          assert summary.get('runId') == WORKFLOW_RUN_ID
          assert summary.get('model') == 'gpt-image-2'
          assert summary.get('quality') == 'high'
          assert summary.get('sourceCommit') == BENCHMARK_SOURCE_COMMIT
          assert summary.get('successCount') == 4
          assert summary.get('productionMutationCount') == 0

          publication_path = ROOT / 'production/publication.json'
          publication = load(publication_path)
          pub = {x['strainId']: x for x in publication['entries']}
          run_path = ROOT / 'production/runs' / f'{RUN_ID}.json'
          run = load(run_path)
          assert run.get('status') == 'ACTIVE'
          assert run.get('publicationPolicy') == 'batch'
          assert run.get('mode') == 'new-publication'
          run_items = {x['strainId']: x for x in run['items']}

          for strain_id, spec in targets.items():
              strain_path = ROOT / 'strains' / strain_id / 'strain.json'
              manifest_path = ROOT / 'production/manifests' / f'{strain_id}.json'
              strain = load(strain_path)
              manifest = load(manifest_path)
              item = run_items[strain_id]

              assert strain.get('visuals') == [], f'{strain_id}: visuals changed before preservation'
              assert pub[strain_id].get('state') == 'pending', f'{strain_id}: publication changed'
              assert pub[strain_id].get('introducedByRun') == RUN_ID
              assert item.get('productionPhase') == 'IMAGE_PENDING', f'{strain_id}: productionPhase changed'
              assert manifest.get('runId') == RUN_ID
              assert manifest.get('strainId') == strain_id
              assert manifest.get('approvalStatus') == 'pending', f'{strain_id}: manifest approval changed'
              assert manifest.get('revision') == 1 and manifest.get('attempt') == 1
              assert manifest.get('expectedPrimaryPath') == f'strains/{strain_id}/images/generated/primary.webp'

              source_specs = [
                  (1, 'primary', spec['primary_file'], spec['primary_sha'], 'primary.webp'),
                  (2, 'secondary', spec['secondary_file'], spec['secondary_sha'], 'secondary-1.webp'),
              ]
              artifacts = []
              for candidate, role, filename, expected_sha, output_name in source_specs:
                  source = SRC / filename
                  assert source.is_file(), f'missing source artifact file: {filename}'
                  actual_sha = sha256_file(source)
                  assert actual_sha == expected_sha, f'{strain_id} candidate {candidate}: source SHA-256 mismatch'
                  with Image.open(source) as image:
                      image.load()
                      assert image.format == 'JPEG'
                      assert image.size == (1024, 1536)
                      out = ROOT / 'strains' / strain_id / 'images' / 'generated' / output_name
                      out.parent.mkdir(parents=True, exist_ok=True)
                      image.save(out, format='WEBP', quality=92, method=6)
                  data = out.read_bytes()
                  assert len(data) >= 12 and data[:4] == b'RIFF' and data[8:12] == b'WEBP'
                  with Image.open(out) as check:
                      check.load()
                      assert check.format == 'WEBP'
                      assert check.size == (1024, 1536)
                  artifacts.append({
                      'candidate': candidate,
                      'role': role,
                      'sourceFile': filename,
                      'sourceSha256': actual_sha,
                      'sourceByteLength': source.stat().st_size,
                      'processedPath': str(out.relative_to(ROOT)),
                      'processedSha256': sha256_file(out),
                      'processedBlobSha': blob_sha(out),
                      'width': 1024,
                      'height': 1536,
                      'conversion': {'format': 'WEBP', 'quality': 92, 'method': 6},
                  })

              meta = manifest['visualMetadataSnapshot']
              primary = {
                  'role': 'primary',
                  'src': artifacts[0]['processedPath'],
                  'aiGenerated': meta['aiGenerated'],
                  'sourceType': meta['sourceType'],
                  'rights': meta['rights'],
                  'alt': meta['alt'],
                  'scope': meta['scope'],
              }
              secondary = {
                  'role': 'secondary',
                  'src': artifacts[1]['processedPath'],
                  'aiGenerated': meta['aiGenerated'],
                  'sourceType': meta['sourceType'],
                  'rights': meta['rights'],
                  'alt': meta['alt'] + '（別カット）',
                  'scope': meta['scope'],
              }
              assert primary['aiGenerated'] is True and secondary['aiGenerated'] is True
              strain['visuals'] = [primary, secondary]
              strain['updatedAt'] = '2026-08-19'
              save(strain_path, strain)

              manifest['approvalStatus'] = 'approved'
              manifest['approvedAt'] = NOW
              manifest['approvalType'] = 'human-visual-review'
              manifest['approvedManifestRevision'] = manifest['revision']
              manifest['approvedAttempt'] = manifest['attempt']
              manifest['approvedSourceSha256'] = spec['primary_sha']
              manifest['processedPrimaryBlobSha'] = artifacts[0]['processedBlobSha']
              manifest['processedPrimarySha256'] = artifacts[0]['processedSha256']
              manifest['width'] = artifacts[0]['width']
              manifest['height'] = artifacts[0]['height']
              manifest['generationProvenance'] = {
                  'provider': 'OpenAI',
                  'model': 'gpt-image-2',
                  'quality': 'high',
                  'requestedSize': '1024x1536',
                  'outputFormat': 'jpeg',
                  'workflowRunId': WORKFLOW_RUN_ID,
                  'artifactId': ARTIFACT_ID,
                  'artifactName': ARTIFACT_NAME,
                  'benchmarkSourceCommit': BENCHMARK_SOURCE_COMMIT,
                  'additionalGenerationRequests': 0,
              }
              manifest['visualArtifacts'] = artifacts
              manifest.setdefault('audit', []).append({
                  'severity': 'INFO',
                  'code': 'IMAGE_APPROVED',
                  'at': NOW,
                  'productionPhase': 'IMAGE_PENDING',
                  'note': 'Human visual review approved preserved OpenAI benchmark candidate 1 as primary and candidate 2 as secondary; source SHA-256 values are pinned separately.',
              })
              manifest['audit'].append({
                  'severity': 'INFO',
                  'code': 'OPENAI_BENCHMARK_ARTIFACT_PRESERVED',
                  'at': NOW,
                  'productionPhase': 'IMAGE_PENDING',
                  'note': f'Preserved existing workflow run {WORKFLOW_RUN_ID} artifact {ARTIFACT_ID}; provider OpenAI, model gpt-image-2; no new generation request was sent.',
              })
              save(manifest_path, manifest)

          print('SOURCE SHA-256: 4 / 4 PASS')
          print('WEBP CONVERSION: 4 / 4 PASS (quality=92 method=6)')
          print('OPENAI ADDITIONAL GENERATION REQUESTS: 0')
          PY

      - name: Create local preservation commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "strain-atlas-image-preservation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            strains/kali-mist/strain.json \
            strains/kali-mist/images/generated/primary.webp \
            strains/kali-mist/images/generated/secondary-1.webp \
            strains/warlock/strain.json \
            strains/warlock/images/generated/primary.webp \
            strains/warlock/images/generated/secondary-1.webp \
            production/manifests/kali-mist.json \
            production/manifests/warlock.json
          git commit -m "[IMAGE V2] Preserve OpenAI Kali Mist and Warlock visuals"
          echo "PRESERVATION_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Bind provenance and advance to VISUAL_LINKED
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import datetime, json, os

          ROOT = Path.cwd()
          RUN_ID = 'content-production-20260818T060700Z-01'
          COMMIT = os.environ['PRESERVATION_COMMIT']
          NOW = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          source_shas = {
              'kali-mist': ('d43c11efcb13d26e494af126dc80b8396b4e8db7d097e2f890f71961c927a498', '86185b3c410ca0fd49f3e0704828a1e532206c8b5def1fe53dad6d8920142f67'),
              'warlock': ('068cc399ffe16c521e4134e2fb76d75ff677e8066c984629fb85451ada7405cf', '822db5cadd7eddc4b0f6411eabbc09f3212ef5215669f4220a1e8c961dac1539'),
          }

          def load(path): return json.loads(path.read_text(encoding='utf-8'))
          def save(path, obj): path.write_text(json.dumps(obj, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          for strain_id in source_shas:
              manifest_path = ROOT / 'production/manifests' / f'{strain_id}.json'
              manifest = load(manifest_path)
              assert manifest['approvalStatus'] == 'approved'
              assert manifest['approvedSourceSha256'] == source_shas[strain_id][0]
              assert len(manifest['visualArtifacts']) == 2
              assert manifest['visualArtifacts'][1]['sourceSha256'] == source_shas[strain_id][1]
              manifest['imageInboxCommit'] = COMMIT
              manifest['imageProcessingCommit'] = COMMIT
              manifest.setdefault('audit', []).append({
                  'severity': 'INFO',
                  'code': 'IMAGE_PROCESSED',
                  'at': NOW,
                  'productionPhase': 'IMAGE_READY',
                  'note': f'Artifact-preservation commit {COMMIT} stored primary and secondary WebP files using IMAGE UPLOAD INBOX V1-equivalent conversion settings.',
              })
              save(manifest_path, manifest)

          run_path = ROOT / 'production/runs' / f'{RUN_ID}.json'
          run = load(run_path)
          assert run['status'] == 'ACTIVE'
          assert run['publicationPolicy'] == 'batch'
          items = {x['strainId']: x for x in run['items']}
          for strain_id, (primary_sha, secondary_sha) in source_shas.items():
              item = items[strain_id]
              assert item['productionPhase'] == 'IMAGE_PENDING'
              item['approval'] = {
                  'approvalType': 'human-visual-review',
                  'approvedAt': NOW,
                  'manifestRevision': item['manifestRevision'],
                  'primarySourceSha256': primary_sha,
                  'secondarySourceSha256': secondary_sha,
                  'provider': 'OpenAI',
                  'model': 'gpt-image-2',
                  'workflowRunId': 32196764747,
                  'artifactId': 9346290136,
              }
              item['commits']['imageInboxCommit'] = COMMIT
              item['commits']['imageProcessingCommit'] = COMMIT
              item['commits']['visualsCommit'] = COMMIT
              item.setdefault('audit', []).append({'severity':'INFO','code':'PHASE_TRANSITION','fromPhase':'IMAGE_PENDING','toPhase':'IMAGE_READY','at':NOW})
              item['audit'].append({'severity':'INFO','code':'PHASE_TRANSITION','fromPhase':'IMAGE_READY','toPhase':'VISUAL_LINKED','at':NOW})
              item['productionPhase'] = 'VISUAL_LINKED'
              item['previousStablePhase'] = 'VISUAL_LINKED'
          run['updatedAt'] = NOW
          save(run_path, run)
          PY

      - name: Verify runtime build remains publication-filtered
        shell: bash
        run: |
          set -euo pipefail
          cp runtime/catalog.json "$RUNNER_TEMP/catalog-before.json"
          cp data.js "$RUNNER_TEMP/data-before.js"
          cp sources.js "$RUNNER_TEMP/sources-before.js"
          node scripts/build-runtime-data.mjs
          cp runtime/catalog.json "$RUNNER_TEMP/catalog-built.json"
          python <<'PY'
          import json, os
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP'])
          before=json.loads((t/'catalog-before.json').read_text())
          built=json.loads((t/'catalog-built.json').read_text())
          before.pop('generatedAt',None); built.pop('generatedAt',None)
          assert before == built, 'publication-filtered runtime payload changed while publication remains pending'
          assert (Path('data.js').read_bytes() == (t/'data-before.js').read_bytes())
          assert (Path('sources.js').read_bytes() == (t/'sources-before.js').read_bytes())
          print('RUNTIME BUILD: PASS; pending cultivars correctly remain outside public runtime')
          PY
          cp "$RUNNER_TEMP/catalog-before.json" runtime/catalog.json
          cp "$RUNNER_TEMP/data-before.js" data.js
          cp "$RUNNER_TEMP/sources-before.js" sources.js

      - name: Remove one-shot workflow before final commit
        run: rm .github/workflows/preserve-openai-multivisuals-once.yml

      - name: Validate MASTER and CONTENT PRODUCTION
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-master-data.mjs
          node scripts/audit-content-production.mjs
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          root=Path('.')
          pub={x['strainId']:x for x in json.loads((root/'production/publication.json').read_text())['entries']}
          run=json.loads((root/'production/runs/content-production-20260818T060700Z-01.json').read_text())
          items={x['strainId']:x for x in run['items']}
          for sid in ('kali-mist','warlock'):
              s=json.loads((root/'strains'/sid/'strain.json').read_text())
              assert len(s['visuals']) == 2
              assert sum(v['role']=='primary' for v in s['visuals']) == 1
              assert sum(v['role']=='secondary' for v in s['visuals']) == 1
              for v in s['visuals']:
                  p=root/v['src']; assert p.is_file()
                  with Image.open(p) as im: im.load(); assert im.format=='WEBP' and im.size==(1024,1536)
              assert pub[sid]['state'] == 'pending'
              assert items[sid]['productionPhase'] == 'VISUAL_LINKED'
          print('CUSTOM MULTI-VISUAL INTEGRITY: PASS')
          PY

      - name: Commit final provenance/state metadata
        shell: bash
        run: |
          set -euo pipefail
          git add \
            production/manifests/kali-mist.json \
            production/manifests/warlock.json \
            production/runs/content-production-20260818T060700Z-01.json \
            .github/workflows/preserve-openai-multivisuals-once.yml
          git commit -m "[IMAGE V2] Link preserved multi-visuals to production"
          echo "FINAL_LOCAL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Recheck remote and atomically push local commit chain
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master-migration
          test "$(git rev-parse origin/master-migration)" = "$GITHUB_SHA"
          git push origin HEAD:master-migration
          echo "MASTER FINAL PUSH: $(git rev-parse HEAD)"
          echo "OPENAI ADDITIONAL GENERATION REQUESTS: 0"
          echo "ADDITIONAL OPENAI API COST: $0.00"
