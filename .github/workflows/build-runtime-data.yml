# IMAGE-GATED validation trigger
name: Build MASTER runtime catalog

on:
  push:
    branches: [master-migration]
    paths:
      - "strains/**"
      - "sources/**"
      - "entities/**"
      - "schemas/**"
      - "production/publication.json"
      - "production/runs/**"
      - "production/manifests/**"
      - "production/_system/**"
      - "scripts/validate-master-data.mjs"
      - "scripts/validate-cultivar-publication.mjs"
      - "scripts/test-data-first-pipeline.mjs"
      - "scripts/list-image-backlog.mjs"
      - "scripts/build-runtime-data.mjs"
      - "scripts/audit-content-production.mjs"
      - "scripts/content-production-state.mjs"
      - ".github/workflows/build-runtime-data.yml"
  pull_request:
    branches: [master-migration]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MASTER data
        uses: actions/checkout@v4
        with:
          ref: master-migration
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Checkout main for read-only protection audit
        uses: actions/checkout@v4
        with:
          ref: main
          path: .content-production-main-audit

      - name: Validate MASTER data
        run: node scripts/validate-master-data.mjs

      - name: Validate cultivar-level publication gates
        run: node scripts/validate-cultivar-publication.mjs

      - name: DATA-FIRST / IMAGE-LATER read-only fixture
        run: node scripts/test-data-first-pipeline.mjs

      - name: IMAGE backlog read-only smoke check
        run: node scripts/list-image-backlog.mjs --json

      - name: CONTENT PRODUCTION V1 read-only dry run
        run: node scripts/audit-content-production.mjs --main-dir=.content-production-main-audit

      - name: Build publication-filtered runtime catalog and current display data
        run: node scripts/build-runtime-data.mjs

      - name: Commit generated runtime and display data
        run: |
          if git diff --quiet -- runtime/catalog.json data.js sources.js && git ls-files --error-unmatch runtime/catalog.json >/dev/null 2>&1; then
            echo "Generated data is unchanged"
          else
            git config user.name "strain-atlas-bot"
            git config user.email "actions@users.noreply.github.com"
            git add runtime/catalog.json data.js sources.js
            git commit -m "Build MASTER runtime and display data"
            git push origin HEAD:master-migration
          fi

      - name: Checkout published site shell from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: pages-site

      - name: Verify published site shell
        run: |
          test -f pages-site/index.html
          test -f pages-site/preview/app.js
          grep -q 'preview/app.js' pages-site/index.html
          grep -q 'master-migration/runtime/catalog.json' pages-site/preview/app.js
          echo "Publishing main UI shell with master-migration runtime data"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "pages-site"

  deploy-pages:
    needs: build-runtime
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
