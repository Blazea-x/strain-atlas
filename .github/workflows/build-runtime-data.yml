name: Build MASTER runtime catalog

on:
  push:
    branches: [master-migration]
    paths:
      - "strains/**"
      - "sources/**"
      - "entities/**"
      - "schemas/**"
      - "scripts/validate-master-data.mjs"
      - "scripts/build-runtime-data.mjs"
      - ".github/workflows/build-runtime-data.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master-migration

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate MASTER data
        run: node scripts/validate-master-data.mjs

      - name: Build runtime catalog and current display data
        run: node scripts/build-runtime-data.mjs

      - name: Commit generated runtime and display data
        run: |
          if git diff --quiet -- runtime/catalog.json data.js sources.js && git ls-files --error-unmatch runtime/catalog.json >/dev/null 2>&1; then
            echo "Generated data is unchanged"
          else
            git config user.name "strain-atlas-bot"
            git config user.email "actions@users.noreply.github.com"
            git add runtime/catalog.json data.js sources.js
            git commit -m "Build MASTER runtime and display data"
            git push origin HEAD:master-migration
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."

  deploy-pages:
    needs: build-runtime
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
