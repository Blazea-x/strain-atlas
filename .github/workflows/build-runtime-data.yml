name: Build MASTER runtime catalog

on:
  push:
    branches: [master-migration]
    paths:
      - "strains/**"
      - "sources/**"
      - "entities/**"
      - "schemas/**"
      - "scripts/validate-master-data.mjs"
      - "scripts/build-runtime-data.mjs"
      - ".github/workflows/build-runtime-data.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master-migration

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate MASTER data
        run: node scripts/validate-master-data.mjs

      - name: Build runtime catalog
        run: node scripts/build-runtime-data.mjs

      - name: Commit generated runtime data
        run: |
          if git diff --quiet -- runtime/catalog.json && git ls-files --error-unmatch runtime/catalog.json >/dev/null 2>&1; then
            echo "runtime/catalog.json is unchanged"
            exit 0
          fi
          git config user.name "strain-atlas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/catalog.json
          git commit -m "Build MASTER runtime catalog"
          git push origin HEAD:master-migration
