name: Display Repair Finalize V2 - Dr Grinspoon + Malawi

on:
  push:
    branches: [master-migration]
    paths:
      - .github/workflows/display-repair-finalize-v2.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master-migration
          fetch-depth: 0

      - name: Bootstrap Dr Grinspoon manifest as NEEDS_REVIEW
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { visualPreparationHash } from './scripts/content-production-state.mjs';
          const summary=JSON.parse(fs.readFileSync('.display-repair-staging/dr-grinspoon-generation-summary.json','utf8'));
          if(summary.status!=='READY_FOR_VISUAL_REVIEW') throw new Error('Generation summary state changed');
          if(summary.n!==1 || summary.model!=='gpt-image-2' || summary.quality!=='high') throw new Error('Generation contract mismatch');
          const manifest={
            schemaVersion:1, manifestVersion:1,
            manifestId:'image-manifest-dr-grinspoon-display-repair-20260819',
            runId:'display-repair-dr-grinspoon-20260819', strainId:'dr-grinspoon', revision:1, attempt:1,
            sourceStockPath:null, sourceStockBlobSha:null,
            visualPreparationHash:visualPreparationHash({promptSnapshot:summary.promptSnapshot,evidenceSnapshot:summary.evidenceSnapshot,visualMetadataSnapshot:summary.visualMetadataSnapshot}),
            generatedFromManifestVersion:null,
            promptSnapshot:summary.promptSnapshot,
            evidenceSnapshot:summary.evidenceSnapshot,
            visualMetadataSnapshot:summary.visualMetadataSnapshot,
            expectedInboxFilename:'dr-grinspoon.jpg',
            expectedPrimaryPath:'strains/dr-grinspoon/images/generated/primary.webp',
            generatedAt:'2026-08-19T01:48:27Z',
            approvalStatus:'pending', approvedAt:null, approvalType:null, approvedManifestRevision:null, approvedAttempt:null, approvedSourceSha256:null,
            imageInboxCommit:null, imageProcessingCommit:null, processedPrimaryBlobSha:null, processedPrimarySha256:null, width:null, height:null,
            reviewStatus:'NEEDS_REVIEW',
            reviewReason:'Generated candidate visually rejected: flower clusters resembled long hanging berry/grape bunches rather than a botanically plausible Dr Grinspoon bead-like cannabis flower structure.',
            generation:{provider:'OpenAI',model:summary.model,quality:summary.quality,size:summary.size,outputFormat:summary.outputFormat,n:summary.n,workflowRunId:summary.runId,artifactId:9349217969,candidateSha256:summary.sha256,candidateBytes:summary.bytes,candidateDimensions:summary.dimensions,additionalOpenAiCostUsd:summary.additionalOpenAiCostUsd},
            audit:[
              {at:'2026-08-19T01:48:27Z',action:'MANIFEST_BOOTSTRAP',status:'generated',note:'Bootstrap from formal source-backed prompt/evidence for one-image display repair attempt.'},
              {at:'2026-08-19T01:49:00Z',action:'HUMAN_VISUAL_REVIEW',status:'NEEDS_REVIEW',note:'Candidate not promoted to primary.webp or visuals because its hanging fruit-like clusters were not botanically credible cannabis flowers.'}
            ]
          };
          fs.writeFileSync('production/manifests/dr-grinspoon.json',JSON.stringify(manifest,null,2)+'\n');
          NODE

      - name: MASTER validation
        run: node scripts/validate-master-data.mjs

      - name: CONTENT PRODUCTION audit
        run: node scripts/audit-content-production.mjs

      - name: Runtime build and target-scope comparison
        shell: bash
        run: |
          set -euo pipefail
          cp runtime/catalog.json /tmp/catalog.before.json
          cp data.js /tmp/data.before.js
          cp sources.js /tmp/sources.before.js
          node scripts/build-runtime-data.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const before=JSON.parse(fs.readFileSync('/tmp/catalog.before.json','utf8'));
          const after=JSON.parse(fs.readFileSync('runtime/catalog.json','utf8'));
          const byId=x=>new Map(x.cultivars.map(c=>[c.id,c]));
          const b=byId(before), a=byId(after);
          for(const id of ['dr-grinspoon','malawi']){
            if(JSON.stringify(b.get(id))!==JSON.stringify(a.get(id))) throw new Error(`runtime target payload changed unexpectedly for ${id}`);
          }
          console.log(`RUNTIME BUILD PASS: ${after.counts.cultivars} cultivars / ${after.counts.sources} sources / ${after.counts.entities} entities`);
          console.log('TARGET_RUNTIME_PAYLOAD_UNCHANGED=true');
          NODE
          echo 'RUNTIME_GENERATED_DIFF_BEGIN'
          git diff --name-only -- runtime/catalog.json data.js sources.js || true
          echo 'RUNTIME_GENERATED_DIFF_END'
          # Generated drift is pre-existing and not target-specific; preserve starting runtime because neither target was promoted.
          cp /tmp/catalog.before.json runtime/catalog.json
          cp /tmp/data.before.js data.js
          cp /tmp/sources.before.js sources.js

      - name: Remove all one-shot repair scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .display-repair-staging
          rm -f .display-repair-finalizer-status.json
          rm -f \
            .github/workflows/display-repair-preflight-dr-grinspoon-malawi.yml \
            .github/workflows/display-repair-observer-dr-grinspoon-malawi.yml \
            .github/workflows/display-repair-malawi-recovery-scout.yml \
            .github/workflows/display-repair-generate-dr-grinspoon.yml \
            .github/workflows/display-repair-finalize-dr-grinspoon-malawi.yml \
            .github/workflows/display-repair-finalizer-observer.yml \
            .github/workflows/display-repair-finalize-v2.yml

      - name: Assert final persistent scope
        shell: bash
        run: |
          set -euo pipefail
          INITIAL=8ec7354bde6f2c97874dfa97d0dd5e3c6c55498e
          mapfile -t changed < <(git diff --name-only "$INITIAL")
          printf 'FINAL_PERSISTENT_DIFF=%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'production/manifests/dr-grinspoon.json'
          test "$(git rev-parse origin/main)" = 'f9001f70bf938f3931634bd2c42c3875658c1012'
          test "$(node -e "const d=require('./strains/dr-grinspoon/strain.json'); process.stdout.write(String((d.visuals||[]).length))")" = '0'
          test "$(node -e "const d=require('./strains/malawi/strain.json'); process.stdout.write(String((d.visuals||[]).length))")" = '1'
          test ! -e strains/dr-grinspoon/images/generated/primary.webp
          echo 'MAIN_CHANGED=NO'
          echo 'DR_GRINSPOON_VISUALS=0'
          echo 'MALAWI_VISUALS=1'

      - name: Commit final safe-stop record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name strain-atlas-display-repair
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "[DISPLAY REPAIR] Record Dr Grinspoon NEEDS_REVIEW safe-stop"
          git pull --rebase origin master-migration
          git push origin HEAD:master-migration
