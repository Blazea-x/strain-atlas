name: HOME UX V2 Final Public Verifier

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/home-ux-v2-final-verifier.yml"

permissions:
  contents: write
  pages: read
  deployments: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://blazea-x.github.io/strain-atlas/
      MASTER_SHA: 910ae4c794193f75bb588fec0ca80941546bf8f7
      CATALOG_URL: https://raw.githubusercontent.com/Blazea-x/strain-atlas/master-migration/runtime/catalog.json
      PUBLICATION_URL: https://raw.githubusercontent.com/Blazea-x/strain-atlas/master-migration/production/publication.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Capture Pages route and deployed commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-check
          gh api "repos/${GITHUB_REPOSITORY}/pages" > final-check/pages.json
          gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=10" > final-check/deployments.json
          python - <<'PY'
          import json
          ds=json.load(open('final-check/deployments.json'))
          d=ds[0] if ds else {}
          json.dump({k:d.get(k) for k in ['id','sha','ref','environment','created_at','updated_at']},open('final-check/deployment.json','w'),ensure_ascii=False,indent=2)
          PY

      - name: Confirm production branch is unchanged
        shell: bash
        run: |
          set -euo pipefail
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/branches/master-migration" --jq '.commit.sha')"
          echo "master-migration=$actual"
          test "$actual" = "$MASTER_SHA"

      - name: Confirm public index is the current UI bytes
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-delay 2 "${SITE_URL}?final-home-ux-v2=${GITHUB_RUN_ID}" -o final-check/public-index.html
          test "$(sha256sum index.html | cut -d' ' -f1)" = "$(sha256sum final-check/public-index.html | cut -d' ' -f1)"
          grep -q 'preview/home-ux-v2.js?v=3' final-check/public-index.html
          grep -q '新着の品種' final-check/public-index.html
          grep -q 'すべての品種' final-check/public-index.html
          ! grep -q 'COMING LATER' final-check/public-index.html
          ! grep -q 'data-home-target="media"' final-check/public-index.html
          ! grep -q 'data-home-target="explore"' final-check/public-index.html

      - name: Install browser dependency
        run: python -m pip install --disable-pip-version-check --quiet selenium

      - name: Run public browser E2E
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time, traceback, urllib.request
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          SITE=os.environ['SITE_URL']
          CATALOG_URL=os.environ['CATALOG_URL']
          PUBLICATION_URL=os.environ['PUBLICATION_URL']
          OUT=Path('final-check'); OUT.mkdir(exist_ok=True)
          result={'runId':os.environ.get('GITHUB_RUN_ID'),'site':SITE,'checks':{},'errors':[]}

          def fetch_json(url):
            with urllib.request.urlopen(url,timeout=30) as r: return json.load(r)
          catalog=fetch_json(CATALOG_URL)
          publication=fetch_json(PUBLICATION_URL)
          runtime_ids={c['id'] for c in catalog['cultivars']}
          rows=[(e,i) for i,e in enumerate(publication['entries']) if e.get('state')=='published' and e.get('strainId') in runtime_ids]
          def ts(e):
            v=e.get('publishedAt')
            if not v: return -1
            from datetime import datetime
            return datetime.fromisoformat(v.replace('Z','+00:00')).timestamp()
          rows.sort(key=lambda x:(-ts(x[0]),-x[1],x[0].get('strainId','')))
          expected_latest=[e['strainId'] for e,_ in rows[:6]]
          result['expectedLatest']=expected_latest
          result['counts']=catalog.get('counts',{})

          o=Options(); o.add_argument('--headless=new'); o.add_argument('--no-sandbox'); o.add_argument('--disable-dev-shm-usage'); o.add_argument('--window-size=1280,1400')
          d=webdriver.Chrome(service=Service('/usr/bin/chromedriver'),options=o)
          w=WebDriverWait(d,30)

          def record(name,fn):
            try:
              detail=fn(); result['checks'][name]={'pass':True,'detail':detail}
            except Exception as e:
              result['checks'][name]={'pass':False,'detail':f'{type(e).__name__}: {e}'}; result['errors'].append(name)

          def load(width=390,height=1000):
            d.set_window_size(width,height)
            d.get(SITE+f'?e2e={os.environ.get("GITHUB_RUN_ID")}-{width}-{time.time_ns()}')
            w.until(lambda x: len(x.find_elements(By.CSS_SELECTOR,'#cultivar-grid [data-strain-id]'))==catalog['counts']['cultivars'])
            w.until(lambda x: len(x.find_elements(By.CSS_SELECTOR,'#latest-grid [data-strain-id]'))==6)
            w.until(lambda x: x.find_element(By.ID,'home-hero-image').get_attribute('src'))

          try:
            def layout_checks():
              details={}
              for width,height in [(390,1000),(430,1050),(1280,1200)]:
                load(width,height)
                assert 'Cannabis Strain Wisdom' in d.find_element(By.TAG_NAME,'body').text
                assert d.find_element(By.ID,'search-title').text=='品種を検索'
                assert d.find_element(By.ID,'legal-alert').is_displayed()
                assert d.find_element(By.ID,'latest-title').text=='新着の品種'
                assert d.find_element(By.ID,'all-cultivars-title').text=='すべての品種'
                caption=d.find_element(By.ID,'home-hero-caption').text
                img=d.find_element(By.ID,'home-hero-image')
                assert 'Bubble Gum' in caption
                assert d.execute_script('return arguments[0].complete && arguments[0].naturalWidth>0',img)
                assert not d.find_elements(By.CSS_SELECTOR,'[data-home-target="media"]')
                assert not d.find_elements(By.CSS_SELECTOR,'[data-home-target="explore"]')
                if width in (390,430):
                  cards=d.find_elements(By.CSS_SELECTOR,'#latest-grid [data-strain-id]')
                  tops=[round(c.rect['y']) for c in cards]
                  assert len(set(tops))==3, tops
                d.save_screenshot(str(OUT/f'public-{width}.png'))
                details[str(width)]={'latest':len(d.find_elements(By.CSS_SELECTOR,'#latest-grid [data-strain-id]')),'all':len(d.find_elements(By.CSS_SELECTOR,'#cultivar-grid [data-strain-id]'))}
              return details
            record('home-layout-390-430-desktop',layout_checks)

            def legal():
              load(390,1000)
              box=d.find_element(By.ID,'legal-alert'); d.execute_script('arguments[0].open=true',box)
              txt=box.text
              assert '教育・資料目的' in txt and '違法な所持・施用・栽培・輸入・購入' in txt
              links=d.find_elements(By.CSS_SELECTOR,'#legal-alert .legal-alert-sources a')
              assert len(links)==3
              return {'officialLinks':len(links)}
            record('important-notice',legal)

            def latest():
              load(390,1000)
              got=[x.get_attribute('data-strain-id') for x in d.find_elements(By.CSS_SELECTOR,'#latest-grid [data-strain-id]')]
              assert got==expected_latest,(got,expected_latest)
              d.refresh(); w.until(lambda x:len(x.find_elements(By.CSS_SELECTOR,'#latest-grid [data-strain-id]'))==6)
              got2=[x.get_attribute('data-strain-id') for x in d.find_elements(By.CSS_SELECTOR,'#latest-grid [data-strain-id]')]
              assert got2==got
              pending={e['strainId'] for e in publication['entries'] if e.get('state')!='published'}
              assert not (set(got)&pending)
              return got
            record('latest-six-publication-registry',latest)

            def filter_and_search():
              load(430,1050)
              sativa=d.find_element(By.CSS_SELECTOR,'[data-explore="sativa"]'); d.execute_script('arguments[0].click()',sativa); time.sleep(.25)
              assert len(d.find_elements(By.CSS_SELECTOR,'#cultivar-grid [data-strain-id]'))==len(catalog['explore']['sativa'])
              d.execute_script('arguments[0].click()',d.find_element(By.CSS_SELECTOR,'[data-explore="all"]'));time.sleep(.2)
              qtests={'Bubble Gum':'bubble-gum','Wedding Cake':'wedding-cake-s1','Humboldt CSI':'wedding-cake-s1','S1':'f1-durb-s1','Kush':'bubba-kush-s1'}
              out={}
              search=d.find_element(By.ID,'search')
              for q,target in qtests.items():
                d.execute_script("const s=arguments[0];s.value=arguments[1];s.dispatchEvent(new Event('input',{bubbles:true}));",search,q);time.sleep(.25)
                ids=[x.get_attribute('data-strain-id') for x in d.find_elements(By.CSS_SELECTOR,'#cultivar-grid [data-strain-id]')]
                assert target in ids,(q,target,ids)
                out[q]={'count':len(ids),'target':target}
              d.execute_script("const s=arguments[0];s.value='';s.dispatchEvent(new Event('input',{bubbles:true}));",search);time.sleep(.25)
              assert len(d.find_elements(By.CSS_SELECTOR,'#cultivar-grid [data-strain-id]'))==catalog['counts']['cultivars']
              return out
            record('filter-search-all-catalog',filter_and_search)

            def generations():
              load(430,1050)
              expected={'wedding-cake-s1':('Wedding Cake','S1'),'bubba-kush-s1':('Bubba Kush','S1'),'f1-durb-s1':('F1 Durb','S1'),'ak-47':('AK-47','F1')}
              out={}
              for sid,(name,gen) in expected.items():
                card=d.find_element(By.CSS_SELECTOR,f'#cultivar-grid [data-strain-id="{sid}"]')
                got_name=card.find_element(By.CSS_SELECTOR,'.tile-display-name').text
                got_gen=card.find_element(By.CSS_SELECTOR,'.generation-badge').text
                assert (got_name,got_gen)==(name,gen),(sid,got_name,got_gen)
                out[sid]={'name':got_name,'generation':got_gen}
              return out
            record('generation-display-separation',generations)

            def detail():
              load(390,1000)
              card=d.find_element(By.CSS_SELECTOR,'#cultivar-grid [data-strain-id="wedding-cake-s1"]')
              d.execute_script('arguments[0].click()',card)
              w.until(lambda x:x.find_element(By.ID,'detail-dialog').get_attribute('open') is not None)
              txt=d.find_element(By.ID,'detail-shell').text
              assert '正式登録名: Wedding Cake S1' in txt
              assert 'Wedding Cake' in txt and 'S1' in txt
              assert '系譜 / LINEAGE' in txt and '出典 / SOURCES' in txt
              d.execute_script('arguments[0].click()',d.find_element(By.CSS_SELECTOR,'.close-detail'))
              w.until(lambda x:x.find_element(By.ID,'detail-dialog').get_attribute('open') is None)
              return 'Wedding Cake S1 detail open/close PASS'
            record('detail-dialog',detail)

            def publication_failure():
              d.execute_cdp_cmd('Network.enable',{})
              d.execute_cdp_cmd('Network.setBlockedURLs',{'urls':['*production/publication.json*']})
              d.set_window_size(390,1000); d.get(SITE+f'?publication-fail={time.time_ns()}')
              w.until(lambda x:len(x.find_elements(By.CSS_SELECTOR,'#cultivar-grid [data-strain-id]'))==catalog['counts']['cultivars'])
              w.until(lambda x:'取得できません' in x.find_element(By.ID,'latest-state').text)
              assert len(d.find_elements(By.CSS_SELECTOR,'#cultivar-grid [data-strain-id]'))==catalog['counts']['cultivars']
              msg=d.find_element(By.ID,'latest-state').text
              d.execute_cdp_cmd('Network.setBlockedURLs',{'urls':[]})
              return msg
            record('publication-failure-fail-closed',publication_failure)

            def footer_robots():
              load(390,1000)
              footer=d.find_element(By.ID,'catalog-meta').text
              assert '38 品種' in footer and '58 出典' in footer and '12 関連組織・ブリーダー' in footer
              robots=d.find_element(By.CSS_SELECTOR,'meta[name="robots"]').get_attribute('content')
              assert robots=='noindex,nofollow,noarchive'
              return {'footer':footer,'robots':robots}
            record('footer-and-robots',footer_robots)
          except Exception:
            result['errors'].append('unexpected-abort'); result['traceback']=traceback.format_exc()
          finally:
            result['pass']=not result['errors'] and all(v.get('pass') for v in result['checks'].values())
            (OUT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
            d.quit()
          PY

      - name: Persist compact verification records
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/home-ux-v2-final-check
          cp final-check/result.json .github/home-ux-v2-final-check/result.json
          cp final-check/pages.json .github/home-ux-v2-final-check/pages.json
          cp final-check/deployment.json .github/home-ux-v2-final-check/deployment.json
          git config user.name 'home-ux-v2-final-verifier'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main
          git add .github/home-ux-v2-final-check
          git commit -m 'Record one-time HOME UX V2 final verification [skip ci]'
          git push origin HEAD:main

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-ux-v2-final-public-${{ github.run_id }}
          path: final-check/

      - name: Enforce result
        if: always()
        run: python -c "import json; assert json.load(open('final-check/result.json'))['pass']"
