name: HOME V1 FINAL LIVE VERIFY

on:
  issues:
    types: [edited]

permissions:
  actions: read
  contents: read
  deployments: read
  issues: write
  pages: read

jobs:
  verify:
    if: github.event.issue.number == 13
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mark verification start
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/13/comments" \
            -f body="HOME V1 FINAL LIVE VERIFY STARTED | run=$GITHUB_RUN_ID | repoHead=$GITHUB_SHA" >/dev/null

      - name: Resolve live Pages deployment and artifact
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          pages="$(gh api "repos/$repo/pages")"
          site="$(jq -r '.html_url' <<<"$pages")"
          build_type="$(jq -r '.build_type // "unknown"' <<<"$pages")"
          source_branch="$(jq -r '.source.branch // ""' <<<"$pages")"
          source_path="$(jq -r '.source.path // ""' <<<"$pages")"

          deployments="$(gh api "repos/$repo/deployments?environment=github-pages&per_page=20")"
          deployment_id="$(jq -r '.[0].id // empty' <<<"$deployments")"
          deployment_sha="$(jq -r '.[0].sha // empty' <<<"$deployments")"
          deployment_created="$(jq -r '.[0].created_at // empty' <<<"$deployments")"
          [[ -n "$deployment_id" && -n "$deployment_sha" ]]
          deployment_state="$(gh api "repos/$repo/deployments/$deployment_id/statuses?per_page=20" --jq '.[0].state // "unknown"')"
          [[ "$deployment_state" == "success" ]]

          runs="$(gh api "repos/$repo/actions/runs?per_page=100")"
          deploy_run="$(jq -c --arg sha "$deployment_sha" '[.workflow_runs[] | select(.head_sha == $sha and .path == ".github/workflows/deploy-public-ui-pages.yml")] | sort_by(.created_at) | reverse | .[0] // {}' <<<"$runs")"
          deploy_run_id="$(jq -r '.id // empty' <<<"$deploy_run")"
          deploy_run_name="$(jq -r '.name // empty' <<<"$deploy_run")"
          deploy_run_conclusion="$(jq -r '.conclusion // empty' <<<"$deploy_run")"
          [[ -n "$deploy_run_id" && "$deploy_run_conclusion" == "success" ]]
          artifacts="$(gh api "repos/$repo/actions/runs/$deploy_run_id/artifacts?per_page=100")"
          artifact_count="$(jq -r '.total_count // 0' <<<"$artifacts")"
          artifact_summary="$(jq -c '[.artifacts[] | {id,name,size_in_bytes,expired,created_at}]' <<<"$artifacts")"
          [[ "$artifact_count" -ge 1 ]]

          {
            printf 'site=%s\n' "$site"
            printf 'build_type=%s\n' "$build_type"
            printf 'source_branch=%s\n' "$source_branch"
            printf 'source_path=%s\n' "$source_path"
            printf 'deployment_id=%s\n' "$deployment_id"
            printf 'deployment_sha=%s\n' "$deployment_sha"
            printf 'deployment_created=%s\n' "$deployment_created"
            printf 'deployment_state=%s\n' "$deployment_state"
            printf 'deploy_run_id=%s\n' "$deploy_run_id"
            printf 'deploy_run_name=%s\n' "$deploy_run_name"
            printf 'deploy_run_conclusion=%s\n' "$deploy_run_conclusion"
            printf 'artifact_count=%s\n' "$artifact_count"
            printf 'artifact_summary=%s\n' "$artifact_summary"
          } >> "$GITHUB_OUTPUT"

      - name: Verify public HTML and master runtime assets
        id: assets
        env:
          SITE: ${{ steps.pages.outputs.site }}
        shell: bash
        run: |
          set -euo pipefail
          site="${SITE%/}/"
          curl -fsSL -H 'Cache-Control: no-cache' "${site}?verify=$RANDOM-$(date +%s%N)" -o /tmp/live.html
          grep -q 'Cannabis <span>Strain Wisdom</span>' /tmp/live.html
          grep -q 'CULTIVARS · CULTURE · KNOWLEDGE' /tmp/live.html
          grep -q 'EDUCATIONAL ARCHIVE' /tmp/live.html
          grep -q 'preview/home-entrance-v1.css?v=2' /tmp/live.html
          grep -q 'preview/home-hero-v1.js?v=2' /tmp/live.html
          grep -q 'data-home-target="explore"' /tmp/live.html
          grep -q 'data-home-target="media"' /tmp/live.html
          ! grep -q 'MASTER PREVIEW' /tmp/live.html

          curl -fsSL -H 'Cache-Control: no-cache' "https://raw.githubusercontent.com/Blazea-x/strain-atlas/master-migration/runtime/catalog.json?verify=$(date +%s%N)" -o /tmp/catalog.json
          jq -e '.counts.cultivars > 0 and (.cultivars | any(.id == "bubble-gum" and (.visuals | any(.role == "primary"))))' /tmp/catalog.json >/dev/null
          cultivar_count="$(jq -r '.counts.cultivars' /tmp/catalog.json)"
          source_count="$(jq -r '.counts.sources' /tmp/catalog.json)"
          entity_count="$(jq -r '.counts.entities' /tmp/catalog.json)"
          bubble_src="$(jq -r '.cultivars[] | select(.id == "bubble-gum") | .visuals[] | select(.role == "primary") | .src' /tmp/catalog.json | head -n1)"
          curl -fsSL -H 'Cache-Control: no-cache' "https://raw.githubusercontent.com/Blazea-x/strain-atlas/master-migration/${bubble_src}?verify=$(date +%s%N)" -o /tmp/bubble.webp
          file /tmp/bubble.webp | grep -qi 'Web/P image\|WebP'
          printf 'cultivar_count=%s\nsource_count=%s\nentity_count=%s\nbubble_src=%s\n' "$cultivar_count" "$source_count" "$entity_count" "$bubble_src" >> "$GITHUB_OUTPUT"

      - name: Exercise live UI in headless Chrome
        env:
          SITE: ${{ steps.pages.outputs.site }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet websocket-client
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          [[ -n "$browser" ]]
          "$browser" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 --remote-allow-origins='*' --user-data-dir=/tmp/csw-chrome about:blank >/tmp/chrome.log 2>&1 &
          chrome_pid=$!
          trap 'kill "$chrome_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9222/json/list >/tmp/targets.json 2>/dev/null && jq -e 'length > 0' /tmp/targets.json >/dev/null && break
            sleep 1
          done
          export SITE_UNDER_TEST="${SITE%/}/?verify=browser-$(date +%s%N)"
          cat >/tmp/cdp_verify.py <<'PY'
          import base64, json, os, time, urllib.request
          import websocket

          targets=json.load(urllib.request.urlopen('http://127.0.0.1:9222/json/list'))
          ws=websocket.create_connection(targets[0]['webSocketDebuggerUrl'], timeout=30)
          seq=0
          def send(method, params=None):
              global seq
              seq += 1
              ident=seq
              ws.send(json.dumps({'id':ident,'method':method,'params':params or {}}))
              while True:
                  msg=json.loads(ws.recv())
                  if msg.get('id') == ident:
                      if 'error' in msg:
                          raise RuntimeError(msg['error'])
                      return msg.get('result',{})
          def ev(expr):
              out=send('Runtime.evaluate', {'expression':expr,'returnByValue':True,'awaitPromise':True})
              return out.get('result',{}).get('value')

          send('Page.enable')
          send('Runtime.enable')
          send('Emulation.setDeviceMetricsOverride', {'width':390,'height':844,'deviceScaleFactor':2,'mobile':True})
          send('Page.navigate', {'url':os.environ['SITE_UNDER_TEST']})
          time.sleep(12)
          initial=ev("""(()=>({
            masterPreview:document.body.innerText.includes('MASTER PREVIEW'),
            title:document.querySelector('#site-title')?.innerText||'',
            kicker:document.querySelector('.home-hero-kicker')?.innerText||'',
            archive:document.body.innerText.includes('EDUCATIONAL ARCHIVE'),
            heroReady:document.querySelector('#home-hero-image')?.classList.contains('is-ready')||false,
            heroSrc:document.querySelector('#home-hero-image')?.currentSrc||document.querySelector('#home-hero-image')?.src||'',
            heroCaption:document.querySelector('#home-hero-caption')?.innerText||'',
            searchHeight:document.querySelector('#search')?.getBoundingClientRect().height||0,
            searchWidth:document.querySelector('#search')?.getBoundingClientRect().width||0,
            explorePresent:!!document.querySelector('[data-home-target="explore"]'),
            mediaPresent:!!document.querySelector('[data-home-target="media"]'),
            legalPresent:!!document.querySelector('.legal-alert'),
            legalLinks:document.querySelectorAll('.legal-alert-sources a').length,
            cards:document.querySelectorAll('.cultivar-card').length,
            dataState:document.querySelector('#data-state')?.textContent||'',
            catalogMeta:document.querySelector('#catalog-meta')?.innerText||''
          }))()""")
          ev("""(()=>{const s=document.querySelector('#search');s.value='Bubble Gum';s.dispatchEvent(new Event('input',{bubbles:true}));return true})()""")
          time.sleep(1)
          search=ev("""(()=>({
            panel:document.querySelector('[data-content-panel="cultivars"]')?.hidden===false,
            first:document.querySelector('.cultivar-card .tile-name')?.innerText||'',
            cards:document.querySelectorAll('.cultivar-card').length,
            result:document.querySelector('#result-label')?.innerText||''
          }))()""")
          ev("document.querySelector('.cultivar-card')?.click()")
          time.sleep(1)
          detail=ev("""(()=>({
            open:document.querySelector('#detail-dialog')?.open||false,
            topbar:document.querySelector('.detail-topbar')?.innerText||'',
            hero:document.querySelector('.detail-hero-copy h2')?.innerText||''
          }))()""")
          ev("document.querySelector('.close-detail')?.click()")
          time.sleep(.4)
          ev("document.querySelector('[data-home-target=\"explore\"]')?.click()")
          time.sleep(.5)
          explore=ev("document.querySelector('[data-content-panel=\"explore\"]')?.hidden===false")
          ev("document.querySelector('[data-home-target=\"media\"]')?.click()")
          time.sleep(.5)
          media=ev("document.querySelector('[data-content-panel=\"media\"]')?.hidden===false")
          ev("document.querySelector('.legal-alert').open=true")
          legal_open=ev("document.querySelector('.legal-alert')?.open===true")
          ev("document.querySelector('[data-home-target=\"explore\"]')?.click()")
          time.sleep(.4)
          shot=send('Page.captureScreenshot', {'format':'png','captureBeyondViewport':False,'fromSurface':True})
          with open('/tmp/home-entrance-v1-live.png','wb') as fh:
              fh.write(base64.b64decode(shot['data']))
          result={'initial':initial,'search':search,'detail':detail,'explore':explore,'media':media,'legalOpen':legal_open}
          with open('/tmp/ui.json','w',encoding='utf-8') as fh:
              json.dump(result,fh,ensure_ascii=False,indent=2)
          ws.close()
          PY
          python3 /tmp/cdp_verify.py
          cat /tmp/ui.json
          jq -e '
            (.initial.masterPreview == false) and
            (.initial.title | contains("Cannabis")) and
            (.initial.title | contains("Strain Wisdom")) and
            (.initial.kicker == "CULTIVARS · CULTURE · KNOWLEDGE") and
            (.initial.archive == true) and
            (.initial.heroReady == true) and
            (.initial.heroCaption | contains("ARCHIVE VISUAL")) and
            (.initial.heroCaption | contains("Bubble Gum")) and
            (.initial.searchHeight >= 50) and
            (.initial.searchWidth >= 300) and
            (.initial.explorePresent == true) and
            (.initial.mediaPresent == true) and
            (.initial.legalPresent == true) and
            (.initial.legalLinks >= 3) and
            (.initial.cards > 0) and
            (.initial.dataState == "MASTER DATA") and
            (.search.panel == true) and
            (.search.first == "Bubble Gum") and
            (.search.cards >= 1) and
            (.detail.open == true) and
            (.detail.topbar | contains("Bubble Gum")) and
            (.detail.hero == "Bubble Gum") and
            (.explore == true) and
            (.media == true) and
            (.legalOpen == true)
          ' /tmp/ui.json >/dev/null

      - name: Build final verification report
        env:
          SITE: ${{ steps.pages.outputs.site }}
          BUILD_TYPE: ${{ steps.pages.outputs.build_type }}
          SOURCE_BRANCH: ${{ steps.pages.outputs.source_branch }}
          SOURCE_PATH: ${{ steps.pages.outputs.source_path }}
          DEPLOYMENT_ID: ${{ steps.pages.outputs.deployment_id }}
          DEPLOYMENT_SHA: ${{ steps.pages.outputs.deployment_sha }}
          DEPLOYMENT_CREATED: ${{ steps.pages.outputs.deployment_created }}
          DEPLOYMENT_STATE: ${{ steps.pages.outputs.deployment_state }}
          DEPLOY_RUN_ID: ${{ steps.pages.outputs.deploy_run_id }}
          DEPLOY_RUN_NAME: ${{ steps.pages.outputs.deploy_run_name }}
          DEPLOY_RUN_CONCLUSION: ${{ steps.pages.outputs.deploy_run_conclusion }}
          ARTIFACT_COUNT: ${{ steps.pages.outputs.artifact_count }}
          ARTIFACT_SUMMARY: ${{ steps.pages.outputs.artifact_summary }}
          CULTIVAR_COUNT: ${{ steps.assets.outputs.cultivar_count }}
          SOURCE_COUNT: ${{ steps.assets.outputs.source_count }}
          ENTITY_COUNT: ${{ steps.assets.outputs.entity_count }}
          BUBBLE_SRC: ${{ steps.assets.outputs.bubble_src }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg status 'PUBLIC SITE VISUAL CONFIRMED' \
            --arg site "$SITE" \
            --arg verifierRun "$GITHUB_RUN_ID" \
            --arg repoHead "$GITHUB_SHA" \
            --arg buildType "$BUILD_TYPE" \
            --arg sourceBranch "$SOURCE_BRANCH" \
            --arg sourcePath "$SOURCE_PATH" \
            --arg deploymentId "$DEPLOYMENT_ID" \
            --arg deploymentSha "$DEPLOYMENT_SHA" \
            --arg deploymentCreated "$DEPLOYMENT_CREATED" \
            --arg deploymentState "$DEPLOYMENT_STATE" \
            --arg deployRunId "$DEPLOY_RUN_ID" \
            --arg deployRunName "$DEPLOY_RUN_NAME" \
            --arg deployRunConclusion "$DEPLOY_RUN_CONCLUSION" \
            --argjson artifacts "$ARTIFACT_SUMMARY" \
            --arg cultivarCount "$CULTIVAR_COUNT" \
            --arg sourceCount "$SOURCE_COUNT" \
            --arg entityCount "$ENTITY_COUNT" \
            --arg bubbleSrc "$BUBBLE_SRC" \
            --slurpfile ui /tmp/ui.json \
            '{status:$status,siteUrl:$site,verifier:{runId:$verifierRun,repoHead:$repoHead},pages:{buildType:$buildType,source:{branch:$sourceBranch,path:$sourcePath},deployment:{id:$deploymentId,sha:$deploymentSha,createdAt:$deploymentCreated,state:$deploymentState},workflow:{runId:$deployRunId,name:$deployRunName,conclusion:$deployRunConclusion},artifacts:$artifacts},runtime:{cultivars:($cultivarCount|tonumber),sources:($sourceCount|tonumber),entities:($entityCount|tonumber),bubbleGumPrimary:$bubbleSrc},ui:$ui[0]}' > /tmp/report.json
          cat /tmp/report.json

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: home-entrance-v1-public-verification
          path: |
            /tmp/report.json
            /tmp/ui.json
            /tmp/home-entrance-v1-live.png
            /tmp/live.html
          retention-days: 7
          if-no-files-found: error

      - name: Post final result to issue 13
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          body="$(printf 'PUBLIC SITE VISUAL CONFIRMED\n\nVerifier run: %s\nRepository head during verification: %s\n\n```json\n%s\n```' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(cat /tmp/report.json)")"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/13/comments" -f body="$body" >/dev/null
