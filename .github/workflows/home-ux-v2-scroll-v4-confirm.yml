name: HOME UX V2 Scroll V4 Confirm
on:
  push:
    branches: [main]
    paths: [".github/workflows/home-ux-v2-scroll-v4-confirm.yml"]
permissions:
  contents: write
jobs:
  confirm:
    runs-on: ubuntu-latest
    env:
      SITE: https://blazea-x.github.io/strain-atlas/
    steps:
      - uses: actions/checkout@v4
      - name: Wait for current public bytes and verify scroll
        env:
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sha256sum index.html | cut -d' ' -f1)"
          ok=0
          for n in $(seq 1 30); do
            curl -fsSL "${SITE}?scroll-v4=${RUN_ID}-${n}" -o /tmp/public-index.html || true
            actual="$(sha256sum /tmp/public-index.html 2>/dev/null | cut -d' ' -f1 || true)"
            if [ "$actual" = "$expected" ]; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1
          grep -q 'home-entrance-v1.css?v=4' /tmp/public-index.html
          python -m pip install --disable-pip-version-check --quiet selenium
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          SITE=os.environ['SITE']; OUT=Path('home-ux-v2-scroll-v4-confirm'); OUT.mkdir(exist_ok=True)
          o=Options(); o.add_argument('--headless=new'); o.add_argument('--no-sandbox'); o.add_argument('--disable-dev-shm-usage'); o.add_argument('--window-size=390,844')
          d=webdriver.Chrome(service=Service('/usr/bin/chromedriver'),options=o); w=WebDriverWait(d,25)
          d.get(SITE); w.until(lambda x:len(x.find_elements(By.CSS_SELECTOR,'#cultivar-grid [data-strain-id]'))==38); w.until(lambda x:len(x.find_elements(By.CSS_SELECTOR,'#latest-grid [data-strain-id]'))==6)
          c=d.find_element(By.CSS_SELECTOR,'#cultivar-grid [data-strain-id="wedding-cake-s1"]'); d.execute_script('arguments[0].scrollIntoView({block:"center"})',c); time.sleep(.15); before=d.execute_script('return window.scrollY'); d.execute_script('arguments[0].click()',c); w.until(lambda x:x.find_element(By.ID,'detail-dialog').get_attribute('open') is not None); d.execute_script('arguments[0].click()',d.find_element(By.CSS_SELECTOR,'.close-detail')); w.until(lambda x:x.find_element(By.ID,'detail-dialog').get_attribute('open') is None); time.sleep(.25); after=d.execute_script('return window.scrollY'); delta=abs(after-before)
          result={'runId':os.environ['RUN_ID'],'before':before,'after':after,'delta':delta,'homeCount':len(d.find_elements(By.CSS_SELECTOR,'#cultivar-grid [data-strain-id]')),'latestCount':len(d.find_elements(By.CSS_SELECTOR,'#latest-grid [data-strain-id]')),'cssVersion':'v4','pass':delta<5}; (OUT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)); d.quit(); assert result['pass'],result
          PY
      - name: Persist result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/home-ux-v2-scroll-v4-confirm
          cp home-ux-v2-scroll-v4-confirm/result.json .github/home-ux-v2-scroll-v4-confirm/result.json
          git config user.name home-ux-v2-e2e-bot
          git config user.email actions@users.noreply.github.com
          git pull --rebase origin main
          git add .github/home-ux-v2-scroll-v4-confirm/result.json
          git commit -m 'Record HOME UX V2 scroll v4 confirmation [skip ci]'
          git push origin HEAD:main
