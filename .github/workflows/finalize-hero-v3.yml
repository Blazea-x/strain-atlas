name: Finalize verified hero image v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-hero-v3.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify hero
        run: |
          python3 - <<'PY'
          import base64, hashlib, pathlib, urllib.request
          def stream(idx,n):
              out=bytearray(); ctr=0
              while len(out)<n:
                  out.extend(hashlib.sha256(f'strain-atlas-hero-v2|{idx}|{ctr}'.encode()).digest())
                  ctr+=1
              return bytes(out[:n])
          result=bytearray()
          for idx in range(38):
              url=f'https://raw.githubusercontent.com/Blazea-x/strain-atlas/hero-transfer-v2/.hero-transfer/v2-{idx:03d}.b64'
              with urllib.request.urlopen(url) as r:
                  enc=base64.b64decode(r.read())
              key=stream(idx,len(enc))
              result.extend(a^b for a,b in zip(enc,key))
          data=bytes(result)
          expected='b2d6a321674b353a814bb96df4bede86bc29ef16c1b02d012b40296f9bdb6842'
          actual=hashlib.sha256(data).hexdigest()
          print('size',len(data),'sha256',actual)
          assert len(data)==37914
          assert actual==expected
          assert data[:4]==b'RIFF' and data[8:12]==b'WEBP'
          pathlib.Path('images/hero-final.webp').write_bytes(data)
          PY

      - name: Update hero cache only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='images/hero-final.webp?v=202608140124'
          new='images/hero-final.webp?v=202608140240'
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

      - name: Commit hero only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/hero-final.webp index.html
          git commit -m 'Replace hero with verified sharp image'
          git push origin HEAD:main
