name: OpenAI Image Benchmark Observer

on:
  push:
    branches: [master-migration]
    paths:
      - .github/workflows/openai-image-benchmark-observer.yml

permissions:
  contents: write
  actions: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_HEAD: 2a8a0feecb497cadee4def879513619ba8c6e528
      TARGET_WORKFLOW: openai-image-architecture-benchmark.yml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master-migration
          fetch-depth: 1

      - name: Wait for benchmark run and record metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, json, time, urllib.request
          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          target = os.environ['TARGET_HEAD']
          workflow = os.environ['TARGET_WORKFLOW']
          url = f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?event=push&per_page=20'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28'
          }
          found = None
          for _ in range(210):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)
              matches = [run for run in payload.get('workflow_runs', []) if run.get('head_sha') == target]
              if matches:
                  found = matches[0]
                  if found.get('status') == 'completed':
                      break
              time.sleep(8)
          if not found:
              raise SystemExit('target OpenAI benchmark run not found')
          record = {k: found.get(k) for k in ('id','name','head_sha','status','conclusion','html_url','created_at','updated_at','run_number','run_attempt')}
          record['artifactName'] = f"openai-image-architecture-benchmark-{found['id']}"
          os.makedirs('docs/benchmark-results', exist_ok=True)
          with open('docs/benchmark-results/openai-image-architecture-benchmark-run-latest.json', 'w') as fh:
              json.dump(record, fh, indent=2)
              fh.write('\n')
          print(json.dumps(record))
          PY

      - name: Commit observer record
        shell: bash
        run: |
          git config user.name strain-atlas-image-benchmark-observer
          git config user.email actions@users.noreply.github.com
          git add docs/benchmark-results/openai-image-architecture-benchmark-run-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '[IMAGE V2] Record OpenAI benchmark run id'
          git push origin HEAD:master-migration
