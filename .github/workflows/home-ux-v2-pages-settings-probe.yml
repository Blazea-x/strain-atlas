name: HOME UX V2 Pages Settings Probe
on:
  push:
    branches: [main]
    paths: [".github/workflows/home-ux-v2-pages-settings-probe.yml"]
permissions:
  contents: write
  pages: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Read current Pages settings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/home-ux-v2-pages-probe
          gh api repos/Blazea-x/strain-atlas/pages --jq '{build_type:.build_type,source:.source,html_url:.html_url,status:.status}' > .github/home-ux-v2-pages-probe/settings.json
          git config user.name home-ux-v2-e2e-bot
          git config user.email actions@users.noreply.github.com
          git pull --rebase origin main
          git add .github/home-ux-v2-pages-probe/settings.json
          git commit -m 'Record fresh Pages settings probe [skip ci]'
          git push origin HEAD:main
