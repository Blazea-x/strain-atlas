name: Preserve OpenAI multi-visuals targeted once

on:
  pull_request:
    branches: [master-migration]
    types: [synchronize, reopened]
    paths:
      - ".github/preserve-openai-multivisuals-trigger"

permissions:
  contents: write
  actions: read

concurrency:
  group: preserve-openai-multivisuals-targeted-once
  cancel-in-progress: false

jobs:
  preserve:
    if: github.repository == 'Blazea-x/strain-atlas'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current MASTER
        uses: actions/checkout@v4
        with:
          ref: master-migration
          fetch-depth: 0

      - name: Pin current remote HEAD
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master-migration
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/master-migration)"
          echo "BASE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Download preserved benchmark artifact only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/openai-preserved"
          gh run download 32196764747 \
            --repo "$GITHUB_REPOSITORY" \
            --name "openai-pending-cultivar-benchmark-32196764747" \
            --dir "$RUNNER_TEMP/openai-preserved"
          test -f "$RUNNER_TEMP/openai-preserved/benchmark-summary.json"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check --quiet Pillow

      - name: Verify artifact bytes and prepare production files
        env:
          SOURCE_DIR: ${{ runner.temp }}/openai-preserved
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import datetime, hashlib, json, os

          root = Path.cwd()
          src = Path(os.environ['SOURCE_DIR'])
          run_id = 'content-production-20260818T060700Z-01'
          now = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          specs = {
            'kali-mist': [
              ('primary','kali-mist__candidate-1.jpg','d43c11efcb13d26e494af126dc80b8396b4e8db7d097e2f890f71961c927a498','primary.webp'),
              ('secondary','kali-mist__candidate-2.jpg','86185b3c410ca0fd49f3e0704828a1e532206c8b5def1fe53dad6d8920142f67','secondary-1.webp')],
            'warlock': [
              ('primary','warlock__candidate-1.jpg','068cc399ffe16c521e4134e2fb76d75ff677e8066c984629fb85451ada7405cf','primary.webp'),
              ('secondary','warlock__candidate-2.jpg','822db5cadd7eddc4b0f6411eabbc09f3212ef5215669f4220a1e8c961dac1539','secondary-1.webp')]
          }
          def load(p): return json.loads(p.read_text(encoding='utf-8'))
          def save(p,o): p.write_text(json.dumps(o,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          def sha256(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          def blobsha(p):
            b=p.read_bytes(); return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()

          summary=load(src/'benchmark-summary.json')
          assert summary['runId']==32196764747
          assert summary['model']=='gpt-image-2'
          assert summary['quality']=='high'
          assert summary['successCount']==4
          assert summary['productionMutationCount']==0

          publication=load(root/'production/publication.json')
          pub={e['strainId']:e for e in publication['entries']}
          run_path=root/'production/runs'/f'{run_id}.json'
          run=load(run_path)
          assert run['status']=='ACTIVE' and run['publicationPolicy']=='batch'
          items={i['strainId']:i for i in run['items']}

          for sid, rows in specs.items():
            strain_path=root/'strains'/sid/'strain.json'
            manifest_path=root/'production/manifests'/f'{sid}.json'
            strain=load(strain_path); manifest=load(manifest_path); item=items[sid]
            assert strain.get('visuals')==[], f'{sid}: visuals no longer empty'
            assert pub[sid]['state']=='pending' and pub[sid]['introducedByRun']==run_id
            assert item['productionPhase']=='IMAGE_PENDING'
            assert manifest['runId']==run_id and manifest['strainId']==sid
            assert manifest['approvalStatus']=='pending'
            assert manifest['revision']==1 and manifest['attempt']==1
            artifacts=[]
            for idx,(role,filename,expected,outname) in enumerate(rows,1):
              source=src/filename
              assert source.is_file()
              actual=sha256(source)
              assert actual==expected, f'{sid} candidate {idx} SHA-256 mismatch'
              with Image.open(source) as im:
                im.load(); assert im.format=='JPEG' and im.size==(1024,1536)
                out=root/'strains'/sid/'images'/'generated'/outname
                out.parent.mkdir(parents=True,exist_ok=True)
                im.save(out,format='WEBP',quality=92,method=6)
              raw=out.read_bytes(); assert raw[:4]==b'RIFF' and raw[8:12]==b'WEBP'
              with Image.open(out) as chk:
                chk.load(); assert chk.format=='WEBP' and chk.size==(1024,1536)
              artifacts.append({'candidate':idx,'role':role,'sourceFile':filename,'sourceSha256':actual,
                'sourceByteLength':source.stat().st_size,'processedPath':str(out.relative_to(root)),
                'processedSha256':sha256(out),'processedBlobSha':blobsha(out),'width':1024,'height':1536,
                'conversion':{'format':'WEBP','quality':92,'method':6}})

            meta=manifest['visualMetadataSnapshot']
            strain['visuals']=[
              {'role':'primary','src':artifacts[0]['processedPath'],'aiGenerated':True,'sourceType':meta['sourceType'],'rights':meta['rights'],'alt':meta['alt'],'scope':meta['scope']},
              {'role':'secondary','src':artifacts[1]['processedPath'],'aiGenerated':True,'sourceType':meta['sourceType'],'rights':meta['rights'],'alt':meta['alt']+'（別カット）','scope':meta['scope']}
            ]
            strain['updatedAt']='2026-08-19'
            save(strain_path,strain)

            manifest.update({
              'approvalStatus':'approved','approvedAt':now,'approvalType':'human-visual-review',
              'approvedManifestRevision':manifest['revision'],'approvedAttempt':manifest['attempt'],
              'approvedSourceSha256':artifacts[0]['sourceSha256'],
              'processedPrimaryBlobSha':artifacts[0]['processedBlobSha'],'processedPrimarySha256':artifacts[0]['processedSha256'],
              'width':1024,'height':1536,
              'generationProvenance':{'provider':'OpenAI','model':'gpt-image-2','quality':'high','requestedSize':'1024x1536',
                'outputFormat':'jpeg','workflowRunId':32196764747,'artifactId':9346290136,
                'artifactName':'openai-pending-cultivar-benchmark-32196764747','additionalGenerationRequests':0},
              'visualArtifacts':artifacts
            })
            manifest.setdefault('audit',[]).append({'severity':'INFO','code':'IMAGE_APPROVED','at':now,'productionPhase':'IMAGE_PENDING',
              'note':'Human visual review approved preserved OpenAI benchmark candidate 1 as primary and candidate 2 as secondary; source digests are recorded separately.'})
            save(manifest_path,manifest)
          print('SOURCE SHA-256: 4 / 4 PASS')
          print('WEBP: 4 / 4 PASS quality=92 method=6')
          print('OPENAI ADDITIONAL GENERATION REQUESTS: 0')
          PY

      - name: Commit preserved image bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "strain-atlas-image-preservation"
          git config user.email "actions@users.noreply.github.com"
          git add strains/kali-mist strains/warlock production/manifests/kali-mist.json production/manifests/warlock.json
          git commit -m "[IMAGE V2] Preserve OpenAI Kali Mist and Warlock visuals"
          echo "IMAGE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Bind processing provenance and state transitions
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import datetime,json,os
          root=Path.cwd(); commit=os.environ['IMAGE_COMMIT']; run_id='content-production-20260818T060700Z-01'
          now=datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          source={'kali-mist':('d43c11efcb13d26e494af126dc80b8396b4e8db7d097e2f890f71961c927a498','86185b3c410ca0fd49f3e0704828a1e532206c8b5def1fe53dad6d8920142f67'),
                  'warlock':('068cc399ffe16c521e4134e2fb76d75ff677e8066c984629fb85451ada7405cf','822db5cadd7eddc4b0f6411eabbc09f3212ef5215669f4220a1e8c961dac1539')}
          def load(p): return json.loads(p.read_text(encoding='utf-8'))
          def save(p,o): p.write_text(json.dumps(o,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          for sid in source:
            p=root/'production/manifests'/f'{sid}.json'; m=load(p)
            m['imageInboxCommit']=commit; m['imageProcessingCommit']=commit
            m.setdefault('audit',[]).append({'severity':'INFO','code':'IMAGE_PROCESSED','at':now,'productionPhase':'IMAGE_READY',
              'note':f'Preserved artifact images stored in {commit} using WebP quality 92 / method 6.'})
            save(p,m)
          rp=root/'production/runs'/f'{run_id}.json'; run=load(rp); items={i['strainId']:i for i in run['items']}
          for sid,(p1,p2) in source.items():
            i=items[sid]; assert i['productionPhase']=='IMAGE_PENDING'
            i['approval']={'approvalType':'human-visual-review','approvedAt':now,'manifestRevision':i['manifestRevision'],
              'primarySourceSha256':p1,'secondarySourceSha256':p2,'provider':'OpenAI','model':'gpt-image-2','workflowRunId':32196764747,'artifactId':9346290136}
            i['commits']['imageInboxCommit']=commit; i['commits']['imageProcessingCommit']=commit; i['commits']['visualsCommit']=commit
            i.setdefault('audit',[]).append({'severity':'INFO','code':'PHASE_TRANSITION','fromPhase':'IMAGE_PENDING','toPhase':'IMAGE_READY','at':now})
            i['audit'].append({'severity':'INFO','code':'PHASE_TRANSITION','fromPhase':'IMAGE_READY','toPhase':'VISUAL_LINKED','at':now})
            i['productionPhase']='VISUAL_LINKED'
          run['updatedAt']=now; save(rp,run)
          PY

      - name: Validate target and record repository baseline audit
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-master-data.mjs
          set +e
          node scripts/audit-content-production.mjs > "$RUNNER_TEMP/content-audit.log" 2>&1
          audit_rc=$?
          set -e
          cat "$RUNNER_TEMP/content-audit.log"
          test "$audit_rc" -eq 1
          grep -q '^ERROR=1 ' "$RUNNER_TEMP/content-audit.log"
          grep -q '^\[ERROR\] ORPHAN_PRIMARY: durban-poison has primary.webp not referenced by visuals$' "$RUNNER_TEMP/content-audit.log"
          ! grep -E '^\[ERROR\].*(kali-mist|warlock)' "$RUNNER_TEMP/content-audit.log"
          grep -q '^PUBLIC_SET_IDENTICAL=true$' "$RUNNER_TEMP/content-audit.log"
          grep -q '^PAYLOAD_IDENTICAL=true$' "$RUNNER_TEMP/content-audit.log"
          node scripts/build-runtime-data.mjs
          git checkout -- runtime/catalog.json data.js sources.js
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          root=Path('.')
          pub={e['strainId']:e for e in json.loads((root/'production/publication.json').read_text())['entries']}
          run=json.loads((root/'production/runs/content-production-20260818T060700Z-01.json').read_text()); items={i['strainId']:i for i in run['items']}
          for sid in ('kali-mist','warlock'):
            s=json.loads((root/'strains'/sid/'strain.json').read_text())
            assert len(s['visuals'])==2
            assert sum(v['role']=='primary' for v in s['visuals'])==1
            assert sum(v['role']=='secondary' for v in s['visuals'])==1
            assert pub[sid]['state']=='pending' and items[sid]['productionPhase']=='VISUAL_LINKED'
            for v in s['visuals']:
              p=root/v['src']; assert p.is_file()
              with Image.open(p) as im: im.load(); assert im.format=='WEBP' and im.size==(1024,1536)
          print('TARGET MULTI-VISUAL VALIDATION: PASS')
          print('FULL CONTENT PRODUCTION AUDIT: FAIL only pre-existing Durban Poison ORPHAN_PRIMARY')
          PY

      - name: Remove temporary workflows and commit state metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/preserve-openai-multivisuals-once.yml
          rm -f .github/workflows/preserve-openai-multivisuals-targeted-once.yml
          git add production/manifests/kali-mist.json production/manifests/warlock.json production/runs/content-production-20260818T060700Z-01.json .github/workflows
          git commit -m "[IMAGE V2] Link preserved multi-visuals to production"

      - name: Recheck remote and push guarded commit chain
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master-migration
          test "$(git rev-parse origin/master-migration)" = "$BASE_HEAD"
          git push origin HEAD:master-migration
          echo "MASTER FINAL PUSH: $(git rev-parse HEAD)"
          echo "OPENAI ADDITIONAL GENERATION REQUESTS: 0"
          echo 'ADDITIONAL OPENAI API COST: $0.00'
