name: Display Repair Malawi Recovery Scout

on:
  push:
    branches: [master-migration]
    paths:
      - .github/workflows/display-repair-malawi-recovery-scout.yml

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master-migration
          fetch-depth: 0
      - run: python -m pip install --disable-pip-version-check --no-cache-dir 'Pillow>=10,<12'
      - name: Inspect current bytes and all historical Malawi image blobs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, io, json, subprocess
          from pathlib import Path
          from PIL import Image

          OUT=Path('.display-repair-staging'); OUT.mkdir(exist_ok=True)
          current_path=Path('strains/malawi/images/generated/primary.webp')
          current=current_path.read_bytes()
          sha=lambda b:hashlib.sha256(b).hexdigest()

          def inspect(raw):
              meta={'bytes':len(raw),'sha256':sha(raw),'magicHex':raw[:16].hex()}
              try:
                  with Image.open(io.BytesIO(raw)) as im:
                      meta.update({'decodable':True,'format':im.format,'width':im.width,'height':im.height,'mode':im.mode})
                      im.verify()
                  meta['verified']=True
              except Exception as e:
                  meta.update({'decodable':False,'verified':False,'error':type(e).__name__})
              return meta

          report={'current':inspect(current),'historicalCandidates':[],'recoveryMode':None}
          recovered=None

          # Best case: current asset is a decodable image with the wrong container/extension.
          if report['current'].get('decodable') and report['current'].get('verified'):
              with Image.open(io.BytesIO(current)) as im:
                  im=im.convert('RGB')
                  buf=io.BytesIO(); im.save(buf,format='WEBP',quality=92,method=6)
                  recovered=buf.getvalue()
              rmeta=inspect(recovered)
              if rmeta.get('format')=='WEBP' and rmeta.get('verified'):
                  report['recoveryMode']='TRANSCODE_CURRENT_FORMAL_ASSET'
                  report['recovered']=rmeta

          # Otherwise scan every reachable historical Git blob whose path mentions Malawi and looks like an image.
          if recovered is None:
              objects=subprocess.check_output(['git','rev-list','--objects','--all'],text=True,errors='replace').splitlines()
              seen=set()
              for line in objects:
                  parts=line.split(' ',1)
                  if len(parts)!=2: continue
                  oid,path=parts
                  low=path.lower()
                  if 'malawi' not in low or not low.endswith(('.jpg','.jpeg','.png','.webp')): continue
                  if oid in seen: continue
                  seen.add(oid)
                  try: raw=subprocess.check_output(['git','cat-file','blob',oid],stderr=subprocess.DEVNULL)
                  except subprocess.CalledProcessError: continue
                  meta=inspect(raw); meta.update({'objectId':oid,'path':path})
                  report['historicalCandidates'].append(meta)
                  if recovered is None and meta.get('decodable') and meta.get('verified'):
                      with Image.open(io.BytesIO(raw)) as im:
                          im=im.convert('RGB'); buf=io.BytesIO(); im.save(buf,format='WEBP',quality=92,method=6); cand=buf.getvalue()
                      cmeta=inspect(cand)
                      if cmeta.get('format')=='WEBP' and cmeta.get('verified'):
                          recovered=cand
                          report['recoveryMode']='TRANSCODE_HISTORICAL_FORMAL_BLOB'
                          report['recoveredSource']={'objectId':oid,'path':path,'sourceMeta':meta}
                          report['recovered']=cmeta

          if recovered is not None:
              (OUT/'malawi-recovered.webp').write_bytes(recovered)
          else:
              report['recoveryMode']='NONE'
          (OUT/'malawi-scout.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps({'current':report['current'],'recoveryMode':report['recoveryMode'],'historicalImageBlobCount':len(report['historicalCandidates'])},ensure_ascii=False))
          PY
      - name: Commit scout result and candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name strain-atlas-display-repair
          git config user.email actions@users.noreply.github.com
          git add .display-repair-staging/malawi-scout.json
          test -f .display-repair-staging/malawi-recovered.webp && git add .display-repair-staging/malawi-recovered.webp || true
          git commit -m "[DISPLAY REPAIR] Stage Malawi recovery scout result"
          git pull --rebase origin master-migration
          git push origin HEAD:master-migration
