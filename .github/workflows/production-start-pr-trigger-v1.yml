name: PRODUCTION START V1 PR TRIGGER

on:
  pull_request:
    types: [opened, reopened]
    paths:
      - .github/production-triggers/s1-five-pr-v1

jobs:
  cancel-duplicate:
    name: Cancel duplicate production dispatch
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel duplicate queued run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel 32231209024 --repo "$GITHUB_REPOSITORY"
