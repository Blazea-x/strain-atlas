name: PRODUCTION START V1 PR TRIGGER

on:
  pull_request_target:
    types: [opened, reopened]
    paths:
      - .github/production-triggers/s1-five-pr-v1

jobs:
  dispatch:
    name: Dispatch five-cultivar PRODUCTION START V1
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch existing production workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run production-start-v1.yml --repo "$GITHUB_REPOSITORY" --ref master-migration -f batch_size=5 -f generate_images=true
