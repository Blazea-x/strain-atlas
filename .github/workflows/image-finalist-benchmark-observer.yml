name: IMAGE V2 Finalist Benchmark Observer

on:
  push:
    branches: [master-migration]
    paths: ['.github/workflows/image-finalist-benchmark-observer.yml']

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: master-migration, fetch-depth: 1, persist-credentials: true}
      - name: Wait for finalist benchmark and record run id
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: 603526cd697d08c0e1eb30f909849eefdf7a5ae6
        shell: bash
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']; target=os.environ['TARGET_SHA']
          url=f'https://api.github.com/repos/{repo}/actions/workflows/image-finalist-benchmark-kali-mist-v2.yml/runs?branch=master-migration&event=push&per_page=20'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          found=None
          for _ in range(210):
            req=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
            matches=[x for x in data.get('workflow_runs',[]) if x.get('head_sha')==target]
            if matches:
              found=max(matches,key=lambda x:x['id'])
              if found.get('status')=='completed': break
            time.sleep(8)
          if not found: raise SystemExit('target benchmark run not found')
          out={'runId':found['id'],'name':found.get('name'),'headSha':found.get('head_sha'),'status':found.get('status'),'conclusion':found.get('conclusion'),'htmlUrl':found.get('html_url'),'createdAt':found.get('created_at'),'updatedAt':found.get('updated_at')}
          os.makedirs('docs/benchmark-results',exist_ok=True)
          open('docs/benchmark-results/kali-mist-finalist-run-latest.json','w').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out))
          PY
          git config user.name 'strain-atlas-image-benchmark-observer'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/benchmark-results/kali-mist-finalist-run-latest.json
          test -z "$(git status --porcelain -- strains production runtime UPLOAD_IMAGES_HERE)"
          git commit -m '[IMAGE V2] Record finalist benchmark run id'
          git push origin HEAD:master-migration
