name: PRODUCTION START ONCE

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/production-start-once.yml"

jobs:
  launch:
    if: startsWith(github.event.head_commit.message, 'Run next production five')
    permissions:
      contents: write
    uses: Blazea-x/strain-atlas/.github/workflows/production-start-v1.yml@master-migration
    with:
      batch_size: "5"
      generate_images: true
    secrets: inherit
