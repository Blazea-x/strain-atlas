name: HOME UX V2 Pages History Probe
on:
  push:
    branches: [main]
    paths: [".github/workflows/home-ux-v2-pages-history-probe.yml"]
permissions:
  contents: write
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Capture latest successful public deployment workflow run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/home-ux-v2-pages-history-probe
          gh run list --workflow deploy-public-ui-pages.yml --branch main --status success --limit 10 --json databaseId,headSha,status,conclusion,event,createdAt,url --jq '.[0]' > .github/home-ux-v2-pages-history-probe/result.json
          git config user.name home-ux-v2-e2e-bot
          git config user.email actions@users.noreply.github.com
          git pull --rebase origin main
          git add .github/home-ux-v2-pages-history-probe/result.json
          git commit -m 'Record latest successful Pages deployment [skip ci]'
          git push origin HEAD:main
