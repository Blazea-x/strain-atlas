name: TEMP IMAGE PRODUCTION V2 Promotion Probe

on:
  pull_request_target:
    branches: [master-migration]
    types: [edited]

permissions:
  actions: read
  contents: write

jobs:
  probe:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'image-production-v2-review-dr-malawi-20260819' &&
      contains(github.event.pull_request.body, 'STATUS_PROBE_ONLY_AFTER_PROMOTION')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Record promotion workflow run states only
        shell: bash
        run: |
          python - <<'PY'
          import os,json,urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'strain-atlas-v2-promotion-probe'}
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/workflows/temp-image-production-v2-review-trigger.yml/runs?per_page=20',headers=headers)
          with urllib.request.urlopen(req,timeout=30) as r:data=json.load(r)
          rows=[{'id':x.get('id'),'event':x.get('event'),'status':x.get('status'),'conclusion':x.get('conclusion'),'createdAt':x.get('created_at'),'updatedAt':x.get('updated_at'),'headSha':x.get('head_sha')} for x in data.get('workflow_runs',[])]
          out=Path('.image-transfer/review/image-production-v2-dr-grinspoon-malawi/promotion-status-probe.json')
          out.parent.mkdir(parents=True,exist_ok=True); out.write_text(json.dumps({'runs':rows},indent=2)+'\n',encoding='utf-8')
          print('PROMOTION STATUS PROBE ONLY. OPENAI REQUESTS: 0')
          PY
          git config user.name strain-atlas-bot
          git config user.email actions@users.noreply.github.com
          git add .image-transfer/review/image-production-v2-dr-grinspoon-malawi/promotion-status-probe.json
          git commit -m 'Record V2 promotion status probe' || true
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
