name: FILTER UX V1 Regression Rerun Once
"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/filter-ux-v1-regression-rerun-once.yml"
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PUBLIC_URL: https://blazea-x.github.io/strain-atlas/
      CATALOG_URL: https://raw.githubusercontent.com/Blazea-x/strain-atlas/master-migration/runtime/catalog.json
      PUBLICATION_URL: https://raw.githubusercontent.com/Blazea-x/strain-atlas/master-migration/production/publication.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard data branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/filter-regression-rerun
          git fetch origin master-migration
          git rev-parse origin/master-migration > /tmp/filter-regression-rerun/master-start.txt
      - name: Install Selenium
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q selenium
          command -v google-chrome
          command -v chromedriver
      - name: Run data-aware public regression E2E
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/filter-regression-rerun/e2e.py.gz.b64 <<'B64'

B64
          base64 -d /tmp/filter-regression-rerun/e2e.py.gz.b64 | gzip -dc > /tmp/filter-regression-rerun/e2e.py
          python /tmp/filter-regression-rerun/e2e.py
      - name: Confirm master unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master-migration
          git rev-parse origin/master-migration > /tmp/filter-regression-rerun/master-end.txt
          test "$(cat /tmp/filter-regression-rerun/master-start.txt)" = "$(cat /tmp/filter-regression-rerun/master-end.txt)"
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filter-ux-v1-regression-rerun-${{ github.run_id }}
          path: /tmp/filter-regression-rerun
          if-no-files-found: error
      - name: Cleanup verifier
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status=FAIL; test -f /tmp/filter-regression-rerun/PASS && status=PASS
          git fetch origin main; git checkout main; git reset --hard origin/main
          if [ -f .github/workflows/filter-ux-v1-regression-rerun-once.yml ]; then
            git rm .github/workflows/filter-ux-v1-regression-rerun-once.yml
            git config user.name filter-ux-v1-regression-rerun-bot
            git config user.email actions@users.noreply.github.com
            git commit -m "Remove FILTER UX V1 regression rerun ${GITHUB_RUN_ID} ${status} [skip ci]"
            git push origin HEAD:main
          fi
