name: Display Repair Preflight - Dr Grinspoon + Malawi

on:
  push:
    branches: [master-migration]
    paths:
      - .github/workflows/display-repair-preflight-dr-grinspoon-malawi.yml

permissions:
  contents: read

env:
  OUT: display-repair-preflight-artifact

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master-migration
          fetch-depth: 0
          persist-credentials: false

      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'openai>=1.100,<3' 'Pillow>=10,<12'

      - name: Measure state, recover Malawi candidate, generate one Dr Grinspoon candidate
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, os, subprocess, time
          from pathlib import Path
          from PIL import Image

          ROOT = Path('.')
          OUT = Path(os.environ['OUT'])
          OUT.mkdir(parents=True, exist_ok=True)
          read_json = lambda p: json.loads(Path(p).read_text(encoding='utf-8'))
          sha256 = lambda b: hashlib.sha256(b).hexdigest()

          master_head = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          main_head = subprocess.check_output(['git','ls-remote','origin','refs/heads/main'], text=True).split()[0]
          publication = read_json('production/publication.json')
          pub = {e['strainId']: e for e in publication.get('entries', [])}
          dr = read_json('strains/dr-grinspoon/strain.json')
          mw = read_json('strains/malawi/strain.json')
          runtime = read_json('runtime/catalog.json')
          runtime_by_id = {x['id']: x for x in runtime.get('cultivars', [])}

          dr_manifest = Path('production/manifests/dr-grinspoon.json')
          dr_primary = Path('strains/dr-grinspoon/images/generated/primary.webp')
          mw_primary_rel = 'strains/malawi/images/generated/primary.webp'
          mw_primary = Path(mw_primary_rel)
          mw_visuals = mw.get('visuals') or []
          mw_primary_visuals = [v for v in mw_visuals if v.get('role') == 'primary']

          def webp_ok(raw):
              if len(raw) < 12 or raw[:4] != b'RIFF' or raw[8:12] != b'WEBP':
                  return False, None
              try:
                  with Image.open(io.BytesIO(raw)) as im:
                      im.verify()
                  with Image.open(io.BytesIO(raw)) as im:
                      return True, {'width': im.width, 'height': im.height, 'format': im.format}
              except Exception:
                  return False, None

          current_mw_raw = mw_primary.read_bytes() if mw_primary.is_file() else b''
          current_mw_ok, current_mw_meta = webp_ok(current_mw_raw)

          # Hard preflight assertions: do not guess or broaden scope.
          assert dr.get('id') == 'dr-grinspoon'
          assert dr.get('visuals') == [], 'Dr Grinspoon visuals are no longer empty; safe-stop'
          assert pub.get('dr-grinspoon', {}).get('state') == 'published', 'Dr Grinspoon is not published; safe-stop'
          assert not dr_manifest.exists(), 'Dr Grinspoon manifest now exists; safe-stop'
          assert not dr_primary.exists(), 'Dr Grinspoon primary now exists; safe-stop'
          assert runtime_by_id.get('dr-grinspoon', {}).get('visuals') == [], 'Dr Grinspoon runtime no longer mirrors visuals=[]; safe-stop'

          assert pub.get('malawi', {}).get('state') == 'published', 'Malawi is not published; safe-stop'
          assert len(mw_primary_visuals) == 1, 'Malawi primary visual count is not 1; safe-stop'
          assert mw_primary_visuals[0].get('src') == mw_primary_rel, 'Malawi primary src differs from standard path; safe-stop'
          assert runtime_by_id.get('malawi', {}).get('visuals') == mw_visuals, 'Malawi runtime visual payload is stale; safe-stop'
          assert mw_primary.exists(), 'Malawi primary is missing; historical recovery path differs; safe-stop'
          assert not current_mw_ok, 'Malawi current primary is already valid WebP; safe-stop to avoid unnecessary mutation'

          # Recover newest valid historical Malawi primary from Git history. Never regenerate Malawi.
          commits = subprocess.check_output(['git','log','--format=%H','--all','--',mw_primary_rel], text=True).splitlines()
          recovery = None
          checked = []
          for commit in commits:
              try:
                  raw = subprocess.check_output(['git','show',f'{commit}:{mw_primary_rel}'], stderr=subprocess.DEVNULL)
              except subprocess.CalledProcessError:
                  continue
              ok, meta = webp_ok(raw)
              checked.append({'commit': commit, 'byteLength': len(raw), 'sha256': sha256(raw), 'validWebP': ok, 'meta': meta})
              if ok and sha256(raw) != sha256(current_mw_raw):
                  recovery = {'commit': commit, 'raw': raw, 'meta': meta, 'sha256': sha256(raw), 'byteLength': len(raw)}
                  break
          if recovery:
              (OUT / 'malawi-recovered.webp').write_bytes(recovery['raw'])

          # Existing formal source first; live official page was separately verified before this workflow.
          evidence = [
              {
                  'sourceRef': 'barneys-farm-dr-grinspoon',
                  'sourceType': 'breederOfficial',
                  'description': 'Barney\'s Farm identifies Dr Grinspoon as a pure heirloom 100% Sativa that grows tall and thin.'
              },
              {
                  'sourceRef': 'barneys-farm-dr-grinspoon',
                  'sourceType': 'breederOfficial',
                  'description': 'At maturity, Barney\'s Farm describes the colas as compact green and reddish-brown bead-like flowers that hang loosely on thin stems.'
              }
          ]
          prompt = (
              'Photorealistic botanical documentary photograph of a single mature female Dr Grinspoon cannabis plant, '
              'pure heirloom 100% Sativa. Show the complete plant or enough of the plant to clearly read its architecture. '
              'The plant must be tall and thin with slender stems. Its defining mature flowers are unusual compact green '
              'and reddish-brown bead-like clusters that hang loosely along thin stems, not conventional thick conical buds. '
              'Keep the overall silhouette open and delicate, with realistic sativa foliage and natural internodal spacing. '
              'Make the bead-like flower structure unmistakable and botanically plausible. One plant only. No text, labels, '
              'infographic, collage, split frame, hands, harvested buds, jars, smoke, or decorative cannabis graphics. '
              'Natural photographic lighting and credible horticultural setting. Avoid dense chunky indica-style colas.'
          )
          visual_metadata = {
              'alt': 'Dr Grinspoonの細長いサティバ株姿と、細い茎に疎らに付く緑〜赤褐色のビーズ状花序を表現したAI生成参考ビジュアル',
              'rights': 'AI-generated project asset for Cannabis Strain Wisdom; prompt derived from cited breeder-official morphology evidence.',
              'scope': 'cultivar',
              'aiGenerated': True,
              'sourceType': 'aiGenerated'
          }

          configured = bool(os.environ.get('OPENAI_API_KEY','').strip())
          print('OPENAI_API_KEY: CONFIGURED' if configured else 'OPENAI_API_KEY: NOT CONFIGURED')
          if not configured:
              raise RuntimeError('OPENAI_API_KEY not configured; safe-stop before request')
          if recovery is None:
              # Malawi must be recoverable without regeneration before any paid Dr request is sent.
              summary = {
                  'status': 'SAFE_STOP', 'reason': 'No valid historical Malawi WebP recovery candidate found',
                  'masterHead': master_head, 'mainHead': main_head,
                  'malawi': {'currentSha256': sha256(current_mw_raw), 'currentBytes': len(current_mw_raw), 'currentValidWebP': current_mw_ok, 'historyChecked': checked},
                  'drGrinspoon': {'generationExecuted': False, 'promptSnapshot': prompt, 'evidenceSnapshot': evidence, 'visualMetadataSnapshot': visual_metadata},
                  'additionalOpenAiCostUsd': 0.0
              }
              (OUT/'preflight-summary.json').write_text(json.dumps(summary, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')
              raise RuntimeError('Malawi recovery impossible from repository history; safe-stop')

          from openai import OpenAI
          client = OpenAI()
          started = time.monotonic()
          response = client.images.generate(
              model='gpt-image-2',
              prompt=prompt,
              size='1024x1536',
              quality='high',
              output_format='jpeg',
              n=1,
          )
          if len(response.data) != 1 or not response.data[0].b64_json:
              raise RuntimeError('OpenAI response did not contain exactly one base64 image')
          raw = base64.b64decode(response.data[0].b64_json)
          with Image.open(io.BytesIO(raw)) as im:
              im.verify()
          with Image.open(io.BytesIO(raw)) as im:
              dr_meta = {'width': im.width, 'height': im.height, 'format': im.format}
          if dr_meta['format'] != 'JPEG':
              raise RuntimeError(f'Unexpected OpenAI image format: {dr_meta}')
          (OUT/'dr-grinspoon.jpg').write_bytes(raw)

          usage = response.usage.model_dump() if getattr(response, 'usage', None) else {}
          input_tokens = usage.get('input_tokens') if isinstance(usage, dict) else None
          output_tokens = usage.get('output_tokens') if isinstance(usage, dict) else None
          input_cost = input_tokens * 5.0 / 1_000_000 if isinstance(input_tokens,(int,float)) else 0.0
          output_cost = output_tokens * 30.0 / 1_000_000 if isinstance(output_tokens,(int,float)) else 0.165
          cost = round(input_cost + output_cost, 8)

          summary = {
              'status': 'READY_FOR_HUMAN_VISUAL_REVIEW',
              'masterHead': master_head,
              'mainHead': main_head,
              'drGrinspoon': {
                  'publication': pub['dr-grinspoon'],
                  'runtimeVisuals': runtime_by_id['dr-grinspoon'].get('visuals'),
                  'manifestExists': False,
                  'primaryExists': False,
                  'generationExecuted': True,
                  'model': 'gpt-image-2', 'quality': 'high', 'size': '1024x1536', 'outputFormat': 'jpeg',
                  'generatedJpegSha256': sha256(raw), 'byteLength': len(raw), 'dimensions': dr_meta,
                  'promptSnapshot': prompt, 'evidenceSnapshot': evidence, 'visualMetadataSnapshot': visual_metadata,
                  'usage': usage, 'estimatedCostUsd': cost, 'elapsedSeconds': round(time.monotonic()-started,3)
              },
              'malawi': {
                  'publication': pub['malawi'],
                  'visuals': mw_visuals,
                  'runtimeVisuals': runtime_by_id['malawi'].get('visuals'),
                  'currentPath': mw_primary_rel,
                  'currentSha256': sha256(current_mw_raw), 'currentBytes': len(current_mw_raw), 'currentValidWebP': current_mw_ok,
                  'recoveryCandidate': {k:v for k,v in recovery.items() if k != 'raw'},
                  'historyChecked': checked
              },
              'mainMutationCount': 0,
              'productionMutationCount': 0,
              'additionalOpenAiCostUsd': cost
          }
          (OUT/'preflight-summary.json').write_text(json.dumps(summary, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')
          print(json.dumps({'status':summary['status'],'drSha256':sha256(raw),'malawiRecoveryCommit':recovery['commit'],'costUsd':cost}, ensure_ascii=False))
          PY

      - name: Upload preflight artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: display-repair-preflight-${{ github.run_id }}
          path: display-repair-preflight-artifact/
          if-no-files-found: error
          retention-days: 14
