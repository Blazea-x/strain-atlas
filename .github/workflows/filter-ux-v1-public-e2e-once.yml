name: FILTER UX V1 Public E2E Once
"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/filter-ux-v1-public-e2e-once.yml"

permissions:
  contents: write
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      EXPECTED_BASE: 4174053a2b1f4fe180b98ad5e6e3fc6e06e9b048
      UI_SHA: 3dab30ba2403a4c030c31ae88af77a0165563ba4
      MASTER_AT_RUN_START: 910ae4c794193f75bb588fec0ca80941546bf8f7
      PUBLIC_URL: https://blazea-x.github.io/strain-atlas/
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard verification base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main master-migration
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          test "$(git diff --name-only "$EXPECTED_BASE"..HEAD)" = ".github/workflows/filter-ux-v1-public-e2e-once.yml"
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
          test "$(git rev-parse origin/master-migration)" = "$MASTER_AT_RUN_START"
      - name: Run live Pages E2E
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/filter-ux-v1-verify.sh.gz.b64 <<'B64'
          
          B64
          base64 -d /tmp/filter-ux-v1-verify.sh.gz.b64 | gzip -dc > /tmp/filter-ux-v1-verify.sh
          set +e
          bash /tmp/filter-ux-v1-verify.sh
          code=$?
          set -e
          mkdir -p /tmp/filter-ux-v1-report
          printf '%s\n' "$code" > /tmp/filter-ux-v1-report/verify-exit.txt
      - name: Persist verification result temporarily
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/filter-ux-v1-report')
          out={'verify_exit':int((root/'verify-exit.txt').read_text().strip()) if (root/'verify-exit.txt').exists() else 999}
          for name in ['pages.json','pages-run.json','e2e-report.json']:
              p=root/name
              if p.exists():
                  try: out[name[:-5]]=json.loads(p.read_text())
                  except Exception as e: out[name]={'error':str(e),'text':p.read_text()[:4000]}
          Path('.github/filter-ux-v1-e2e-result.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name filter-ux-v1-e2e-bot
          git config user.email actions@users.noreply.github.com
          git add .github/filter-ux-v1-e2e-result.json
          git commit -m "Record FILTER UX V1 public E2E result [skip ci]"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD^)"
          git push origin HEAD:main
      - name: Assert E2E result
        shell: bash
        run: |
          test "$(cat /tmp/filter-ux-v1-report/verify-exit.txt)" = "0"
      - name: Upload E2E artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filter-ux-v1-public-e2e-${{ github.run_id }}
          path: /tmp/filter-ux-v1-report
          if-no-files-found: warn
      - name: Remove one-shot verifier
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          if [ -f .github/workflows/filter-ux-v1-public-e2e-once.yml ]; then
            git rm .github/workflows/filter-ux-v1-public-e2e-once.yml
            git config user.name filter-ux-v1-e2e-bot
            git config user.email actions@users.noreply.github.com
            git commit -m "Remove FILTER UX V1 public verifier [skip ci]"
            git push origin HEAD:main
          fi
