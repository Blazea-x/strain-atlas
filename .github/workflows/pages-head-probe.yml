name: Pages Head Probe
on:
  push:
    branches: [main]
    paths: [".github/workflows/pages-head-probe.yml"]
permissions:
  contents: write
  deployments: read
  pages: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Capture
        run: |
          mkdir -p .github/pages-head-probe
          gh api "repos/${GITHUB_REPOSITORY}/pages" > .github/pages-head-probe/pages.json
          gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=1" > /tmp/d.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/d.json')); d=a[0] if a else {}
          json.dump({k:d.get(k) for k in ['id','sha','ref','environment','created_at','updated_at']},open('.github/pages-head-probe/deployment.json','w'),indent=2)
          PY
          git config user.name pages-head-probe
          git config user.email actions@users.noreply.github.com
          git add .github/pages-head-probe
          git commit -m 'Record final Pages head probe [skip ci]'
          git push origin HEAD:main
