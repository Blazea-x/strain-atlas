name: RECOVER S1 EXISTING CANDIDATES 32231155417

on:
  push:
    branches: [master-migration]
    paths:
      - "scripts/ai-visual-qa-v1.py"

concurrency:
  group: recover-s1-existing-candidates-32231155417
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  recover:
    if: github.event.head_commit.message == 'Fix CLIP embedding extraction for AI visual QA'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master-migration
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve latest protected heads and runtime baseline
        id: base
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin master-migration:refs/remotes/origin/master-migration main:refs/remotes/origin/main
          BASE_SHA="$(git rev-parse origin/master-migration)"
          MAIN_HEAD="$(git rev-parse origin/main)"
          git reset --hard "$BASE_SHA"
          RUNTIME_BEFORE="$(node -e "const c=require('./runtime/catalog.json');process.stdout.write(String(c.counts.cultivars))")"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "main_head=$MAIN_HEAD" >> "$GITHUB_OUTPUT"
          echo "runtime_before=$RUNTIME_BEFORE" >> "$GITHUB_OUTPUT"

      - name: Install image and local semantic QA dependencies
        run: |
          python -m pip install --disable-pip-version-check "Pillow==11.3.0" "transformers>=4.44,<6"
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu "torch>=2.4,<3"

      - name: Regression fixtures for CLIP embedding extraction and fail-closed behavior
        run: python scripts/test-ai-visual-qa-v1.py

      - name: Download original Phase B checkpoint
        uses: actions/download-artifact@v4
        with:
          name: production-start-phase-b-32231155417
          path: ${{ runner.temp }}/phase-b
          github-token: ${{ github.token }}
          run-id: 32231155417

      - name: Download immutable existing review candidate package
        uses: actions/download-artifact@v4
        with:
          name: production-review-32231155417
          path: ${{ runner.temp }}/review
          github-token: ${{ github.token }}
          run-id: 32231155417

      - name: Candidate byte, receipt, current manifest, prompt and evidence binding preflight
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - "$RUNNER_TEMP/phase-b/phase-b-checkpoint.json" "$RUNNER_TEMP/review" "$RUNNER_TEMP/reuse-preflight.json" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import { canonicalJson, sha256, visualPreparationHash } from './scripts/content-production-state.mjs';
          const [phasePath, reviewDir, outPath] = process.argv.slice(2);
          const phase = JSON.parse(fs.readFileSync(phasePath, 'utf8'));
          const review = JSON.parse(fs.readFileSync(path.join(reviewDir, 'review-package.json'), 'utf8'));
          const run = JSON.parse(fs.readFileSync(path.join('production', 'runs', phase.productionRunId + '.json'), 'utf8'));
          const publication = JSON.parse(fs.readFileSync('production/publication.json', 'utf8'));
          const hashFile = p => crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const hashCanonical = v => sha256(canonicalJson(v));
          const rows = [];
          for (const cp of phase.items) {
            const id = cp.strainId;
            const reasons = [];
            const candidatePath = path.join(reviewDir, 'candidates', id + '.jpg');
            const receiptPath = path.join(reviewDir, 'receipts', id + '.json');
            const manifestPath = path.join('production', 'manifests', id + '.json');
            const strainPath = path.join('strains', id, 'strain.json');
            const candidateExists = fs.existsSync(candidatePath);
            const receiptExists = fs.existsSync(receiptPath);
            const manifestExists = fs.existsSync(manifestPath);
            const strainExists = fs.existsSync(strainPath);
            if (!candidateExists) reasons.push('CANDIDATE_MISSING');
            if (!receiptExists) reasons.push('RECEIPT_MISSING');
            if (!manifestExists) reasons.push('MANIFEST_MISSING');
            if (!strainExists) reasons.push('FORMAL_DATA_MISSING');
            let rec, m, s;
            try { if (receiptExists) rec = JSON.parse(fs.readFileSync(receiptPath, 'utf8')); } catch { reasons.push('RECEIPT_INVALID'); }
            try { if (manifestExists) m = JSON.parse(fs.readFileSync(manifestPath, 'utf8')); } catch { reasons.push('MANIFEST_INVALID'); }
            try { if (strainExists) s = JSON.parse(fs.readFileSync(strainPath, 'utf8')); } catch { reasons.push('FORMAL_DATA_INVALID'); }
            const runItem = (run.items || []).find(x => x.strainId === id);
            const pub = (publication.entries || []).find(x => x.strainId === id);
            const reviewItem = (review.candidates || []).find(x => x.strainId === id);
            if (!runItem) reasons.push('RUN_ITEM_MISSING');
            if (!pub) reasons.push('PUBLICATION_ENTRY_MISSING');
            if (!reviewItem) reasons.push('REVIEW_INDEX_MISSING');
            let candidateShaVerified = false;
            let currentManifestBindingVerified = false;
            if (rec && m && runItem && pub && reviewItem && candidateExists) {
              const actualSha = hashFile(candidatePath);
              candidateShaVerified = actualSha === rec.candidateSha256;
              if (!candidateShaVerified) reasons.push('CANDIDATE_SHA_MISMATCH');
              if (rec.model !== 'gpt-image-2' || rec.quality !== 'medium' || rec.maximumRequestsForCultivar !== 1 || rec.automaticRetry !== 0) reasons.push('IMAGE_POLICY_MISMATCH');
              if (rec.productionRunId !== phase.productionRunId || String(rec.workflowRunId) !== '32231155417') reasons.push('RUN_BINDING_MISMATCH');
              if (rec.manifestId !== m.manifestId || m.manifestId !== cp.manifestId) reasons.push('MANIFEST_ID_MISMATCH');
              if (rec.manifestRevision !== m.revision || m.revision !== cp.manifestRevision) reasons.push('MANIFEST_REVISION_MISMATCH');
              if (rec.attempt !== m.attempt || m.attempt !== cp.attempt) reasons.push('MANIFEST_ATTEMPT_MISMATCH');
              if (rec.visualPreparationHash !== m.visualPreparationHash || m.visualPreparationHash !== cp.visualPreparationHash) reasons.push('VISUAL_PREPARATION_HASH_MISMATCH');
              if (sha256(m.promptSnapshot) !== rec.promptSha256 || rec.promptSha256 !== cp.promptSha256) reasons.push('PROMPT_BINDING_MISMATCH');
              if (hashCanonical(m.evidenceSnapshot) !== rec.evidenceSha256 || rec.evidenceSha256 !== cp.evidenceSha256) reasons.push('EVIDENCE_BINDING_MISMATCH');
              if (visualPreparationHash({promptSnapshot:m.promptSnapshot,evidenceSnapshot:m.evidenceSnapshot,visualMetadataSnapshot:m.visualMetadataSnapshot}) !== m.visualPreparationHash) reasons.push('VISUAL_PREPARATION_RECOMPUTE_MISMATCH');
              if (reviewItem.approvalBindingSha256 !== rec.approvalBindingSha256) reasons.push('REVIEW_BINDING_MISMATCH');
              if (crypto.createHash('sha256').update(canonicalJson(rec.approvalBindingPayload || {})).digest('hex') !== rec.approvalBindingSha256) reasons.push('APPROVAL_BINDING_HASH_MISMATCH');
              if (pub.state !== 'pending') reasons.push('PUBLICATION_NOT_PENDING');
              if (!['IMAGE_PENDING','NEEDS_REVIEW'].includes(runItem.productionPhase)) reasons.push('PRODUCTION_PHASE_STALE');
              if ((s?.visuals || []).some(v => v.role === 'primary')) reasons.push('PRIMARY_ALREADY_LINKED');
              const cleanPending = m.approvalStatus === 'pending';
              const recoverableModelError = m.approvalStatus === 'rejected' && m.approvalType === 'ai-visual-qa' && m.aiVisualQa?.reason === 'AI_QA_MODEL_ERROR' && String(pub.unpublicationReason || '').includes('AI_QA_MODEL_ERROR') && !m.approvedAt && !m.approvedSourceSha256;
              if (!cleanPending && !recoverableModelError) reasons.push('MANIFEST_APPROVAL_STATE_NOT_RECOVERABLE');
              currentManifestBindingVerified = !reasons.some(r => /BINDING|MANIFEST_|VISUAL_PREPARATION|PROMPT_|EVIDENCE_|RUN_BINDING/.test(r));
              if (reasons.length === 0 && recoverableModelError) {
                m.approvalStatus = 'pending';
                m.approvalType = null;
                delete m.aiVisualQa;
                m.audit = [...(m.audit || []), {severity:'INFO',code:'AI_QA_MODEL_ERROR_RECOVERY_PREPARED',at:new Date().toISOString().replace(/\.\d{3}Z$/,'Z'),sourceWorkflowRunId:'32231155417',note:'Known semantic QA implementation error cleared for existing-candidate re-evaluation; prompt, evidence and candidate bytes unchanged.'}];
                fs.writeFileSync(manifestPath, JSON.stringify(m, null, 2) + '\n');
              }
            }
            rows.push({strainId:id,candidateExists,receiptExists,candidateShaVerified,currentManifestBindingVerified,reuseEligible:reasons.length===0,reasons});
          }
          const result = {sourceWorkflowRunId:'32231155417',productionRunId:phase.productionRunId,newOpenAiRequests:0,additionalImageCostUsd:0,rows};
          fs.writeFileSync(outPath, JSON.stringify(result, null, 2) + '\n');
          console.log(JSON.stringify(result, null, 2));
          NODE

      - name: Legacy candidate verifier against current state, per cultivar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verified" "$RUNNER_TEMP/qa-review/candidates" "$RUNNER_TEMP/qa-review/receipts" "$RUNNER_TEMP/qa-manifests" "$RUNNER_TEMP/visual-qa"
          cp "$RUNNER_TEMP/review/review-package.json" "$RUNNER_TEMP/qa-review/review-package.json"
          node - "$RUNNER_TEMP/reuse-preflight.json" <<'NODE' > "$RUNNER_TEMP/eligible.tsv"
          const fs=require('fs');const p=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/review/review-package.json','utf8'));
          for(const x of p.rows.filter(x=>x.reuseEligible)){const rc=r.candidates.find(c=>c.strainId===x.strainId);console.log(x.strainId+'\t'+rc.approvalBindingSha256)}
          NODE
          : > "$RUNNER_TEMP/verifier.tsv"
          while IFS=$'\t' read -r ID BINDING; do
            test -n "$ID" || continue
            OUT="$RUNNER_TEMP/verified/$ID"
            node scripts/one-click-production-approve-v1.mjs verify --review-dir="$RUNNER_TEMP/review" --production-run-id="content-production-start-32231155417" --strain-id="$ID" --approval-binding="$BINDING" --out="$OUT" >/dev/null
            STATUS="$(node -e "const x=require(process.argv[1]);process.stdout.write(x.status)" "$OUT/verification.json")"
            printf '%s\t%s\n' "$ID" "$STATUS" >> "$RUNNER_TEMP/verifier.tsv"
            if [ "$STATUS" = "VERIFIED" ]; then
              cp "$RUNNER_TEMP/review/candidates/$ID.jpg" "$RUNNER_TEMP/qa-review/candidates/$ID.jpg"
              cp "$RUNNER_TEMP/review/receipts/$ID.json" "$RUNNER_TEMP/qa-review/receipts/$ID.json"
              cp "production/manifests/$ID.json" "$RUNNER_TEMP/qa-manifests/$ID.json"
            fi
          done < "$RUNNER_TEMP/eligible.tsv"

      - name: Re-run repaired fail-closed semantic QA on verified existing candidates only
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ai-visual-qa-v1.py --review-dir="$RUNNER_TEMP/qa-review" --manifest-dir="$RUNNER_TEMP/qa-manifests" --out-dir="$RUNNER_TEMP/visual-qa"
          node - "$RUNNER_TEMP/reuse-preflight.json" "$RUNNER_TEMP/verifier.tsv" "$RUNNER_TEMP/visual-qa" <<'NODE'
          const fs=require('fs'),path=require('path');const [pfile,vfile,qroot]=process.argv.slice(2);const p=JSON.parse(fs.readFileSync(pfile,'utf8'));
          const verified=new Map((fs.existsSync(vfile)?fs.readFileSync(vfile,'utf8').trim().split(/\r?\n/).filter(Boolean):[]).map(l=>{const [id,s]=l.split('\t');return[id,s]}));
          for(const row of p.rows){const q=path.join(qroot,row.strainId+'.json');if(fs.existsSync(q))continue;const reason=row.reuseEligible?(verified.get(row.strainId)==='VERIFIED'?'QA_RESULT_MISSING':'CANDIDATE_REUSE_VERIFIER_FAILED'):'CANDIDATE_REUSE_PREFLIGHT_FAILED';fs.writeFileSync(q,JSON.stringify({strainId:row.strainId,status:'FAIL',engine:'local-clip-semantic-v1',model:'openai/clip-vit-base-patch32',reason,checks:[{id:'existing_candidate_reuse',pass:false,detail:(row.reasons||[]).join(',')||reason}],failClosed:true},null,2)+'\n')}
          NODE

      - name: Apply existing AUTO-PUBLISH path and perform final validation once
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "strain-atlas-existing-candidate-recovery-bot"
          git config user.email "actions@users.noreply.github.com"
          node scripts/production-auto-publish-v1.mjs apply \
            --phase-b="$RUNNER_TEMP/phase-b/phase-b-checkpoint.json" \
            --review-dir="$RUNNER_TEMP/review" \
            --qa-root="$RUNNER_TEMP/visual-qa" \
            --base-sha="${{ steps.base.outputs.base_sha }}" \
            --main-head="${{ steps.base.outputs.main_head }}" \
            --stage-root="$RUNNER_TEMP/recovery-stage" \
            --out="$RUNNER_TEMP/auto-publish-result.json" >/dev/null
          node scripts/build-runtime-data.mjs
          rm -rf "$RUNNER_TEMP/main-audit"
          git worktree add --detach "$RUNNER_TEMP/main-audit" origin/main
          node scripts/validate-master-data.mjs
          node scripts/validate-cultivar-publication.mjs
          node scripts/audit-content-production.mjs --main-dir="$RUNNER_TEMP/main-audit"
          git worktree remove "$RUNNER_TEMP/main-audit" --force

      - name: Build recovery report and push one production transaction
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP/reuse-preflight.json" "$RUNNER_TEMP/verifier.tsv" "$RUNNER_TEMP/visual-qa" "$RUNNER_TEMP/auto-publish-result.json" "${{ steps.base.outputs.runtime_before }}" <<'NODE'
          const fs=require('fs'),path=require('path');const [pf,vf,qroot,af,before]=process.argv.slice(2);const pre=JSON.parse(fs.readFileSync(pf,'utf8')),auto=JSON.parse(fs.readFileSync(af,'utf8')),runtime=JSON.parse(fs.readFileSync('runtime/catalog.json','utf8')),pub=JSON.parse(fs.readFileSync('production/publication.json','utf8'));
          const verified=new Map((fs.existsSync(vf)?fs.readFileSync(vf,'utf8').trim().split(/\r?\n/).filter(Boolean):[]).map(l=>{const[a,b]=l.split('\t');return[a,b]}));const ids=new Set((runtime.cultivars||[]).map(x=>x.id));
          const rows=pre.rows.map(r=>{const q=JSON.parse(fs.readFileSync(path.join(qroot,r.strainId+'.json'),'utf8'));const m=JSON.parse(fs.readFileSync(path.join('production','manifests',r.strainId+'.json'),'utf8'));const pe=pub.entries.find(x=>x.strainId===r.strainId);const decode=(q.checks||[]).find(c=>c.id==='image_decode');return{cultivar:r.strainId,candidateReused:r.reuseEligible&&verified.get(r.strainId)==='VERIFIED',imageDecode:decode?.pass===true?'PASS':'FAIL',semanticQa:q.status,semanticQaReason:q.reason||null,primaryCreated:fs.existsSync(m.expectedPrimaryPath)&&m.approvalStatus==='auto-approved',publication:pe?.state||'pending',runtimeIncluded:ids.has(r.strainId)}});
          const report={status:auto.backlogRetained?.length===5?'FAIL':(auto.backlogRetained?.length?'PARTIAL':'PASS'),aiQaRootCauseConfirmed:true,qaImplementationFixed:true,qaFailClosedPreserved:true,existingCandidateArtifactsFound:pre.rows.filter(x=>x.candidateExists&&x.receiptExists).length,candidateShaVerified:pre.rows.filter(x=>x.candidateShaVerified).length,currentManifestBindingVerified:pre.rows.filter(x=>x.currentManifestBindingVerified).length,newOpenAiRequests:0,additionalImageCostUsd:0,rows,publishedWithImage:rows.filter(x=>x.publication==='published'&&x.primaryCreated).length,remainingBacklog:rows.filter(x=>x.publication!=='published').length,formalDataRetained:pre.rows.filter(x=>fs.existsSync(path.join('strains',x.strainId,'strain.json'))).length,masterValidation:'PASS',publicationValidation:'PASS',contentProductionAudit:'PASS',runtimeBuild:'PASS',runtimeCountBefore:Number(before),runtimeCountAfter:runtime.counts.cultivars,autoPublishResult:auto};fs.writeFileSync(process.env.RUNNER_TEMP+'/recovery-report.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report,null,2));
          NODE
          git add -- strains production runtime data.js sources.js
          BAD="$(git diff --cached --name-only | grep -Ev '^(strains/[^/]+/strain\.json|strains/[^/]+/images/generated/primary\.webp|production/manifests/[^/]+\.json|production/publication\.json|production/runs/[^/]+\.json|runtime/catalog\.json|data\.js|sources\.js)$' || true)"
          test -z "$BAD" || { echo "Forbidden recovery path(s):"; echo "$BAD"; exit 1; }
          git fetch --no-tags origin master-migration:refs/remotes/origin/master-migration main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "${{ steps.base.outputs.main_head }}"
          test "$(git rev-parse origin/master-migration)" = "${{ steps.base.outputs.base_sha }}" || { echo "master-migration changed during recovery; safe stop"; exit 75; }
          test -n "$(git diff --cached --name-only)" || { echo "No production recovery changes to commit"; exit 1; }
          git commit -m "Recover existing S1 candidates from AI QA model error [skip ci]"
          git push origin HEAD:master-migration
          echo "final_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: s1-existing-candidate-recovery-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/reuse-preflight.json
            ${{ runner.temp }}/verifier.tsv
            ${{ runner.temp }}/visual-qa/
            ${{ runner.temp }}/auto-publish-result.json
            ${{ runner.temp }}/recovery-report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Summary
        run: |
          cat "$RUNNER_TEMP/recovery-report.json" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Final master-migration HEAD: ${{ steps.publish.outputs.final_head }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Main HEAD unchanged: ${{ steps.base.outputs.main_head }}" >> "$GITHUB_STEP_SUMMARY"
          echo "OpenAI image requests: 0" >> "$GITHUB_STEP_SUMMARY"
          echo "Additional image cost: 0 USD" >> "$GITHUB_STEP_SUMMARY"
