name: Display Repair Finalizer Observer

on:
  push:
    branches: [master-migration]
    paths:
      - .github/workflows/display-repair-finalizer-observer.yml

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_HEAD: b3bc52a0e46c6f6061f13c961f7e03bf0b229694
      WORKFLOW_FILE: display-repair-finalize-dr-grinspoon-malawi.yml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master-migration
          fetch-depth: 0
      - name: Resolve exact finalizer run
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; target=os.environ['TARGET_HEAD']; workflow=os.environ['WORKFLOW_FILE']
          api='https://api.github.com'; headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get_json(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          run=None
          for _ in range(30):
              data=get_json(f'{api}/repos/{repo}/actions/workflows/{workflow}/runs?branch=master-migration&per_page=20')
              matches=[x for x in data.get('workflow_runs',[]) if x.get('head_sha')==target and x.get('event')=='push']
              if matches:
                  run=matches[0]
                  if run.get('status')=='completed': break
              time.sleep(5)
          payload={'targetHead':target,'runId':run.get('id') if run else None,'status':run.get('status') if run else None,'conclusion':run.get('conclusion') if run else None}
          Path('.display-repair-finalizer-status.json').write_text(json.dumps(payload,indent=2)+'\n')
          print(json.dumps(payload))
          PY
      - name: Commit status and remove observer
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/display-repair-finalizer-observer.yml
          git config user.name strain-atlas-display-repair
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "[DISPLAY REPAIR] Record finalizer status"
          git pull --rebase origin master-migration
          git push origin HEAD:master-migration
