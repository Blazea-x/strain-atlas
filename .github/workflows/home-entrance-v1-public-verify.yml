name: HOME ENTRANCE V1 PUBLIC VERIFY

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/home-entrance-v1-public-verify.yml

permissions:
  contents: read
  actions: read
  pages: read
  issues: write
  deployments: read

jobs:
  verify-public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect Pages configuration and wait for this main commit
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          pages_json="$(gh api "repos/$repo/pages")"
          printf '%s\n' "$pages_json" > /tmp/pages.json
          site_url="$(jq -r '.html_url' /tmp/pages.json)"
          build_type="$(jq -r '.build_type // "unknown"' /tmp/pages.json)"
          source_branch="$(jq -r '.source.branch // ""' /tmp/pages.json)"
          source_path="$(jq -r '.source.path // ""' /tmp/pages.json)"
          printf 'site_url=%s\n' "$site_url" >> "$GITHUB_OUTPUT"
          printf 'build_type=%s\n' "$build_type" >> "$GITHUB_OUTPUT"
          printf 'source_branch=%s\n' "$source_branch" >> "$GITHUB_OUTPUT"
          printf 'source_path=%s\n' "$source_path" >> "$GITHUB_OUTPUT"

          matched=0
          deployment_id=""
          deployment_sha=""
          deployment_state=""
          for _ in $(seq 1 48); do
            deployments="$(gh api "repos/$repo/deployments?environment=github-pages&per_page=10")"
            deployment_id="$(jq -r '.[0].id // empty' <<<"$deployments")"
            deployment_sha="$(jq -r '.[0].sha // empty' <<<"$deployments")"
            if [[ -n "$deployment_id" ]]; then
              deployment_state="$(gh api "repos/$repo/deployments/$deployment_id/statuses?per_page=20" --jq '.[0].state // "unknown"')"
            fi
            if [[ "$deployment_state" == "success" && "$deployment_sha" == "$GITHUB_SHA" ]]; then
              matched=1
              break
            fi
            sleep 10
          done
          if [[ "$matched" != "1" ]]; then
            echo "Pages did not report a successful deployment for $GITHUB_SHA" >&2
            echo "latest deployment id=$deployment_id sha=$deployment_sha state=$deployment_state" >&2
            exit 1
          fi
          printf 'deployment_id=%s\n' "$deployment_id" >> "$GITHUB_OUTPUT"
          printf 'deployment_sha=%s\n' "$deployment_sha" >> "$GITHUB_OUTPUT"
          printf 'deployment_state=%s\n' "$deployment_state" >> "$GITHUB_OUTPUT"

          runs="$(gh api "repos/$repo/actions/runs?per_page=100")"
          pages_run="$(jq -c '[.workflow_runs[] | select(((.path // "") | contains("pages-build-deployment")) or ((.name // "") | ascii_downcase | contains("pages")))] | first // {}' <<<"$runs")"
          pages_run_id="$(jq -r '.id // empty' <<<"$pages_run")"
          pages_run_name="$(jq -r '.name // empty' <<<"$pages_run")"
          pages_run_path="$(jq -r '.path // empty' <<<"$pages_run")"
          pages_run_sha="$(jq -r '.head_sha // empty' <<<"$pages_run")"
          pages_run_conclusion="$(jq -r '.conclusion // empty' <<<"$pages_run")"
          artifact_count="0"
          artifact_names=""
          if [[ -n "$pages_run_id" ]]; then
            artifacts="$(gh api "repos/$repo/actions/runs/$pages_run_id/artifacts?per_page=100")"
            artifact_count="$(jq -r '.total_count // 0' <<<"$artifacts")"
            artifact_names="$(jq -r '[.artifacts[].name] | join(", ")' <<<"$artifacts")"
          fi
          {
            printf 'pages_run_id=%s\n' "$pages_run_id"
            printf 'pages_run_name=%s\n' "$pages_run_name"
            printf 'pages_run_path=%s\n' "$pages_run_path"
            printf 'pages_run_sha=%s\n' "$pages_run_sha"
            printf 'pages_run_conclusion=%s\n' "$pages_run_conclusion"
            printf 'artifact_count=%s\n' "$artifact_count"
            printf 'artifact_names=%s\n' "$artifact_names"
          } >> "$GITHUB_OUTPUT"

      - name: Verify live HTML, runtime, hero asset and browser behavior
        id: browser
        env:
          SITE_URL: ${{ steps.pages.outputs.site_url }}
        shell: bash
        run: |
          set -euo pipefail
          site="${SITE_URL%/}/"
          live_ok=0
          for _ in $(seq 1 30); do
            if curl -fsSL -H 'Cache-Control: no-cache' "${site}?verify=${GITHUB_SHA}-$(date +%s%N)" -o /tmp/live.html; then
              if grep -q 'EDUCATIONAL ARCHIVE' /tmp/live.html \
                && grep -q 'Cannabis <span>Strain Wisdom</span>' /tmp/live.html \
                && grep -q 'data-home-target="explore"' /tmp/live.html \
                && grep -q 'data-home-target="media"' /tmp/live.html \
                && grep -q 'preview/home-entrance-v1.css?v=2' /tmp/live.html \
                && grep -q 'preview/home-hero-v1.js?v=2' /tmp/live.html \
                && ! grep -q 'MASTER PREVIEW' /tmp/live.html; then
                live_ok=1
                break
              fi
            fi
            sleep 10
          done
          [[ "$live_ok" == "1" ]]

          curl -fsSL -H 'Cache-Control: no-cache' "https://raw.githubusercontent.com/Blazea-x/strain-atlas/master-migration/runtime/catalog.json?verify=${GITHUB_SHA}" -o /tmp/catalog.json
          jq -e '.counts.cultivars > 0 and (.cultivars | any(.id == "bubble-gum" and (.visuals | any(.role == "primary"))))' /tmp/catalog.json >/dev/null
          cultivar_count="$(jq -r '.counts.cultivars' /tmp/catalog.json)"
          bubble_src="$(jq -r '.cultivars[] | select(.id == "bubble-gum") | .visuals[] | select(.role == "primary") | .src' /tmp/catalog.json | head -n1)"
          [[ -n "$bubble_src" ]]
          curl -fsSL -H 'Cache-Control: no-cache' "https://raw.githubusercontent.com/Blazea-x/strain-atlas/master-migration/${bubble_src}?verify=${GITHUB_SHA}" -o /tmp/bubble-primary.webp
          file /tmp/bubble-primary.webp | grep -qi 'Web/P image\|WebP'

          curl -fsSL -H 'Cache-Control: no-cache' "${site}preview/app.js?v=5&verify=${GITHUB_SHA}" -o /tmp/live-app.js
          grep -q 'master-migration/runtime/catalog.json' /tmp/live-app.js
          grep -q 'search.addEventListener("input"' /tmp/live-app.js
          grep -q 'grid.addEventListener("click"' /tmp/live-app.js
          grep -q 'data-home-target' /tmp/live.html

          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          [[ -n "$browser" ]]
          "$browser" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/home-v1-chrome about:blank >/tmp/chrome.log 2>&1 &
          chrome_pid=$!
          trap 'kill "$chrome_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9222/json/list >/tmp/targets.json 2>/dev/null && jq -e 'length > 0' /tmp/targets.json >/dev/null; then break; fi
            sleep 1
          done
          export SITE_UNDER_TEST="${site}?verify=${GITHUB_SHA}-browser"
          cat >/tmp/cdp-test.mjs <<'NODE'
          import fs from 'node:fs';
          const targets = await (await fetch('http://127.0.0.1:9222/json/list')).json();
          const wsUrl = targets[0]?.webSocketDebuggerUrl;
          if (!wsUrl || typeof WebSocket === 'undefined') throw new Error('CDP WebSocket unavailable');
          const ws = new WebSocket(wsUrl);
          const pending = new Map();
          let seq = 0;
          ws.onmessage = event => {
            const msg = JSON.parse(event.data);
            if (msg.id && pending.has(msg.id)) {
              const {resolve,reject} = pending.get(msg.id);
              pending.delete(msg.id);
              if (msg.error) reject(new Error(msg.error.message)); else resolve(msg.result);
            }
          };
          await new Promise((resolve,reject) => { ws.onopen=resolve; ws.onerror=reject; });
          const send = (method, params={}) => new Promise((resolve,reject) => {
            const id=++seq; pending.set(id,{resolve,reject}); ws.send(JSON.stringify({id,method,params}));
          });
          const delay = ms => new Promise(r => setTimeout(r, ms));
          const evaluate = async expression => {
            const r = await send('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true});
            return r.result?.value;
          };
          await send('Page.enable');
          await send('Runtime.enable');
          await send('Emulation.setDeviceMetricsOverride',{width:390,height:844,deviceScaleFactor:2,mobile:true});
          await send('Page.navigate',{url:process.env.SITE_UNDER_TEST});
          await delay(12000);
          const initial = await evaluate(`(() => ({
            masterPreviewVisible: document.body.innerText.includes('MASTER PREVIEW'),
            title: document.querySelector('#site-title')?.innerText || '',
            educationalArchive: document.body.innerText.includes('EDUCATIONAL ARCHIVE'),
            heroReady: document.querySelector('#home-hero-image')?.classList.contains('is-ready') || false,
            heroSrc: document.querySelector('#home-hero-image')?.currentSrc || document.querySelector('#home-hero-image')?.src || '',
            heroCaption: document.querySelector('#home-hero-caption')?.innerText || '',
            searchHeight: document.querySelector('#search')?.getBoundingClientRect().height || 0,
            explorePresent: !!document.querySelector('[data-home-target="explore"]'),
            mediaPresent: !!document.querySelector('[data-home-target="media"]'),
            legalPresent: !!document.querySelector('.legal-alert'),
            legalSourceCount: document.querySelectorAll('.legal-alert-sources a').length,
            cultivarCards: document.querySelectorAll('.cultivar-card').length,
            dataState: document.querySelector('#data-state')?.textContent || ''
          }))()`);
          await evaluate(`(() => { const s=document.querySelector('#search'); s.value='Bubble Gum'; s.dispatchEvent(new Event('input',{bubbles:true})); return true; })()`);
          await delay(800);
          const searchResult = await evaluate(`(() => ({
            panelVisible: document.querySelector('[data-content-panel="cultivars"]')?.hidden === false,
            resultText: document.querySelector('#result-label')?.innerText || '',
            visibleCards: document.querySelectorAll('.cultivar-card').length,
            firstCard: document.querySelector('.cultivar-card .tile-name')?.innerText || ''
          }))()`);
          await evaluate(`document.querySelector('.cultivar-card')?.click()`);
          await delay(800);
          const detail = await evaluate(`(() => ({
            open: document.querySelector('#detail-dialog')?.open || false,
            topbar: document.querySelector('.detail-topbar')?.innerText || '',
            detailText: document.querySelector('#detail-shell')?.innerText || ''
          }))()`);
          await evaluate(`document.querySelector('.close-detail')?.click()`);
          await delay(300);
          await evaluate(`document.querySelector('[data-home-target="explore"]')?.click()`);
          await delay(500);
          const explore = await evaluate(`document.querySelector('[data-content-panel="explore"]')?.hidden === false`);
          await evaluate(`document.querySelector('[data-home-target="media"]')?.click()`);
          await delay(500);
          const media = await evaluate(`document.querySelector('[data-content-panel="media"]')?.hidden === false`);
          await evaluate(`document.querySelector('.legal-alert').open = true`);
          const legalOpen = await evaluate(`document.querySelector('.legal-alert')?.open === true`);
          await evaluate(`document.querySelector('[data-home-target="explore"]')?.click()`);
          await delay(300);
          const shot = await send('Page.captureScreenshot',{format:'png',captureBeyondViewport:false,fromSurface:true});
          fs.writeFileSync('/tmp/home-entrance-v1.png', Buffer.from(shot.data,'base64'));
          const result = {initial,searchResult,detail,explore,media,legalOpen};
          fs.writeFileSync('/tmp/browser-result.json', JSON.stringify(result,null,2));
          ws.close();
NODE
          node /tmp/cdp-test.mjs
          cat /tmp/browser-result.json
          jq -e '
            (.initial.masterPreviewVisible == false) and
            (.initial.title | contains("Cannabis")) and
            (.initial.educationalArchive == true) and
            (.initial.heroReady == true) and
            (.initial.heroCaption | contains("ARCHIVE VISUAL")) and
            (.initial.heroCaption | contains("Bubble Gum")) and
            (.initial.searchHeight >= 50) and
            (.initial.explorePresent == true) and
            (.initial.mediaPresent == true) and
            (.initial.legalPresent == true) and
            (.initial.legalSourceCount >= 3) and
            (.initial.cultivarCards > 0) and
            (.initial.dataState == "MASTER DATA") and
            (.searchResult.panelVisible == true) and
            (.searchResult.firstCard == "Bubble Gum") and
            (.detail.open == true) and
            (.detail.topbar | contains("Bubble Gum")) and
            (.explore == true) and
            (.media == true) and
            (.legalOpen == true)
          ' /tmp/browser-result.json >/dev/null
          printf 'cultivar_count=%s\n' "$cultivar_count" >> "$GITHUB_OUTPUT"
          printf 'bubble_src=%s\n' "$bubble_src" >> "$GITHUB_OUTPUT"

      - name: Build verification report
        env:
          SITE_URL: ${{ steps.pages.outputs.site_url }}
          BUILD_TYPE: ${{ steps.pages.outputs.build_type }}
          SOURCE_BRANCH: ${{ steps.pages.outputs.source_branch }}
          SOURCE_PATH: ${{ steps.pages.outputs.source_path }}
          DEPLOYMENT_ID: ${{ steps.pages.outputs.deployment_id }}
          DEPLOYMENT_SHA: ${{ steps.pages.outputs.deployment_sha }}
          DEPLOYMENT_STATE: ${{ steps.pages.outputs.deployment_state }}
          PAGES_RUN_ID: ${{ steps.pages.outputs.pages_run_id }}
          PAGES_RUN_NAME: ${{ steps.pages.outputs.pages_run_name }}
          PAGES_RUN_PATH: ${{ steps.pages.outputs.pages_run_path }}
          PAGES_RUN_SHA: ${{ steps.pages.outputs.pages_run_sha }}
          PAGES_RUN_CONCLUSION: ${{ steps.pages.outputs.pages_run_conclusion }}
          ARTIFACT_COUNT: ${{ steps.pages.outputs.artifact_count }}
          ARTIFACT_NAMES: ${{ steps.pages.outputs.artifact_names }}
          CULTIVAR_COUNT: ${{ steps.browser.outputs.cultivar_count }}
          BUBBLE_SRC: ${{ steps.browser.outputs.bubble_src }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg siteUrl "$SITE_URL" \
            --arg verifierRunId "$GITHUB_RUN_ID" \
            --arg verifierSha "$GITHUB_SHA" \
            --arg buildType "$BUILD_TYPE" \
            --arg sourceBranch "$SOURCE_BRANCH" \
            --arg sourcePath "$SOURCE_PATH" \
            --arg deploymentId "$DEPLOYMENT_ID" \
            --arg deploymentSha "$DEPLOYMENT_SHA" \
            --arg deploymentState "$DEPLOYMENT_STATE" \
            --arg pagesRunId "$PAGES_RUN_ID" \
            --arg pagesRunName "$PAGES_RUN_NAME" \
            --arg pagesRunPath "$PAGES_RUN_PATH" \
            --arg pagesRunSha "$PAGES_RUN_SHA" \
            --arg pagesRunConclusion "$PAGES_RUN_CONCLUSION" \
            --arg artifactCount "$ARTIFACT_COUNT" \
            --arg artifactNames "$ARTIFACT_NAMES" \
            --arg cultivarCount "$CULTIVAR_COUNT" \
            --arg bubbleSrc "$BUBBLE_SRC" \
            --slurpfile browser /tmp/browser-result.json \
            '{status:"PUBLIC SITE VISUAL CONFIRMED",verifiedAt:$verifiedAt,siteUrl:$siteUrl,verifier:{runId:$verifierRunId,sha:$verifierSha},pages:{buildType:$buildType,source:{branch:$sourceBranch,path:$sourcePath},deployment:{id:$deploymentId,sha:$deploymentSha,state:$deploymentState},workflow:{runId:$pagesRunId,name:$pagesRunName,path:$pagesRunPath,headSha:$pagesRunSha,conclusion:$pagesRunConclusion},artifacts:{count:($artifactCount|tonumber),names:$artifactNames}},runtime:{cultivarCount:($cultivarCount|tonumber),bubbleGumPrimary:$bubbleSrc},browser:$browser[0]}' > public-verification.json
          cat public-verification.json

      - name: Upload visual verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: home-entrance-v1-public-verification
          path: |
            public-verification.json
            /tmp/home-entrance-v1.png
            /tmp/browser-result.json
            /tmp/pages.json
          if-no-files-found: error
          retention-days: 7

      - name: Post verification to issue 13
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(printf 'PUBLIC SITE VISUAL CONFIRMED\n\nVerifier run: %s\nVerifier SHA: %s\n\n```json\n%s\n```' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(cat public-verification.json)")"
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/13/comments" -f body="$body" >/dev/null
