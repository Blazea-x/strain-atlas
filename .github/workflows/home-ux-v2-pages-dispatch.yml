name: HOME UX V2 Pages Dispatch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/home-ux-v2-pages-dispatch.yml"

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Dispatch the existing public Pages workflow
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-public-ui-pages.yml --ref main
          run_id=""
          for attempt in $(seq 1 20); do
            run_id="$(gh run list --workflow deploy-public-ui-pages.yml --branch main --event workflow_dispatch --limit 10 --json databaseId,headSha,createdAt --jq '.[] | select(.headSha == env.GITHUB_SHA) | .databaseId' | head -n1)"
            if [ -n "$run_id" ]; then break; fi
            sleep 2
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          set +e
          gh run watch "$run_id" --exit-status
          watch_status=$?
          set -e
          gh run view "$run_id" --json databaseId,headSha,status,conclusion,url > /tmp/deploy.json
          WATCH_STATUS="$watch_status" python - <<'PY'
          import json, os
          p='/tmp/deploy.json'
          d=json.load(open(p))
          d['dispatcherSha']=os.environ['GITHUB_SHA']
          d['watchExitStatus']=int(os.environ['WATCH_STATUS'])
          json.dump(d,open(p,'w'),indent=2)
          PY
          echo "WATCH_STATUS=$watch_status" >> "$GITHUB_ENV"

      - name: Persist deployment result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/home-ux-v2-e2e
          if [ -f /tmp/deploy.json ]; then
            cp /tmp/deploy.json .github/home-ux-v2-e2e/deploy.json
          else
            printf '{"status":"unknown","conclusion":"failure","dispatcherSha":"%s"}\n' "$GITHUB_SHA" > .github/home-ux-v2-e2e/deploy.json
          fi
          git config user.name 'home-ux-v2-e2e-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/home-ux-v2-e2e/deploy.json
          git commit -m 'Record HOME UX V2 Pages deployment [skip ci]'
          git push origin HEAD:main

      - name: Fail if Pages deployment failed
        if: env.WATCH_STATUS != '0'
        run: exit 1
