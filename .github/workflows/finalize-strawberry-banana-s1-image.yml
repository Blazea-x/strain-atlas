name: Finalize Strawberry Banana S1 primary image

on:
  push:
    branches: [master-migration]
    paths:
      - '.github/workflows/finalize-strawberry-banana-s1-image.yml'

permissions:
  contents: write

jobs:
  rebuild-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: master-migration

      - name: Reconstruct and verify Strawberry Banana S1 image
        run: |
          mkdir -p strains/strawberry-banana-s1/images/generated
          cat .image-transfer/strawberry-banana-s1/part-*.b64 | base64 -d > strains/strawberry-banana-s1/images/generated/primary.webp
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('strains/strawberry-banana-s1/images/generated/primary.webp')
          data=p.read_bytes()
          assert len(data)==15492, len(data)
          assert hashlib.sha256(data).hexdigest()=='986886639f6d118c789b70c935998517ba59cacafbf1dba2dfbba12a7ae82899'
          assert data[:4]==b'RIFF' and data[8:12]==b'WEBP'
          print('Strawberry Banana S1 image verified:', len(data), hashlib.sha256(data).hexdigest())
          PY
          file strains/strawberry-banana-s1/images/generated/primary.webp

      - name: Commit verified image
        run: |
          git config user.name 'strain-atlas-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add strains/strawberry-banana-s1/images/generated/primary.webp
          git commit -m 'Add Strawberry Banana S1 primary image'
          git push origin HEAD:master-migration
