name: TEMP IMAGE PRODUCTION V2 Promotion

on:
  pull_request_target:
    branches: [master-migration]
    types: [edited]

permissions:
  actions: read
  contents: write
  pull-requests: read

jobs:
  promote-dr-grinspoon:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'image-production-v2-review-dr-malawi-20260819' &&
      contains(github.event.pull_request.body, 'PROMOTE_DR_GRINSPOON_PASS_MALAWI_TIMEOUT')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: image-production-v2-dr-grinspoon-promotion
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_ID: '9350233070'
      GENERATION_RUN_ID: '32209110570'
      ARTIFACT_DIR: /tmp/v2-generation-artifact
      EXPECTED_CANDIDATE_SHA256: '5ac510338fa552225c77ddcd2b3a92a4d1b2e3ada3c4c7411fec5fc365388bb0'
      PROMOTION_REPORT: /tmp/dr-grinspoon-promotion-report.json

    steps:
      - name: Checkout formal master-migration
        uses: actions/checkout@v4
        with:
          ref: master-migration
          path: master
          persist-credentials: true

      - name: Checkout current main UI shell read-only
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-shell
          persist-credentials: false

      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'Pillow>=10,<12'

      - name: Download already-generated one-shot artifact
        shell: bash
        run: |
          rm -rf "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"
          gh run download "$GENERATION_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "image-production-v2-dr-grinspoon-malawi-$GENERATION_RUN_ID" --dir "$ARTIFACT_DIR"
          test -f "$ARTIFACT_DIR/dr-grinspoon__one-shot.jpg"
          test -f "$ARTIFACT_DIR/preflight-generation-summary.json"
          echo 'EXISTING ARTIFACT DOWNLOADED. OPENAI REQUESTS: 0'

      - name: Promote reviewed Dr Grinspoon artifact only
        working-directory: master
        run: python scripts/image-production-v2-promote-dr-grinspoon.py

      - name: Runtime build
        working-directory: master
        run: node scripts/build-runtime-data.mjs

      - name: Bind processing commit locally
        working-directory: master
        shell: bash
        run: |
          git config user.name strain-atlas-bot
          git config user.email actions@users.noreply.github.com
          git add strains/dr-grinspoon/strain.json strains/dr-grinspoon/images/generated/primary.webp production/manifests/dr-grinspoon.json runtime/catalog.json data.js sources.js
          git commit -m 'Promote Dr Grinspoon V2 primary visual'
          PROCESSING_COMMIT="$(git rev-parse HEAD)"
          python - "$PROCESSING_COMMIT" <<'PY'
          import json,sys
          from datetime import datetime, timezone
          p='production/manifests/dr-grinspoon.json'
          m=json.load(open(p,encoding='utf-8'))
          sha=sys.argv[1]
          m['imageProcessingCommit']=sha
          now=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          m['audit'].append({'at':now,'action':'PRODUCTION_COMMIT_BOUND','status':'recorded','note':f'Formal WebP, visuals linkage and runtime were prepared in local processing commit {sha}; this provenance was bound before the two-commit fast-forward push.'})
          with open(p,'w',encoding='utf-8') as f: json.dump(m,f,ensure_ascii=False,indent=2); f.write('\n')
          PY
          git add production/manifests/dr-grinspoon.json
          git commit -m 'Record Dr Grinspoon V2 processing provenance'

      - name: MASTER validation
        working-directory: master
        run: node scripts/validate-master-data.mjs

      - name: CONTENT PRODUCTION audit and capture expected Malawi failure
        shell: bash
        run: |
          set +e
          (cd master && node scripts/audit-content-production.mjs --json --main-dir="${GITHUB_WORKSPACE}/main-shell") > /tmp/content-production-audit.json 2>&1
          STATUS=$?
          set -e
          echo "$STATUS" > /tmp/content-production-audit.exit
          echo "CONTENT_PRODUCTION_AUDIT_EXIT=$STATUS"

      - name: Site display checks
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path('master'); main=Path('main-shell')
          cat=json.loads((root/'runtime/catalog.json').read_text(encoding='utf-8'))
          by={x['id']:x for x in cat['cultivars']}
          app=(main/'preview/app.js').read_text(encoding='utf-8')
          report={}
          for sid in ['dr-grinspoon','malawi']:
              c=by[sid]
              prim=[v for v in c.get('visuals',[]) if v.get('role')=='primary']
              path=prim[0]['src'] if len(prim)==1 else None
              fp=root/path if path else None
              signature=False; decode=False
              if fp and fp.is_file():
                  b=fp.read_bytes(); signature=len(b)>=12 and b[:4]==b'RIFF' and b[8:12]==b'WEBP'
                  if signature:
                      try:
                          with Image.open(fp) as im: im.verify()
                          decode=True
                      except Exception: decode=False
              route_ok='asset(visual.src)' in app and 'class="tile-visual"' in app and 'class="detail-hero"' in app
              ok=len(prim)==1 and signature and decode and route_ok
              report[sid]={'primaryPath':path,'signature':signature,'decode':decode,'cardImage':'PASS' if ok else 'FAIL','detailImage':'PASS' if ok else 'FAIL'}
          if report['dr-grinspoon']['cardImage']!='PASS' or report['dr-grinspoon']['detailImage']!='PASS':
              raise SystemExit('Dr Grinspoon display check failed')
          Path('/tmp/site-display-check.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report))
          PY

      - name: Prove final local tree clean
        working-directory: master
        run: test -z "$(git status --porcelain)"

      - name: Push two local promotion commits atomically by fast-forward
        working-directory: master
        run: git push origin HEAD:master-migration

      - name: Upload promotion validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-production-v2-dr-grinspoon-promotion-${{ github.run_id }}
          path: |
            /tmp/dr-grinspoon-promotion-report.json
            /tmp/content-production-audit.json
            /tmp/content-production-audit.exit
            /tmp/site-display-check.json
          if-no-files-found: warn
          retention-days: 14
