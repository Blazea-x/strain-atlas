name: FILTER UX V1 Mobile E2E Final Once
"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/filter-ux-v1-mobile-e2e-final-once.yml"
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PUBLIC_URL: https://blazea-x.github.io/strain-atlas/
      CATALOG_URL: https://raw.githubusercontent.com/Blazea-x/strain-atlas/master-migration/runtime/catalog.json
      MASTER_SHA: 910ae4c794193f75bb588fec0ca80941546bf8f7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard data branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/filter-mobile-final
          git fetch origin master-migration
          test "$(git rev-parse origin/master-migration)" = "$MASTER_SHA"
          git rev-parse origin/master-migration > /tmp/filter-mobile-final/master-start.txt
      - name: Install Selenium
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q selenium
          command -v google-chrome
          command -v chromedriver
      - name: Run exact requested mobile E2E
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/filter-mobile-final/e2e.py <<'PY'
          import json, os, time, traceback, urllib.request
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait, Select
          OUT=Path('/tmp/filter-mobile-final'); BASE=os.environ['PUBLIC_URL']
          req=urllib.request.Request(os.environ['CATALOG_URL'],headers={'User-Agent':'filter-mobile-final'})
          with urllib.request.urlopen(req,timeout=30) as r: catalog=json.load(r)
          cultivars=catalog['cultivars']; entities=catalog.get('entities',{}); all_ids={c['id'] for c in cultivars}
          labels={'sativa':'サティバ系','indica':'インディカ系','hybrid':'ハイブリッド','unclassified':'未分類'}
          def s(v): return '' if v is None else str(v)
          def blob(c):
              vals=[c.get('name'),c.get('jp')]+(c.get('aliases') or [])
              t=(c.get('classification') or {}).get('type'); vals += [t,labels.get(t,t),(c.get('breeding') or {}).get('generation')]
              l=c.get('lineage') or {}; vals += [l.get('display')]+(l.get('parents') or [])+[l.get('note')]
              vals += ((c.get('aromas') or {}).get('items') or [])+((c.get('terpenes') or {}).get('items') or [])
              vals += [(c.get('origin') or {}).get('text'),(c.get('history') or {}).get('text')]
              vals += [(entities.get(r.get('entityId')) or {}).get('name','') for r in (c.get('relations') or [])]
              return ' '.join(s(v) for v in vals).lower()
          def expected(t='all',gens=None,breeder='',q=''):
              gens=set(gens or []); q=q.strip().lower(); tids=all_ids if t=='all' else set((catalog.get('explore') or {}).get(t) or [])
              out=[]
              for c in cultivars:
                  if c['id'] not in tids: continue
                  g=s((c.get('breeding') or {}).get('generation')).strip()
                  if gens and g not in gens: continue
                  if breeder and not any(r.get('entityId')==breeder and 'breeder' in (r.get('roles') or []) for r in (c.get('relations') or [])): continue
                  if q and q not in blob(c): continue
                  out.append(c['id'])
              return sorted(out)
          gens=sorted({s((c.get('breeding') or {}).get('generation')).strip() for c in cultivars if s((c.get('breeding') or {}).get('generation')).strip() and s((c.get('breeding') or {}).get('generation')).strip().lower()!='unknown'})
          breeders=sorted({r.get('entityId') for c in cultivars for r in (c.get('relations') or []) if 'breeder' in (r.get('roles') or []) and s((entities.get(r.get('entityId')) or {}).get('name')).strip()})
          target=None
          for c in cultivars:
              t=(c.get('classification') or {}).get('type'); g=s((c.get('breeding') or {}).get('generation')).strip(); b=next((r.get('entityId') for r in (c.get('relations') or []) if 'breeder' in (r.get('roles') or []) and s((entities.get(r.get('entityId')) or {}).get('name')).strip()),None)
              if t in ('sativa','indica','hybrid') and g in gens and b: target=(c,t,g,b); break
          assert target and len(gens)>=2
          o=Options(); o.add_argument('--headless=new'); o.add_argument('--no-sandbox'); o.add_argument('--disable-dev-shm-usage'); o.add_argument('--window-size=430,1800')
          d=webdriver.Chrome(service=Service('/usr/bin/chromedriver'),options=o); wait=WebDriverWait(d,35); report={'status':'FAIL','viewports':{}}
          def js(x,*a): return d.execute_script(x,*a)
          def wait_ready():
              wait.until(lambda x: x.find_element(By.ID,'catalog-total').text.strip()!='収録数を読み込み中')
              wait.until(lambda x: len(x.find_elements(By.CSS_SELECTOR,'#latest-grid [data-strain-id]'))==6)
          def ids(): return sorted(e.get_attribute('data-strain-id') for e in d.find_elements(By.CSS_SELECTOR,'#cultivar-grid [data-strain-id]'))
          def click_type(k): js('arguments[0].click()',d.find_element(By.CSS_SELECTOR,f'[data-explore="{k}"]')); time.sleep(.08)
          def query(q):
              e=d.find_element(By.ID,'search'); js("arguments[0].value=arguments[1];arguments[0].dispatchEvent(new Event('input',{bubbles:true}));",e,q); time.sleep(.08)
          def gen(g):
              js('arguments[0].open=true',d.find_element(By.ID,'filter-disclosure')); js('arguments[0].click()',d.find_element(By.CSS_SELECTOR,f'[data-generation="{g}"]')); time.sleep(.08)
          def breeder(b): Select(d.find_element(By.ID,'breeder-filter')).select_by_value(b); time.sleep(.08)
          try:
              for width in (390,430):
                  d.set_window_size(width,1800); d.get(BASE+f'?mobile-final={width}-{os.environ.get("GITHUB_RUN_ID","0")}'); wait_ready()
                  st=js("""const e=document.getElementById('explore'),s=document.getElementById('search');return {overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,above:e.getBoundingClientRect().top<s.getBoundingClientRect().top,count:document.querySelectorAll('#explore').length,keys:[...document.querySelectorAll('#explore [data-explore]')].map(x=>x.dataset.explore),texts:[...document.querySelectorAll('#explore [data-explore]')].map(x=>(x.childNodes[0]?.textContent||'').trim()),un:document.querySelectorAll('[data-explore="unclassified"]').length,bottom:document.querySelectorAll('.all-cultivars-section .explore').length,groups:[...document.querySelectorAll('#filter-disclosure .filter-group')].map(x=>x.id).sort(),anchor:!!document.getElementById('cultivars')};""")
                  assert st['overflow']<=1 and st['above'] and st['count']==1 and st['un']==0 and st['bottom']==0 and st['anchor']
                  assert st['keys']==['all','sativa','indica','hybrid'] and st['texts']==['すべて','SATIVA系','INDICA系','HYBRID']
                  assert st['groups']==['breeder-filter-group','generation-filter-group']
                  assert len(d.find_elements(By.CSS_SELECTOR,'#latest-grid [data-strain-id]'))==6
                  actual=sorted(o.get_attribute('value') for o in d.find_elements(By.CSS_SELECTOR,'#breeder-filter option') if o.get_attribute('value')); assert actual==breeders
                  c,t,g,b=target; click_type(t); query(c['name']); assert d.find_element(By.CSS_SELECTOR,f'[data-explore="{t}"]').get_attribute('aria-pressed')=='true'; gen(g); breeder(b); assert ids()==expected(t,[g],b,c['name'])
                  js('arguments[0].click()',d.find_element(By.ID,'clear-filters')); time.sleep(.08); assert d.find_element(By.ID,'search').get_attribute('value')==c['name']; assert d.find_element(By.CSS_SELECTOR,'[data-explore="all"]').get_attribute('aria-pressed')=='true'; assert not d.find_elements(By.CSS_SELECTOR,'[data-generation].is-active'); assert Select(d.find_element(By.ID,'breeder-filter')).first_selected_option.get_attribute('value')==''
                  query(''); gen(gens[0]); gen(gens[1]); assert ids()==expected(gens=gens[:2])
                  report['viewports'][str(width)]={'status':'PASS','horizontal_overflow':st['overflow'],'type_above_search':True,'type_labels':['すべて','SATIVA系','INDICA系','HYBRID'],'no_unclassified':True,'no_duplicate_filter':True,'search_preserves_type':True,'all_axes_and':True,'generation_or':True,'breeder_role_only':True,'clear_preserves_search':True,'latest_six':True,'cultivars_anchor':True,'unsupported_axes_hidden':True}
              report['status']='PASS'; OUT.joinpath('report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n'); OUT.joinpath('PASS').write_text('PASS\n')
          except Exception:
              OUT.joinpath('failure.txt').write_text(traceback.format_exc()); raise
          finally: d.quit()
          PY
          python /tmp/filter-mobile-final/e2e.py
      - name: Confirm master unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master-migration
          git rev-parse origin/master-migration > /tmp/filter-mobile-final/master-end.txt
          test "$(cat /tmp/filter-mobile-final/master-start.txt)" = "$(cat /tmp/filter-mobile-final/master-end.txt)"
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filter-ux-v1-mobile-final-${{ github.run_id }}
          path: /tmp/filter-mobile-final
          if-no-files-found: error
      - name: Cleanup verifier
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status=FAIL; test -f /tmp/filter-mobile-final/PASS && status=PASS
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          if [ -f .github/workflows/filter-ux-v1-mobile-e2e-final-once.yml ]; then
            git rm .github/workflows/filter-ux-v1-mobile-e2e-final-once.yml
            git config user.name filter-ux-v1-mobile-final-bot
            git config user.email actions@users.noreply.github.com
            git commit -m "Remove FILTER UX V1 mobile final verifier run ${GITHUB_RUN_ID} ${status} [skip ci]"
            git push origin HEAD:main
          fi
