name: FILTER UX V1 Requested Public E2E Once
"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/filter-ux-v1-requested-e2e-once.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PUBLIC_URL: https://blazea-x.github.io/strain-atlas/
      CATALOG_URL: https://raw.githubusercontent.com/Blazea-x/strain-atlas/master-migration/runtime/catalog.json
      PUBLICATION_URL: https://raw.githubusercontent.com/Blazea-x/strain-atlas/master-migration/production/publication.json
      MASTER_SHA: 910ae4c794193f75bb588fec0ca80941546bf8f7
      UI_SHA: 3dab30ba2403a4c030c31ae88af77a0165563ba4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard scope and data branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/filter-requested-e2e
          git fetch origin main master-migration
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/master-migration)" = "$MASTER_SHA"
          git merge-base --is-ancestor "$UI_SHA" HEAD
          unexpected="$(git diff --name-only "$UI_SHA"..HEAD | grep -Ev '^\.github/' || true)"
          test -z "$unexpected"
          git rev-parse origin/master-migration > /tmp/filter-requested-e2e/master-start.txt

      - name: Confirm FILTER UX V1 is live
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            html="$(curl -fsSL --retry 2 --max-time 15 "$PUBLIC_URL?requested-e2e=$GITHUB_RUN_ID" || true)"
            if printf '%s' "$html" | grep -q 'preview/app.js?v=6' \
              && printf '%s' "$html" | grep -q 'id="filter-disclosure"' \
              && printf '%s' "$html" | grep -q 'data-explore="sativa"' \
              && ! printf '%s' "$html" | grep -q 'data-explore="unclassified"'; then
              printf '%s' "$html" > /tmp/filter-requested-e2e/public-index.html
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Install Selenium
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q selenium
          command -v google-chrome
          command -v chromedriver

      - name: Run requested 390px and 430px E2E
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/filter-requested-e2e/e2e.py <<'PY'
          import json, os, re, time, traceback, urllib.request
          from datetime import datetime
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait, Select

          OUT=Path('/tmp/filter-requested-e2e')
          BASE=os.environ['PUBLIC_URL']
          def load(url):
              req=urllib.request.Request(url,headers={'User-Agent':'filter-ux-v1-requested-e2e'})
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          catalog=load(os.environ['CATALOG_URL']); publication=load(os.environ['PUBLICATION_URL'])
          cultivars=catalog['cultivars']; entities=catalog.get('entities',{}); all_ids={c['id'] for c in cultivars}

          type_labels={'sativa':'サティバ系','indica':'インディカ系','hybrid':'ハイブリッド','unclassified':'未分類'}
          def txt(v): return '' if v is None else str(v)
          def blob(c):
              vals=[c.get('name'),c.get('jp')]+(c.get('aliases') or [])
              typ=(c.get('classification') or {}).get('type'); vals += [typ,type_labels.get(typ,typ),(c.get('breeding') or {}).get('generation')]
              lin=c.get('lineage') or {}; vals += [lin.get('display')]+(lin.get('parents') or [])+[lin.get('note')]
              vals += ((c.get('aromas') or {}).get('items') or []) + ((c.get('terpenes') or {}).get('items') or [])
              vals += [(c.get('origin') or {}).get('text'),(c.get('history') or {}).get('text')]
              vals += [(entities.get(r.get('entityId')) or {}).get('name','') for r in (c.get('relations') or [])]
              return ' '.join(txt(v) for v in vals).lower()
          def expected(type_key='all',gens=None,breeder='',query=''):
              gens=set(gens or []); q=query.strip().lower(); type_ids=all_ids if type_key=='all' else set((catalog.get('explore') or {}).get(type_key) or [])
              out=[]
              for c in cultivars:
                  if c['id'] not in type_ids: continue
                  g=txt((c.get('breeding') or {}).get('generation')).strip()
                  if gens and g not in gens: continue
                  if breeder and not any(r.get('entityId')==breeder and 'breeder' in (r.get('roles') or []) for r in (c.get('relations') or [])): continue
                  if q and q not in blob(c): continue
                  out.append(c['id'])
              return sorted(out)
          def ts(v):
              try: return datetime.fromisoformat(v.replace('Z','+00:00')).timestamp() if v else float('-inf')
              except: return float('-inf')
          pub=[(e,i) for i,e in enumerate(publication.get('entries') or []) if e.get('state')=='published' and e.get('strainId') in all_ids]
          pub.sort(key=lambda x:(-ts(x[0].get('publishedAt')),-x[1],txt(x[0].get('strainId'))))
          latest_expected=[e.get('strainId') for e,i in pub[:6]]

          generations=sorted({txt((c.get('breeding') or {}).get('generation')).strip() for c in cultivars if txt((c.get('breeding') or {}).get('generation')).strip() and txt((c.get('breeding') or {}).get('generation')).strip().lower()!='unknown'})
          breeder_ids=sorted({r.get('entityId') for c in cultivars for r in (c.get('relations') or []) if 'breeder' in (r.get('roles') or []) and txt((entities.get(r.get('entityId')) or {}).get('name')).strip()})
          target=None
          for c in cultivars:
              typ=(c.get('classification') or {}).get('type'); g=txt((c.get('breeding') or {}).get('generation')).strip()
              br=next((r.get('entityId') for r in (c.get('relations') or []) if 'breeder' in (r.get('roles') or []) and txt((entities.get(r.get('entityId')) or {}).get('name')).strip()),None)
              if typ in ('sativa','indica','hybrid') and g in generations and br:
                  target=(c,typ,g,br); break
          assert target, 'no cultivar supports all-axis test'

          opt=Options(); opt.add_argument('--headless=new'); opt.add_argument('--no-sandbox'); opt.add_argument('--disable-dev-shm-usage'); opt.add_argument('--window-size=430,1800')
          d=webdriver.Chrome(service=Service('/usr/bin/chromedriver'),options=opt); wait=WebDriverWait(d,35)
          report={'status':'FAIL','latest_expected':latest_expected,'target':target[0]['id'],'viewports':{}}
          def js(s,*a): return d.execute_script(s,*a)
          def wait_loaded():
              wait.until(lambda x: x.find_element(By.ID,'catalog-total').text.strip() != '収録数を読み込み中')
              wait.until(lambda x: len(x.find_elements(By.CSS_SELECTOR,'#latest-grid [data-strain-id]'))==6)
          def ids(): return sorted([e.get_attribute('data-strain-id') for e in d.find_elements(By.CSS_SELECTOR,'#cultivar-grid [data-strain-id]')])
          def click_type(k):
              b=d.find_element(By.CSS_SELECTOR,f'[data-explore="{k}"]'); js('arguments[0].click()',b); time.sleep(.08)
          def query(q):
              e=d.find_element(By.ID,'search'); js("arguments[0].value=arguments[1];arguments[0].dispatchEvent(new Event('input',{bubbles:true}));",e,q); time.sleep(.08)
          def gen(g):
              js('arguments[0].open=true',d.find_element(By.ID,'filter-disclosure'))
              b=d.find_element(By.CSS_SELECTOR,f'[data-generation="{g}"]'); js('arguments[0].click()',b); time.sleep(.08)
          def breeder(eid): Select(d.find_element(By.ID,'breeder-filter')).select_by_value(eid); time.sleep(.08)
          def clear_filters(): js('arguments[0].click()',d.find_element(By.ID,'clear-filters')); time.sleep(.08)
          try:
              for width in (390,430):
                  d.set_window_size(width,1800); d.get(BASE+f'?requested-e2e={width}-{os.environ.get("GITHUB_RUN_ID","0")}'); wait_loaded()
                  structural=js("""
                    const ex=document.getElementById('explore'), se=document.getElementById('search');
                    return {overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
                      typeAbove:ex.getBoundingClientRect().top<se.getBoundingClientRect().top,
                      exploreCount:document.querySelectorAll('#explore').length,
                      keys:[...document.querySelectorAll('#explore [data-explore]')].map(x=>x.dataset.explore),
                      labels:[...document.querySelectorAll('#explore [data-explore]')].map(x=>(x.childNodes[0]?.textContent||'').trim()),
                      unclassified:document.querySelectorAll('[data-explore="unclassified"]').length,
                      duplicateBottom:document.querySelectorAll('.all-cultivars-section .explore').length,
                      groups:[...document.querySelectorAll('#filter-disclosure .filter-group')].map(x=>x.id).sort(),
                      cultivars:!!document.getElementById('cultivars')};
                  """)
                  assert structural['overflow']<=1,(width,'overflow',structural['overflow'])
                  assert structural['typeAbove'] and structural['exploreCount']==1 and structural['unclassified']==0 and structural['duplicateBottom']==0
                  assert structural['keys']==['all','sativa','indica','hybrid']
                  assert structural['labels']==['すべて','SATIVA系','INDICA系','HYBRID']
                  assert structural['groups']==['breeder-filter-group','generation-filter-group']
                  assert structural['cultivars']
                  assert [e.get_attribute('data-strain-id') for e in d.find_elements(By.CSS_SELECTOR,'#latest-grid [data-strain-id]')]==latest_expected

                  actual_breeders=sorted([o.get_attribute('value') for o in d.find_elements(By.CSS_SELECTOR,'#breeder-filter option') if o.get_attribute('value')])
                  assert actual_breeders==breeder_ids,(width,'breeder role options mismatch')

                  c,typ,g,br=target
                  click_type(typ); query(c['name'])
                  assert d.find_element(By.CSS_SELECTOR,f'[data-explore="{typ}"]').get_attribute('aria-pressed')=='true'
                  gen(g); breeder(br)
                  assert ids()==expected(typ,[g],br,c['name']),(width,'AND mismatch',ids(),expected(typ,[g],br,c['name']))

                  clear_filters()
                  assert d.find_element(By.ID,'search').get_attribute('value')==c['name']
                  assert d.find_element(By.CSS_SELECTOR,'[data-explore="all"]').get_attribute('aria-pressed')=='true'
                  assert not d.find_elements(By.CSS_SELECTOR,'[data-generation].is-active')
                  assert Select(d.find_element(By.ID,'breeder-filter')).first_selected_option.get_attribute('value')==''

                  query('')
                  assert len(generations)>=2
                  gen(generations[0]); gen(generations[1])
                  assert ids()==expected(gens=generations[:2]),(width,'generation OR mismatch')

                  footer=d.find_element(By.CSS_SELECTOR,'#catalog-meta a[href="#cultivars"]')
                  assert footer.text.strip()=='品種一覧'
                  js('arguments[0].click()',footer); time.sleep(.1)
                  assert js('return location.hash')=='#cultivars'

                  report['viewports'][str(width)]={
                    'status':'PASS','horizontal_overflow':structural['overflow'],'type_filter_above_search':True,
                    'type_labels':['すべて','SATIVA系','INDICA系','HYBRID'],'no_unclassified_chip':True,'no_duplicate_filter':True,
                    'search_preserves_type':True,'all_axes_and':True,'generation_same_axis_or':True,'breeder_role_only':True,
                    'clear_preserves_search':True,'latest_six':True,'cultivars_anchor':True,'unsupported_axes_hidden':True}
              report['status']='PASS'; OUT.joinpath('e2e-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n'); OUT.joinpath('PASS').write_text('PASS\n')
          except Exception:
              OUT.joinpath('e2e-failure.txt').write_text(traceback.format_exc()); raise
          finally: d.quit()
          PY
          python /tmp/filter-requested-e2e/e2e.py

      - name: Confirm master unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master-migration
          git rev-parse origin/master-migration > /tmp/filter-requested-e2e/master-end.txt
          test "$(cat /tmp/filter-requested-e2e/master-start.txt)" = "$(cat /tmp/filter-requested-e2e/master-end.txt)"

      - name: Upload requested E2E artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filter-ux-v1-requested-e2e-${{ github.run_id }}
          path: /tmp/filter-requested-e2e
          if-no-files-found: error

      - name: Remove one-shot requested verifier
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status=FAIL; test -f /tmp/filter-requested-e2e/PASS && status=PASS
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          if [ -f .github/workflows/filter-ux-v1-requested-e2e-once.yml ]; then
            git rm .github/workflows/filter-ux-v1-requested-e2e-once.yml
            git config user.name filter-ux-v1-requested-e2e-bot
            git config user.email actions@users.noreply.github.com
            git commit -m "Remove FILTER UX V1 requested verifier run ${GITHUB_RUN_ID} ${status} [skip ci]"
            git push origin HEAD:main
          fi
