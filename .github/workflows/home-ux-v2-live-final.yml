name: HOME UX V2 Live Final
on:
  push:
    branches: [main]
    paths: [".github/workflows/home-ux-v2-live-final.yml"]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SITE: https://blazea-x.github.io/strain-atlas/
      MASTER_SHA: 910ae4c794193f75bb588fec0ca80941546bf8f7
    steps:
      - uses: actions/checkout@v4
      - name: Wait for current public bytes
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sha256sum index.html | cut -d' ' -f1)"
          for n in $(seq 1 40); do
            curl -fsSL --retry 2 "${SITE}?live-final=${GITHUB_RUN_ID}-${n}" -o /tmp/index.html || true
            actual="$(sha256sum /tmp/index.html 2>/dev/null | cut -d' ' -f1 || true)"
            if [ "$actual" = "$expected" ]; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Confirm immutable production branch
        shell: bash
        run: |
          actual="$(curl -fsSL -H 'Authorization: Bearer ${{ github.token }}' https://api.github.com/repos/Blazea-x/strain-atlas/branches/master-migration | python -c 'import json,sys;print(json.load(sys.stdin)["commit"]["sha"])')"
          test "$actual" = "$MASTER_SHA"
      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check --quiet selenium
      - name: Public E2E
        env:
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          SITE=os.environ['SITE']; OUT=Path('live-final'); OUT.mkdir(exist_ok=True)
          def j(url):
            req=urllib.request.Request(url,headers={'User-Agent':'home-ux-v2-live-final'})
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          cat=j('https://raw.githubusercontent.com/Blazea-x/strain-atlas/master-migration/runtime/catalog.json')
          pub=j('https://raw.githubusercontent.com/Blazea-x/strain-atlas/master-migration/production/publication.json')
          ids={c['id'] for c in cat['cultivars']}
          from datetime import datetime
          def ts(e): return datetime.fromisoformat(e['publishedAt'].replace('Z','+00:00')).timestamp() if e.get('publishedAt') else -1
          rows=[(e,i) for i,e in enumerate(pub['entries']) if e.get('state')=='published' and e.get('strainId') in ids]
          rows.sort(key=lambda x:(-ts(x[0]),-x[1],x[0]['strainId']))
          latest=[e['strainId'] for e,_ in rows[:6]]
          result={'runId':os.environ['RUN_ID'],'checks':{},'latest':latest,'pass':False}
          o=Options();o.add_argument('--headless=new');o.add_argument('--no-sandbox');o.add_argument('--disable-dev-shm-usage');o.add_argument('--window-size=430,1050')
          d=webdriver.Chrome(service=Service('/usr/bin/chromedriver'),options=o);w=WebDriverWait(d,30)
          try:
            d.get(SITE+f'?live-e2e={time.time_ns()}')
            w.until(lambda x:len(x.find_elements(By.CSS_SELECTOR,'#cultivar-grid [data-strain-id]'))==38)
            w.until(lambda x:len(x.find_elements(By.CSS_SELECTOR,'#latest-grid [data-strain-id]'))==6)
            assert d.find_element(By.CSS_SELECTOR,'link[href="preview/home-entrance-v1.css?v=4"]')
            assert 'Bubble Gum' in d.find_element(By.ID,'home-hero-caption').text
            assert d.find_element(By.ID,'search-title').text=='品種を検索'
            assert not d.find_elements(By.CSS_SELECTOR,'[data-home-target="media"],[data-home-target="explore"]')
            got=[x.get_attribute('data-strain-id') for x in d.find_elements(By.CSS_SELECTOR,'#latest-grid [data-strain-id]')];assert got==latest
            result['checks']['home-latest']={'pass':True,'detail':got}
            box=d.find_element(By.ID,'legal-alert');d.execute_script('arguments[0].open=true',box);assert len(d.find_elements(By.CSS_SELECTOR,'#legal-alert .legal-alert-sources a'))==3
            result['checks']['notice']={'pass':True}
            s=d.find_element(By.ID,'search')
            for q,target in [('Bubble Gum','bubble-gum'),('Wedding Cake','wedding-cake-s1'),('Humboldt CSI','wedding-cake-s1'),('S1','f1-durb-s1'),('Kush','bubba-kush-s1')]:
              d.execute_script("arguments[0].value=arguments[1];arguments[0].dispatchEvent(new Event('input',{bubbles:true}))",s,q);time.sleep(.2)
              found=[x.get_attribute('data-strain-id') for x in d.find_elements(By.CSS_SELECTOR,'#cultivar-grid [data-strain-id]')];assert target in found
            d.execute_script("arguments[0].value='';arguments[0].dispatchEvent(new Event('input',{bubbles:true}))",s);time.sleep(.25);assert len(d.find_elements(By.CSS_SELECTOR,'#cultivar-grid [data-strain-id]'))==38
            result['checks']['search']={'pass':True}
            for sid,name,gen in [('wedding-cake-s1','Wedding Cake','S1'),('bubba-kush-s1','Bubba Kush','S1'),('f1-durb-s1','F1 Durb','S1'),('ak-47','AK-47','F1')]:
              c=d.find_element(By.CSS_SELECTOR,f'#cultivar-grid [data-strain-id="{sid}"]');assert c.find_element(By.CSS_SELECTOR,'.tile-display-name').text==name;assert c.find_element(By.CSS_SELECTOR,'.generation-badge').text==gen
            result['checks']['generation']={'pass':True}
            target=d.find_element(By.CSS_SELECTOR,'#cultivar-grid [data-strain-id="wedding-cake-s1"]');d.execute_script('arguments[0].scrollIntoView({block:"center"})',target);time.sleep(.15);before=d.execute_script('return scrollY');d.execute_script('arguments[0].click()',target)
            w.until(lambda x:x.find_element(By.ID,'detail-dialog').get_attribute('open') is not None);txt=d.find_element(By.ID,'detail-shell').text;assert '正式登録名: Wedding Cake S1' in txt and '系譜 / LINEAGE' in txt and '出典 / SOURCES' in txt
            d.execute_script('arguments[0].click()',d.find_element(By.CSS_SELECTOR,'.close-detail'));w.until(lambda x:x.find_element(By.ID,'detail-dialog').get_attribute('open') is None);time.sleep(.15);after=d.execute_script('return scrollY');assert abs(after-before)<=2,(before,after)
            result['checks']['detail-scroll']={'pass':True,'detail':{'before':before,'after':after}}
            d.save_screenshot(str(OUT/'public-430.png'))
            result['pass']=True
          finally:
            (OUT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2));d.quit()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-ux-v2-live-final-${{ github.run_id }}
          path: live-final/
      - name: Persist result for inspection
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f live-final/result.json
          mkdir -p .github/home-ux-v2-live-final
          cp live-final/result.json .github/home-ux-v2-live-final/result.json
          git config user.name 'home-ux-v2-live-final'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main
          git add .github/home-ux-v2-live-final/result.json
          git commit -m 'Record final live HOME UX V2 verification [skip ci]'
          git push origin HEAD:main
