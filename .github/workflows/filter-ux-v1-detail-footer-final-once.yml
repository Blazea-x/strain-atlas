name: FILTER UX V1 Detail Footer Final Once
"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/filter-ux-v1-detail-footer-final-once.yml"
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PUBLIC_URL: https://blazea-x.github.io/strain-atlas/
      CATALOG_URL: https://raw.githubusercontent.com/Blazea-x/strain-atlas/master-migration/runtime/catalog.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run final public detail footer E2E
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/filter-detail-footer
          git fetch origin master-migration
          git rev-parse origin/master-migration > /tmp/filter-detail-footer/master-start.txt
          python -m pip install --disable-pip-version-check -q selenium
          cat > /tmp/filter-detail-footer/e2e.py <<'PY'
          import json, os, time, traceback, urllib.request
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          OUT=Path('/tmp/filter-detail-footer')
          with urllib.request.urlopen(urllib.request.Request(os.environ['CATALOG_URL'],headers={'User-Agent':'filter-detail-footer'}),timeout=30) as r: catalog=json.load(r)
          opts=Options(); opts.add_argument('--headless=new'); opts.add_argument('--no-sandbox'); opts.add_argument('--disable-dev-shm-usage'); opts.add_argument('--window-size=430,1800')
          d=webdriver.Chrome(service=Service('/usr/bin/chromedriver'),options=opts); w=WebDriverWait(d,35)
          report={'status':'FAIL'}
          def js(x,*a): return d.execute_script(x,*a)
          def labels(): return [e.text.strip() for e in d.find_elements(By.CSS_SELECTOR,'#detail-shell .status-label')]
          try:
              d.get(os.environ['PUBLIC_URL']+'?detail-footer='+os.environ.get('GITHUB_RUN_ID','0'))
              w.until(lambda x:len(x.find_elements(By.CSS_SELECTOR,'#cultivar-grid [data-strain-id]'))>0)
              card=d.find_element(By.CSS_SELECTOR,'#cultivar-grid [data-strain-id="wedding-cake"]'); js("window.scrollTo(0,arguments[0].getBoundingClientRect().top+window.scrollY-100)",card); time.sleep(.2); before=js('return window.scrollY'); js('arguments[0].click()',card)
              w.until(lambda x:x.find_element(By.ID,'detail-dialog').get_attribute('open') is not None); w.until(lambda x:any('LINEAGE' in v for v in labels()))
              for token in ['LINEAGE','AROMA','HISTORY','SOURCES']: assert any(token in v for v in labels()),(token,labels())
              assert not any('TERPENE' in v for v in labels())
              detail=d.find_element(By.ID,'detail-shell'); toggle=detail.find_element(By.CSS_SELECTOR,'.detail-sources [data-detail-toggle]'); js('arguments[0].click()',toggle); time.sleep(.1); assert detail.find_elements(By.CSS_SELECTOR,'.source-detail-link')
              js('arguments[0].click()',detail.find_element(By.CSS_SELECTOR,'.close-detail')); w.until(lambda x:x.find_element(By.ID,'detail-dialog').get_attribute('open') is None); time.sleep(.25); assert abs(js('return window.scrollY')-before)<35
              report['wedding_detail_sources_close_scroll']=True
              terp=next(c for c in catalog['cultivars'] if ((c.get('terpenes') or {}).get('items') or [])); d.get(os.environ['PUBLIC_URL']+f'?strain={terp["id"]}&detail-footer=terp'); w.until(lambda x:x.find_element(By.ID,'detail-dialog').get_attribute('open') is not None); w.until(lambda x:any('TERPENE' in v for v in labels())); report['terpene_detail']=terp['id']
              d.get(os.environ['PUBLIC_URL']+'?strain=wedding-cake&detail-footer=deep'); w.until(lambda x:x.find_element(By.ID,'detail-dialog').get_attribute('open') is not None); assert d.find_element(By.CSS_SELECTOR,'.detail-topbar strong').text.strip()=='Wedding Cake'; report['deep_link']=True
              d.get(os.environ['PUBLIC_URL']+'?detail-footer=footer'); w.until(lambda x:x.find_element(By.ID,'catalog-meta').text.strip()!=''); link=d.find_element(By.CSS_SELECTOR,'#catalog-meta a[href="#cultivars"]'); assert link.text.strip()=='品種一覧'; js('arguments[0].click()',link); w.until(lambda x:js('return location.hash')=='#cultivars'); assert d.find_element(By.ID,'cultivars'); report['footer_anchor']=True
              report['status']='PASS'; OUT.joinpath('report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n'); OUT.joinpath('PASS').write_text('PASS\n')
          except Exception:
              OUT.joinpath('failure.txt').write_text(traceback.format_exc()); raise
          finally: d.quit()
          PY
          python /tmp/filter-detail-footer/e2e.py
          git fetch origin master-migration
          git rev-parse origin/master-migration > /tmp/filter-detail-footer/master-end.txt
          test "$(cat /tmp/filter-detail-footer/master-start.txt)" = "$(cat /tmp/filter-detail-footer/master-end.txt)"
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filter-ux-v1-detail-footer-${{ github.run_id }}
          path: /tmp/filter-detail-footer
          if-no-files-found: error
      - name: Cleanup verifier
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status=FAIL; test -f /tmp/filter-detail-footer/PASS && status=PASS
          git fetch origin main; git checkout main; git reset --hard origin/main
          if [ -f .github/workflows/filter-ux-v1-detail-footer-final-once.yml ]; then
            git rm .github/workflows/filter-ux-v1-detail-footer-final-once.yml
            git config user.name filter-ux-v1-detail-footer-bot
            git config user.email actions@users.noreply.github.com
            git commit -m "Remove FILTER UX V1 detail footer final ${GITHUB_RUN_ID} ${status} [skip ci]"
            git push origin HEAD:main
          fi
