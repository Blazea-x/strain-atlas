name: OpenAI Pending Cultivar Run Discovery

on:
  push:
    branches: [master-migration]
    paths:
      - .github/workflows/openai-pending-cultivar-run-discovery.yml

permissions:
  contents: write
  actions: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_HEAD: bb48e32fd0bf7fa429b1d742cca710b27a09e122
      TARGET_WORKFLOW: openai-pending-cultivar-benchmark.yml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master-migration
          fetch-depth: 1
      - name: Discover target run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, json, urllib.request
          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          target = os.environ['TARGET_HEAD']
          workflow = os.environ['TARGET_WORKFLOW']
          url = f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?event=push&per_page=20'
          req = urllib.request.Request(url, headers={
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28'
          })
          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.load(response)
          matches = [run for run in payload.get('workflow_runs', []) if run.get('head_sha') == target]
          if not matches:
              raise SystemExit('target run not found')
          found = matches[0]
          record = {k: found.get(k) for k in ('id','name','head_sha','status','conclusion','html_url','created_at','updated_at','run_number','run_attempt')}
          record['artifactName'] = f"openai-pending-cultivar-benchmark-{found['id']}"
          os.makedirs('docs/benchmark-results', exist_ok=True)
          with open('docs/benchmark-results/openai-pending-cultivar-run-discovery.json','w') as fh:
              json.dump(record, fh, indent=2)
              fh.write('\n')
          print(json.dumps(record))
          PY
      - name: Commit discovery record
        shell: bash
        run: |
          git config user.name strain-atlas-image-benchmark-discovery
          git config user.email actions@users.noreply.github.com
          git add docs/benchmark-results/openai-pending-cultivar-run-discovery.json
          git commit -m '[IMAGE V2] Discover OpenAI pending-cultivar run'
          git push origin HEAD:master-migration
