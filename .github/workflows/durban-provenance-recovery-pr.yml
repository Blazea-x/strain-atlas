name: Durban provenance recovery PR trigger

on:
  pull_request:
    branches: [master-migration]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/durban-provenance-recovery-trigger"

permissions:
  contents: write
  actions: read

concurrency:
  group: durban-provenance-recovery-once
  cancel-in-progress: false

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_ID: content-production-20260818T060700Z-01
      APPROVED_SOURCE_SHA256: 6835045b34ea5e03c0a82e3d38213ff83ca2ea0a020c1528da9762192fffa2bb
      EXPECTED_PARENT: 9905950f23b36a470d3f981b5dc311d515cdc7db
      RECOVERY_WORKFLOW: .github/workflows/durban-provenance-recovery-pr.yml
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout current MASTER with full history
        uses: actions/checkout@v4
        with:
          ref: master-migration
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact Inbox image dependency
        run: python -m pip install --disable-pip-version-check --quiet "Pillow==11.3.0"

      - name: Execute guarded recovery logic
        shell: bash
        run: |
          set -euo pipefail
          python <<'PYEXTRACT'
          from pathlib import Path
          src=Path('.github/workflows/durban-provenance-recovery-once.yml').read_text(encoding='utf-8')
          start=src.index("          python <<'PY'\n")+len("          python <<'PY'\n")
          end=src.index("\n          PY\n",start)
          block=src[start:end].splitlines()
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in block)+'\n'
          code=code.replace('&event=push&per_page=100','&per_page=100')
          old="""matches=[x for x in workflow_payload.get('workflow_runs',[]) if x.get('head_sha')==source_add_commit and x.get('conclusion')=='success']
if len(matches)!=1: raise RuntimeError(f'SAFE-STOP: expected one successful Inbox workflow run for upload commit, found {len(matches)}')
"""
          new="""direct_matches=[x for x in workflow_payload.get('workflow_runs',[]) if x.get('head_sha')==source_add_commit and x.get('conclusion')=='success']
if len(direct_matches)==1:
    matches=direct_matches
else:
    matches=[]
    signature=f'PASS durban-poison.jpg -> {PRIMARY_PATH}'
    for candidate in workflow_payload.get('workflow_runs',[]):
        if candidate.get('conclusion')!='success':
            continue
        logp=sh(['gh','run','view',str(candidate['id']),'--repo',os.environ['GITHUB_REPOSITORY'],'--log'],check=False)
        combined=(logp.stdout or '')+'\\n'+(logp.stderr or '')
        if signature in combined:
            matches.append(candidate)
if len(matches)!=1: raise RuntimeError(f'SAFE-STOP: expected one successful Inbox workflow run containing Durban processing evidence, found {len(matches)}')
"""
          if old not in code:
              raise SystemExit('recovery patch anchor missing')
          code=code.replace(old,new)
          Path('/tmp/durban-recover.py').write_text(code,encoding='utf-8')
          PYEXTRACT
          python /tmp/durban-recover.py

      - name: Remove remaining one-shot runner
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master-migration main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/master-migration)"
          test "$(git rev-parse origin/main)" = "f9001f70bf938f3931634bd2c42c3875658c1012"
          node scripts/validate-master-data.mjs
          node scripts/audit-content-production.mjs
          git config user.name "strain-atlas-provenance-recovery"
          git config user.email "actions@users.noreply.github.com"
          git rm -- .github/workflows/durban-provenance-recovery-once.yml
          git commit -m "[RECOVERY] Remove one-shot Durban recovery runner"
          git push origin HEAD:master-migration
          echo "CLEANUP FINAL HEAD: $(git rev-parse HEAD)"

      - name: Upload forensic recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durban-provenance-recovery-${{ github.run_id }}
          path: artifacts/durban-provenance-recovery
          if-no-files-found: warn
          retention-days: 30
