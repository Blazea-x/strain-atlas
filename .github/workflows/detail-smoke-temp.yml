name: Temporary detail renderer smoke

on:
  push:
    branches:
      - detail-visual-convergence-smoke-20260821
    paths:
      - "preview/detail-public-v1.js"
      - "runtime/smoke-catalog.json"
      - "scripts/detail-renderer-smoke-temp.mjs"
      - ".github/workflows/detail-smoke-temp.yml"

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout smoke branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Normalize remaining Japanese fuel-diesel label in presentation only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('preview/detail-public-v1.js')
          text = path.read_text()
          label_old = '    fuel: "フューエル",\n'
          label_new = '    fuel: "フューエル",\n    "fuel / diesel": "フューエル / ディーゼル",\n'
          tone_old = '"fuel", "gas / fuel"]);'
          tone_new = '"fuel", "fuel / diesel", "gas / fuel"]);'
          if label_old not in text or tone_old not in text:
              raise SystemExit('expected presentation anchors not found')
          text = text.replace(label_old, label_new, 1).replace(tone_old, tone_new, 1)
          path.write_text(text)
          PY
          node --check preview/detail-public-v1.js

      - name: Run 38 cultivar renderer smoke
        shell: bash
        run: |
          set +e
          node scripts/detail-renderer-smoke-temp.mjs > /tmp/detail-smoke.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            SMOKE_STATUS="$status" node - <<'NODE'
          const fs = require('node:fs');
          fs.mkdirSync('tmp', { recursive: true });
          fs.writeFileSync('tmp/detail-smoke-result.json', JSON.stringify({
            passed: false,
            exitCode: Number(process.env.SMOKE_STATUS || 1),
            log: fs.readFileSync('/tmp/detail-smoke.log', 'utf8')
          }, null, 2) + '\n');
          NODE
          fi
          cat /tmp/detail-smoke.log
          cat tmp/detail-smoke-result.json

      - name: Record tested renderer and smoke result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/detail-public-v1.js tmp/detail-smoke-result.json
          git commit -m "Record passing detail smoke renderer"
          git push
