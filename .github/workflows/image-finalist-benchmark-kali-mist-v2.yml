name: IMAGE V2 Kali Mist Finalist Seed Benchmark

on:
  push:
    branches: [master-migration]
    paths: ['.github/workflows/image-finalist-benchmark-kali-mist-v2.yml']

permissions:
  contents: read

env:
  OUT: finalist-benchmark-artifact

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: master-migration, fetch-depth: 1, persist-credentials: false}
      - run: python -m pip install --disable-pip-version-check --no-cache-dir 'requests>=2.31,<3' 'Pillow>=10,<12'
      - name: Generate 2 models x 5 shared seeds concurrently
        shell: bash
        run: |
          python - <<'PY'
          import requests,json,time,hashlib,io,base64,os,re
          from pathlib import Path
          from PIL import Image,ImageOps,ImageDraw
          from concurrent.futures import ThreadPoolExecutor,as_completed

          B='https://aihorde.net/api/v2'; K='0000000000'; O=Path(os.environ['OUT']); O.mkdir()
          mp=Path('production/manifests/kali-mist.json'); mb=mp.read_bytes(); m=json.loads(mb)
          assert (m['strainId'],m['revision'],m['attempt'],m['approvalStatus'])==('kali-mist',1,1,'pending')
          assert m['visualPreparationHash']=='0c038a0ae42544a1137574a7635255424937c06684cd6240931ac1d8ce27011d'

          models=["ICBINP - I Can't Believe It's Not Photography",'Photon']
          seeds=[104729,105729,130363,131363,156997]
          common='photorealistic botanical reference photograph, single mature living female cannabis plant, botanically plausible morphology, cultivar-specific plant architecture clearly visible, mature female flowers clearly visible, natural branching, internodes and leaf arrangement, realistic cannabis inflorescences, single continuous photographic frame, neutral non-distracting background'
          neg='illustration, painting, anime, cartoon, collage, split panel, text, watermark, logo, packaging, people, smoke, artificial plastic flowers, cotton-like flowers, brush-like flowers, repeated identical cone flowers'
          final=m['promptSnapshot']+'\n\n'+common+' ### '+neg
          profile={
            'version':'CSW-AIHORDE-MODEL-BENCHMARK-PROFILE-V1',
            'promptConstruction':"promptSnapshot + '\\n\\n' + commonPrompt + ' ### ' + negativePrompt",
            'commonPrompt':common,
            'negativePrompt':neg,
            'params':{'cfg_scale':7,'sampler_name':'k_euler_a','height':768,'width':512,'steps':24,'n':1},
            'payload':{'nsfw':False,'censor_nsfw':True,'r2':True,'shared':False,'slow_workers':True,'dry_run':False}
          }
          pcb=json.dumps(profile,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()
          profile_sha=hashlib.sha256(pcb).hexdigest()
          assert profile_sha=='860b7d03e0011dfe8968cfb710f4c31ad1067d8415656de67efb0d63f605a533'
          (O/'generation-profile.json').write_text(json.dumps({**profile,'sha256':profile_sha},indent=2,ensure_ascii=False)+'\n')

          headers={'apikey':K,'Client-Agent':'CannabisStrainsWisdom-FinalistBenchmark:2.0:github.com/Blazea-x/strain-atlas','Accept':'application/json'}
          s=requests.Session(); s.headers.update(headers)
          for ep in ('/status/heartbeat','/status/modes'):
            r=s.get(B+ep,timeout=30); r.raise_for_status()
          modes=s.get(B+'/status/modes',timeout=30).json()
          if modes.get('maintenance_mode'): raise SystemExit('AI Horde maintenance mode')
          r=s.get(B+'/status/models?type=image',timeout=30); r.raise_for_status(); live=r.json()
          live_names={x.get('name') for x in live if int(x.get('count') or 0)>0}
          missing=[x for x in models if x not in live_names]
          if missing: raise SystemExit('finalist model(s) unavailable: '+repr(missing))
          selection=[]
          for model in models:
            x=next(x for x in live if x.get('name')==model)
            selection.append({'modelId':model,'modelName':model,'providerIdentifierType':'model-name','live':x})
          (O/'model-selection.json').write_text(json.dumps({'selected':selection},indent=2,ensure_ascii=False)+'\n')

          tasks=[]
          for mi,model in enumerate(models,1):
            for si,seed in enumerate(seeds,1):
              params={**profile['params'],'seed':str(seed)}
              payload={'prompt':final,'params':params,'models':[model],**profile['payload']}
              t0=time.monotonic(); q=s.post(B+'/generate/async',json=payload,timeout=30); q.raise_for_status(); gid=q.json().get('id')
              if not gid: raise RuntimeError('no generation id')
              tasks.append({'modelId':model,'modelName':model,'modelIndex':mi,'seedIndex':si,'seedRequested':seed,'providerGenerationId':gid,'start':t0})
              time.sleep(.45)

          def run(t):
            ss=requests.Session(); ss.headers.update(headers); start=t['start']; seen=False
            while time.monotonic()-start<1500:
              c=ss.get(B+'/generate/check/'+t['providerGenerationId'],timeout=30); c.raise_for_status(); j=c.json()
              if j.get('faulted'): raise RuntimeError('faulted')
              if int(j.get('processing') or 0)>0 or int(j.get('finished') or 0)>0: seen=True
              if j.get('done'): break
              if not seen and time.monotonic()-start>900: raise TimeoutError('queue timeout')
              time.sleep(5)
            else: raise TimeoutError('generation timeout')
            st=ss.get(B+'/generate/status/'+t['providerGenerationId'],timeout=30); st.raise_for_status(); gs=st.json().get('generations') or []
            if len(gs)!=1: raise RuntimeError(f'generation count {len(gs)}')
            g=gs[0]; ref=g.get('img')
            if not ref: raise RuntimeError('missing image reference')
            if ref.startswith(('http://','https://')):
              rr=ss.get(ref,timeout=60); rr.raise_for_status(); data=rr.content
            else: data=base64.b64decode(ref,validate=True)
            with Image.open(io.BytesIO(data)) as im: im.verify()
            with Image.open(io.BytesIO(data)) as im: w,h,fmt=im.width,im.height,im.format
            ext={'JPEG':'jpg','PNG':'png','WEBP':'webp'}.get(fmt.upper(),'img')
            safe=re.sub(r'[^A-Za-z0-9._-]+','_',t['modelName'])[:64]
            fn=f"model-{t['modelIndex']}__{safe}__seed-{t['seedIndex']}__{g.get('seed')}.{ext}"
            (O/fn).write_bytes(data)
            return {**{k:v for k,v in t.items() if k!='start'},'status':'success','file':fn,'modelReturned':g.get('model'),'seedReturned':g.get('seed'),'providerJobId':g.get('id'),'elapsedSeconds':round(time.monotonic()-start,1),'byteLength':len(data),'sha256':hashlib.sha256(data).hexdigest(),'dimensions':{'width':w,'height':h}}

          results=[]
          with ThreadPoolExecutor(max_workers=10) as ex:
            fs={ex.submit(run,t):t for t in tasks}
            for f in as_completed(fs):
              t=fs[f]
              try: results.append(f.result())
              except Exception as e: results.append({**{k:v for k,v in t.items() if k!='start'},'status':'failed','error':repr(e),'elapsedSeconds':round(time.monotonic()-t['start'],1)})
          results.sort(key=lambda x:(x['modelIndex'],x['seedIndex']))

          good=[x for x in results if x['status']=='success']
          if good:
            thumb_w,thumb_h=320,480; label_h=44; cols=5; rows=2
            sheet=Image.new('RGB',(cols*thumb_w,rows*(thumb_h+label_h)),'white'); draw=ImageDraw.Draw(sheet)
            for x in good:
              p=O/x['file']
              with Image.open(p) as im:
                im=im.convert('RGB'); tile=ImageOps.fit(im,(thumb_w,thumb_h),method=Image.Resampling.LANCZOS)
              c=x['seedIndex']-1; r=x['modelIndex']-1; x0=c*thumb_w; y0=r*(thumb_h+label_h)
              sheet.paste(tile,(x0,y0))
              draw.text((x0+8,y0+thumb_h+8),f"Model {x['modelIndex']} / Seed {x['seedIndex']}  ({x['seedRequested']})",fill='black')
            sheet.save(O/'contact-sheet.jpg',quality=92,optimize=True)

          assert hashlib.sha256(mp.read_bytes()).hexdigest()==hashlib.sha256(mb).hexdigest()
          assert not os.popen("git status --porcelain -- strains production runtime UPLOAD_IMAGES_HERE").read().strip()
          success=sum(x['status']=='success' for x in results)
          summary={
            'finalistBenchmark':'COMPLETE' if success==10 else 'INCOMPLETE',
            'model1HumanReview':'REQUIRED','model2HumanReview':'REQUIRED','productionPromotion':'NOT PERFORMED',
            'productionMutationCount':0,'mainMutationCount':0,'runId':int(os.environ['GITHUB_RUN_ID']),
            'artifactName':'kali-mist-finalist-benchmark-'+os.environ['GITHUB_RUN_ID'],
            'models':[{'modelIndex':1,'modelId':models[0],'modelName':models[0]},{'modelIndex':2,'modelId':models[1],'modelName':models[1]}],
            'sharedSeeds':seeds,'generationProfileVersion':profile['version'],'generationProfileSha256':profile_sha,
            'manifestRevision':m['revision'],'attempt':m['attempt'],'visualPreparationHash':m['visualPreparationHash'],
            'successCount':success,'results':results
          }
          (O/'benchmark-summary.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(summary,ensure_ascii=False))
          PY
      - name: Upload finalist benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kali-mist-finalist-benchmark-${{ github.run_id }}
          path: finalist-benchmark-artifact/
          if-no-files-found: error
          retention-days: 14
