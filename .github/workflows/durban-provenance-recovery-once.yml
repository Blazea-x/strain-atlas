name: Durban Poison provenance recovery once

on:
  push:
    branches: [master-migration]
    paths:
      - ".github/workflows/durban-provenance-recovery-once.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: durban-provenance-recovery-once
  cancel-in-progress: false

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_ID: content-production-20260818T060700Z-01
      APPROVED_SOURCE_SHA256: 6835045b34ea5e03c0a82e3d38213ff83ca2ea0a020c1528da9762192fffa2bb
      EXPECTED_PARENT: 655132ab55d640d4c5a46618de4e4e5b76ac28cb
      RECOVERY_WORKFLOW: .github/workflows/durban-provenance-recovery-once.yml
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout current MASTER with full history
        uses: actions/checkout@v4
        with:
          ref: master-migration
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact Inbox image dependency
        run: python -m pip install --disable-pip-version-check --quiet "Pillow==11.3.0"

      - name: Forensic recovery, validation, batch publication, runtime build
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          import datetime, hashlib, json, os, subprocess, sys, urllib.request

          ROOT = Path.cwd()
          RUN_ID = os.environ['RUN_ID']
          APPROVED = os.environ['APPROVED_SOURCE_SHA256']
          EXPECTED_PARENT = os.environ['EXPECTED_PARENT']
          WORKFLOW_PATH = os.environ['RECOVERY_WORKFLOW']
          SOURCE_PATH = 'UPLOAD_IMAGES_HERE/durban-poison.jpg'
          PRIMARY_PATH = 'strains/durban-poison/images/generated/primary.webp'
          TARGETS = ['durban-poison','kali-mist','warlock']
          ART = ROOT / 'artifacts' / 'durban-provenance-recovery'
          ART.mkdir(parents=True, exist_ok=True)

          def sh(args, check=True, text=True, input_data=None):
              p = subprocess.run(args, cwd=ROOT, text=text, input=input_data, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if check and p.returncode:
                  sys.stderr.write(p.stdout if text else '')
                  sys.stderr.write(p.stderr if text else '')
                  raise RuntimeError(f"command failed ({p.returncode}): {' '.join(args)}")
              return p
          def git(*args, check=True): return sh(['git', *args], check=check).stdout.strip()
          def load(p): return json.loads((ROOT/p).read_text(encoding='utf-8'))
          def save(p, obj): (ROOT/p).write_text(json.dumps(obj,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          def sha256_bytes(b): return hashlib.sha256(b).hexdigest()
          def sha256_file(p): return sha256_bytes((ROOT/p).read_bytes())
          def blob_sha_file(p):
              b=(ROOT/p).read_bytes(); return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def now(): return datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          def commit(message, paths):
              sh(['git','add','--',*paths])
              if not git('diff','--cached','--quiet',check=False) == '':
                  pass
              p=sh(['git','diff','--cached','--quiet'],check=False)
              if p.returncode == 0: raise RuntimeError(f'no staged change for commit: {message}')
              sh(['git','commit','-m',message])
              return git('rev-parse','HEAD')
          def append_transition(item, from_phase, to_phase, at):
              if item.get('productionPhase') != from_phase:
                  raise RuntimeError(f"{item['strainId']}: expected {from_phase}, got {item.get('productionPhase')}")
              item.setdefault('audit',[]).append({'severity':'INFO','code':'PHASE_TRANSITION','fromPhase':from_phase,'toPhase':to_phase,'at':at})
              item['productionPhase']=to_phase
          def exact_validation(label):
              v=sh(['node','scripts/validate-master-data.mjs'],check=False)
              (ART/f'{label}-master-validation.log').write_text(v.stdout+v.stderr,encoding='utf-8')
              print(v.stdout,end=''); print(v.stderr,end='',file=sys.stderr)
              if v.returncode: raise RuntimeError(f'{label}: MASTER validation failed')
              a=sh(['node','scripts/audit-content-production.mjs'],check=False)
              (ART/f'{label}-content-production-audit.log').write_text(a.stdout+a.stderr,encoding='utf-8')
              print(a.stdout,end=''); print(a.stderr,end='',file=sys.stderr)
              if a.returncode: raise RuntimeError(f'{label}: CONTENT PRODUCTION audit failed')

          # Fresh remote state guard. The trigger commit must be the sole change on the requested prior HEAD.
          sh(['git','fetch','origin','master-migration','main'])
          start_head=git('rev-parse','HEAD')
          remote_master=git('rev-parse','origin/master-migration')
          main_head=git('rev-parse','origin/main')
          if start_head != remote_master: raise RuntimeError('SAFE-STOP: checkout is not current remote master-migration')
          if git('rev-parse','HEAD^') != EXPECTED_PARENT: raise RuntimeError('SAFE-STOP: master-migration changed before recovery runner was added')
          changed=git('diff-tree','--no-commit-id','--name-only','-r','HEAD').splitlines()
          if changed != [WORKFLOW_PATH]: raise RuntimeError(f'SAFE-STOP: trigger commit contains unexpected paths: {changed}')
          print('MASTER START HEAD:', start_head)
          print('MAIN START HEAD:', main_head)

          manifest_path=Path('production/manifests/durban-poison.json')
          strain_path=Path('strains/durban-poison/strain.json')
          run_path=Path('production/runs')/f'{RUN_ID}.json'
          publication_path=Path('production/publication.json')
          manifest=load(manifest_path); strain=load(strain_path); run=load(run_path); publication=load(publication_path)
          items={x['strainId']:x for x in run['items']}; pub={x['strainId']:x for x in publication['entries']}

          # Exact current-state preconditions.
          assert run['status']=='ACTIVE' and run['publicationPolicy']=='batch'
          assert run['expectedPublicationDelta']==TARGETS and run['targetStrainIds']==TARGETS
          assert items['durban-poison']['productionPhase']=='IMAGE_PENDING'
          assert strain.get('visuals')==[]
          assert manifest['approvalStatus']=='approved' and manifest['approvalType']=='human-visual-review'
          assert manifest['approvedManifestRevision']==manifest['revision']==1
          assert manifest['approvedAttempt']==manifest['attempt']==1
          assert manifest['approvedSourceSha256']==APPROVED
          assert manifest['expectedInboxFilename']=='durban-poison.jpg'
          assert manifest['expectedPrimaryPath']==PRIMARY_PATH
          for k in ('imageInboxCommit','imageProcessingCommit','processedPrimaryBlobSha','processedPrimarySha256','width','height'):
              assert manifest.get(k) is None, f'Durban manifest {k} unexpectedly changed'
          for sid in ('kali-mist','warlock'):
              assert items[sid]['productionPhase']=='VISUAL_LINKED'
              assert pub[sid]['state']=='pending'
          assert pub['durban-poison']['state']=='pending'
          if not (ROOT/PRIMARY_PATH).is_file(): raise RuntimeError('SAFE-STOP: current Durban primary.webp missing')

          # Identify the upload commit and the Inbox processing commit from Git history.
          source_adds=git('log','--all','--full-history','--diff-filter=A','--format=%H','--',SOURCE_PATH).splitlines()
          source_deletes=git('log','--all','--full-history','--diff-filter=D','--format=%H','--',SOURCE_PATH).splitlines()
          primary_adds=git('log','--all','--full-history','--diff-filter=A','--format=%H','--',PRIMARY_PATH).splitlines()
          if not source_adds or not source_deletes or not primary_adds:
              raise RuntimeError('SAFE-STOP: required source/primary Git history not found')
          source_add_commit=source_adds[0]
          candidates=[]
          for c in source_deletes:
              if c not in set(primary_adds): continue
              status=git('diff-tree','--no-commit-id','--name-status','-r',c).splitlines()
              if any(x==f'D\t{SOURCE_PATH}' for x in status) and any(x.endswith('\t'+PRIMARY_PATH) and x[0] in 'AM' for x in status): candidates.append(c)
          if len(candidates)!=1: raise RuntimeError(f'SAFE-STOP: expected one Inbox processing commit, found {candidates}')
          original_processing_commit=candidates[0]
          if sh(['git','merge-base','--is-ancestor',source_add_commit,'HEAD'],check=False).returncode or sh(['git','merge-base','--is-ancestor',original_processing_commit,'HEAD'],check=False).returncode:
              raise RuntimeError('SAFE-STOP: forensic commits are not ancestors of current master-migration')
          proc_subject=git('show','-s','--format=%s',original_processing_commit)
          proc_author=git('show','-s','--format=%an',original_processing_commit)
          if proc_subject!='[IMAGE UPLOAD INBOX V1] Process image batch' or proc_author!='strain-atlas-image-inbox-bot':
              raise RuntimeError(f'SAFE-STOP: processing commit identity mismatch: {proc_author} / {proc_subject}')

          # Recover the exact source bytes that were present immediately before processing.
          source_bytes=sh(['git','show',f'{original_processing_commit}^:{SOURCE_PATH}'],text=False).stdout
          source_sha=sha256_bytes(source_bytes)
          (ART/'recovered-durban-poison.jpg').write_bytes(source_bytes)
          if source_sha != APPROVED:
              raise RuntimeError(f'SAFE-STOP: approved source SHA mismatch: {source_sha}')
          add_bytes=sh(['git','show',f'{source_add_commit}:{SOURCE_PATH}'],text=False).stdout
          source_add_sha=sha256_bytes(add_bytes)
          if source_add_sha != APPROVED:
              raise RuntimeError(f'SAFE-STOP: source add commit bytes differ from approved source: {source_add_sha}')
          print('APPROVED SOURCE SHA-256: PASS', source_sha)

          # Identify the successful IMAGE UPLOAD INBOX V1 workflow run that was triggered by the source upload commit.
          api=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/image-upload-inbox-v1.yml/runs?branch=master-migration&event=push&per_page=100"
          req=urllib.request.Request(api,headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=30) as r: workflow_payload=json.load(r)
          matches=[x for x in workflow_payload.get('workflow_runs',[]) if x.get('head_sha')==source_add_commit and x.get('conclusion')=='success']
          if len(matches)!=1: raise RuntimeError(f'SAFE-STOP: expected one successful Inbox workflow run for upload commit, found {len(matches)}')
          inbox_run=matches[0]
          inbox_run_id=inbox_run['id']
          print('IMAGE UPLOAD INBOX V1 RUN:', inbox_run_id)
          print('IMAGE INBOX COMMIT:', source_add_commit)
          print('ORIGINAL IMAGE PROCESSING COMMIT:', original_processing_commit)

          # Measure current primary.
          current_bytes=(ROOT/PRIMARY_PATH).read_bytes()
          if len(current_bytes)<12 or current_bytes[:4]!=b'RIFF' or current_bytes[8:12]!=b'WEBP':
              raise RuntimeError('SAFE-STOP: current primary has invalid WEBP signature')
          current_sha=sha256_bytes(current_bytes); current_blob=blob_sha_file(Path(PRIMARY_PATH))
          try:
              with Image.open(ROOT/PRIMARY_PATH) as im:
                  im.load(); current_format=im.format; width,height=im.size
          except Exception as exc: raise RuntimeError(f'SAFE-STOP: current primary decode failed: {exc}')
          if current_format!='WEBP': raise RuntimeError('SAFE-STOP: decoder did not identify current primary as WEBP')
          primary_history=git('log','--all','--full-history','--format=%H|%aI|%an|%s','--',PRIMARY_PATH).splitlines()
          (ART/'primary-history.txt').write_text('\n'.join(primary_history)+'\n',encoding='utf-8')
          print('CURRENT PRIMARY SHA-256:', current_sha)
          print('CURRENT PRIMARY BLOB SHA:', current_blob)
          print('CURRENT PRIMARY DIMENSIONS:', f'{width}x{height}')
          print('CURRENT PRIMARY DECODE: PASS')
          print('CURRENT PRIMARY WEBP SIGNATURE: PASS')

          # Re-run the exact Inbox conversion for proof. Pillow is pinned to 11.3.0 by the workflow.
          recovered=ART/'recovered-durban-poison.jpg'; reconverted=ART/'reconverted-primary.webp'
          with Image.open(recovered) as im:
              im.load(); im.save(reconverted,format='WEBP',quality=92,method=6)
          rb=reconverted.read_bytes()
          if len(rb)<12 or rb[:4]!=b'RIFF' or rb[8:12]!=b'WEBP': raise RuntimeError('SAFE-STOP: verification reconversion produced invalid WEBP')
          with Image.open(reconverted) as im:
              im.load(); rw,rh=im.size
              if im.format!='WEBP': raise RuntimeError('SAFE-STOP: verification reconversion decode format mismatch')
          reconverted_sha=sha256_bytes(rb)
          if (rw,rh)!=(width,height):
              raise RuntimeError(f'SAFE-STOP: verification reconversion dimensions {rw}x{rh} differ from current {width}x{height}')

          git('config','user.name','strain-atlas-provenance-recovery')
          git('config','user.email','actions@users.noreply.github.com')
          recovery_mode='A_EXISTING_PRIMARY_EXACT_MATCH'
          effective_processing_commit=original_processing_commit
          if reconverted_sha != current_sha:
              recovery_mode='B_REBUILT_FROM_APPROVED_SOURCE'
              (ROOT/PRIMARY_PATH).write_bytes(rb)
              rebuild_commit=commit('[RECOVERY] Rebuild Durban Poison primary from approved Inbox source',[PRIMARY_PATH])
              effective_processing_commit=rebuild_commit
              current_sha=sha256_file(Path(PRIMARY_PATH)); current_blob=blob_sha_file(Path(PRIMARY_PATH))
              with Image.open(ROOT/PRIMARY_PATH) as im: im.load(); width,height=im.size
              if current_sha != reconverted_sha: raise RuntimeError('SAFE-STOP: rebuilt primary digest mismatch')
          print('PROCESSING CHAIN MODE:', recovery_mode)
          print('RECONVERTED SHA-256:', reconverted_sha)
          print('EFFECTIVE IMAGE PROCESSING COMMIT:', effective_processing_commit)

          # Recover manifest, visual linkage and RUN state without skipping a phase.
          manifest=load(manifest_path); strain=load(strain_path); run=load(run_path); items={x['strainId']:x for x in run['items']}; item=items['durban-poison']
          manifest['imageInboxCommit']=source_add_commit
          manifest['imageProcessingCommit']=effective_processing_commit
          manifest['processedPrimaryBlobSha']=current_blob
          manifest['processedPrimarySha256']=current_sha
          manifest['width']=width; manifest['height']=height
          manifest.setdefault('audit',[]).append({'severity':'INFO','code':'RECOVERED_FROM_GITHUB_STATE','at':now(),'productionPhase':'IMAGE_PENDING','note':f'Forensic provenance recovery verified approved source SHA-256; source upload commit {source_add_commit}; original IMAGE UPLOAD INBOX V1 processing commit {original_processing_commit}; workflow run {inbox_run_id}; recovery mode {recovery_mode}; effective processing commit {effective_processing_commit}.'})
          meta=manifest['visualMetadataSnapshot']
          strain['visuals']=[{'role':'primary','src':PRIMARY_PATH,'aiGenerated':True,'sourceType':meta['sourceType'],'rights':meta['rights'],'alt':meta['alt'],'scope':meta['scope']}]
          strain['updatedAt']='2026-08-19'
          item['approval']={'approvalType':manifest['approvalType'],'approvedAt':manifest['approvedAt'],'manifestRevision':manifest['approvedManifestRevision'],'primarySourceSha256':manifest['approvedSourceSha256']}
          item['commits']['imageInboxCommit']=source_add_commit
          item['commits']['imageProcessingCommit']=effective_processing_commit
          t1=now(); append_transition(item,'IMAGE_PENDING','IMAGE_READY',t1)
          t2=now(); append_transition(item,'IMAGE_READY','VISUAL_LINKED',t2)
          run['updatedAt']=t2
          run['recovery']={'type':'durban-poison-provenance-forensic-recovery','recoveredAt':t2,'approvedSourceSha256':APPROVED,'sourceUploadCommit':source_add_commit,'originalImageProcessingCommit':original_processing_commit,'effectiveImageProcessingCommit':effective_processing_commit,'imageUploadInboxWorkflowRunId':inbox_run_id,'mode':recovery_mode}
          save(manifest_path,manifest); save(strain_path,strain); save(run_path,run)
          visuals_commit=commit('[RECOVERY] Restore Durban Poison provenance and visual linkage',[str(manifest_path),str(strain_path),str(run_path)])
          run=load(run_path); items={x['strainId']:x for x in run['items']}; items['durban-poison']['commits']['visualsCommit']=visuals_commit; run['updatedAt']=now(); save(run_path,run)
          bind_commit=commit('[RECOVERY] Bind Durban Poison visual linkage commit',[str(run_path)])
          print('DURBAN VISUALS COMMIT:', visuals_commit)
          print('DURBAN BIND COMMIT:', bind_commit)

          # Required validation gate before publication.
          exact_validation('pre-publication')
          print('PRE-PUBLICATION VALIDATION GATE: PASS')

          # Atomic three-cultivar batch publication.
          publication=load(publication_path); run=load(run_path); pub={x['strainId']:x for x in publication['entries']}; items={x['strainId']:x for x in run['items']}
          for sid in TARGETS:
              if pub[sid]['state']!='pending' or items[sid]['productionPhase']!='VISUAL_LINKED':
                  raise RuntimeError(f'SAFE-STOP: batch member {sid} not pending/VISUAL_LINKED')
          published_at=now()
          for sid in TARGETS:
              pub[sid]['state']='published'; pub[sid]['publishedAt']=published_at
              append_transition(items[sid],'VISUAL_LINKED','PUBLISHED',published_at)
          run['status']='PUBLISHING'; run['updatedAt']=published_at
          save(publication_path,publication); save(run_path,run)
          publication_commit=commit('[CONTENT PRODUCTION] Publish Durban Poison, Kali Mist, and Warlock batch',[str(publication_path),str(run_path)])
          print('BATCH PUBLICATION COMMIT:', publication_commit)

          # Bind publication commit, then use the formal build script. No runtime hand editing.
          run=load(run_path); items={x['strainId']:x for x in run['items']}
          for sid in TARGETS: items[sid]['commits']['publicationCommit']=publication_commit
          run['updatedAt']=now(); save(run_path,run)
          b=sh(['node','scripts/build-runtime-data.mjs'],check=False)
          (ART/'runtime-build.log').write_text(b.stdout+b.stderr,encoding='utf-8'); print(b.stdout,end=''); print(b.stderr,end='',file=sys.stderr)
          if b.returncode: raise RuntimeError('formal runtime build failed')
          runtime=load(Path('runtime/catalog.json')); rc={x['id']:x for x in runtime['cultivars']}
          for sid in TARGETS:
              if sid not in rc: raise RuntimeError(f'RUNTIME TARGET MISSING: {sid}')
          if len(rc['durban-poison'].get('visuals',[]))!=1 or rc['durban-poison']['visuals'][0].get('role')!='primary': raise RuntimeError('Durban runtime visual contract failed')
          for sid in ('kali-mist','warlock'):
              vs=rc[sid].get('visuals',[])
              if len(vs)<2 or vs[0].get('role')!='primary' or not any(v.get('role')=='secondary' for v in vs): raise RuntimeError(f'{sid} runtime gallery contract failed')
          build_commit=commit('[CONTENT PRODUCTION] Build published batch runtime',['runtime/catalog.json','data.js','sources.js',str(run_path)])
          print('RUNTIME BUILD COMMIT:', build_commit)

          # Structural public-shell verification against the fresh main HEAD. main remains read-only.
          sh(['git','fetch','origin','main'])
          if git('rev-parse','origin/main')!=main_head: raise RuntimeError('SAFE-STOP: main changed during recovery')
          main_app=git('show',f'{main_head}:preview/app.js')
          main_gallery=git('show',f'{main_head}:preview/detail-gallery.js')
          main_index=git('show',f'{main_head}:index.html')
          required_app=['master-migration/runtime/catalog.json','const primaryVisual = cultivar','v.role === "primary"','tile-visual','detail-hero']
          if not all(x in main_app for x in required_app): raise RuntimeError('main primary display wiring verification failed')
          required_gallery=['master-migration/runtime/catalog.json','orderedVisuals','visuals.length < 2','detail-gallery-track','overflow-x:auto','scroll-snap-type:x mandatory']
          if not all(x in main_gallery for x in required_gallery): raise RuntimeError('main multi-visual gallery wiring verification failed')
          if 'preview/detail-gallery.js' not in main_index or 'preview/app.js' not in main_index: raise RuntimeError('main index gallery/app loader missing')
          display_verified_at=now()
          print('SITE STRUCTURAL DISPLAY CONTRACT: PASS')

          # Finalize RUN using real commit SHAs already created locally.
          run=load(run_path); items={x['strainId']:x for x in run['items']}
          for sid in TARGETS: items[sid]['commits']['buildCommit']=build_commit
          final_at=now(); run['status']='SUCCESS'; run['updatedAt']=final_at; run['finishedAt']=final_at; run['mainHeadAtEnd']=main_head
          publication=load(publication_path)
          run['publicationSetAtEnd']=sorted(x['strainId'] for x in publication['entries'] if x['state']=='published')
          run['displayVerifiedAt']=display_verified_at
          run['auditSummary']={'status':'PASS','errors':0,'warnings':0,'info':0,'checkedAt':final_at,'notes':['Durban Poison provenance recovered from Git history with approved source digest verification.','Required MASTER validation and CONTENT PRODUCTION audit passed before batch publication.','Batch publication opened atomically for Durban Poison, Kali Mist, and Warlock; runtime rebuilt with the formal script.','main remained unchanged; primary and multi-visual gallery wiring verified structurally against main HEAD.']}
          save(run_path,run)

          # Remove this one-shot runner from the resulting tree; its trigger commit remains auditable history only.
          (ROOT/WORKFLOW_PATH).unlink()

          # Audit the exact intended final tree before committing it.
          v=sh(['node','scripts/validate-master-data.mjs'],check=False)
          (ART/'final-precommit-master-validation.log').write_text(v.stdout+v.stderr,encoding='utf-8')
          if v.returncode: print(v.stdout); print(v.stderr,file=sys.stderr); raise RuntimeError('final precommit MASTER validation failed')
          aj=sh(['node','scripts/audit-content-production.mjs','--json'],check=False)
          (ART/'final-precommit-content-production-audit.json').write_text(aj.stdout,encoding='utf-8'); (ART/'final-precommit-content-production-audit.stderr.log').write_text(aj.stderr,encoding='utf-8')
          if aj.returncode: print(aj.stdout); print(aj.stderr,file=sys.stderr); raise RuntimeError('final precommit CONTENT PRODUCTION audit failed')
          try:
              audit_json=json.loads(aj.stdout); findings=audit_json.get('findings',[])
              counts={s:sum(1 for f in findings if f.get('severity')==s) for s in ('ERROR','WARNING','INFO')}
              run=load(run_path); run['auditSummary']['errors']=counts['ERROR']; run['auditSummary']['warnings']=counts['WARNING']; run['auditSummary']['info']=counts['INFO']; run['auditSummary']['checkedAt']=now(); save(run_path,run)
          except Exception as exc: raise RuntimeError(f'could not parse final audit JSON: {exc}')

          final_commit=commit('[CONTENT PRODUCTION] Finalize recovered batch publication',[str(run_path),WORKFLOW_PATH])
          print('FINAL LOCAL COMMIT:', final_commit)

          # Required commands again against the committed final state.
          exact_validation('final')

          # Reconfirm final runtime contract and untouched main immediately before push.
          sh(['git','fetch','origin','master-migration','main'])
          if git('rev-parse','origin/master-migration')!=start_head: raise RuntimeError('SAFE-STOP: remote master-migration changed concurrently')
          if git('rev-parse','origin/main')!=main_head: raise RuntimeError('SAFE-STOP: main changed concurrently')
          runtime=load(Path('runtime/catalog.json')); ids={x['id'] for x in runtime['cultivars']}
          if not set(TARGETS).issubset(ids): raise RuntimeError('final runtime target set incomplete')
          publication=load(publication_path); pub={x['strainId']:x for x in publication['entries']}
          run=load(run_path); items={x['strainId']:x for x in run['items']}
          if not all(pub[s]['state']=='published' and items[s]['productionPhase']=='PUBLISHED' for s in TARGETS): raise RuntimeError('final publication state incomplete')

          # Machine-readable evidence report before the single remote push.
          final_manifest=load(manifest_path); final_strain=load(strain_path)
          report={
            'runId':RUN_ID,'masterStartHead':start_head,'mainFinalHead':main_head,'finalLocalHead':final_commit,
            'durbanPoison':{
              'approvedSourceSha256Verification':'PASS','sourceRecovery':'PASS','approvedSourceSha256':source_sha,
              'sourceUploadCommit':source_add_commit,'imageUploadInboxWorkflowRunId':inbox_run_id,
              'originalImageProcessingCommit':original_processing_commit,'effectiveImageProcessingCommit':final_manifest['imageProcessingCommit'],
              'processingChainMode':recovery_mode,'processedPrimarySha256':final_manifest['processedPrimarySha256'],
              'processedPrimaryBlobSha':final_manifest['processedPrimaryBlobSha'],'width':final_manifest['width'],'height':final_manifest['height'],
              'decode':'PASS','webpSignature':'PASS','visualsCount':len(final_strain.get('visuals',[])),'productionPhase':items['durban-poison']['productionPhase']},
            'validation':{'master':'PASS','contentProductionAudit':'PASS'},
            'publication':{s:pub[s]['state'] for s in TARGETS},
            'runtime':{s:(s in ids) for s in TARGETS},
            'siteDisplay':{'durbanPoison':'PASS','kaliMistGallery':'PASS','warlockGallery':'PASS','verification':'structural-main-wiring-plus-built-runtime'},
            'openAIGeneration':0,'additionalOpenAICostUsd':0.0
          }
          (ART/'recovery-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Only now mutate remote MASTER. No OpenAI/image generation API is called anywhere in this workflow.
          sh(['git','push','origin','HEAD:master-migration'])
          print('MASTER FINAL PUSH:', final_commit)
          print('MAIN FINAL HEAD:', main_head)
          print('OPENAI GENERATION: 0')
          print('ADDITIONAL OPENAI COST: $0.00')
          PY

      - name: Upload forensic recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durban-provenance-recovery-${{ github.run_id }}
          path: artifacts/durban-provenance-recovery
          if-no-files-found: warn
          retention-days: 30
