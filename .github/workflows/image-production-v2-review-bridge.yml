name: IMAGE PRODUCTION V2 Review Bridge

on:
  push:
    branches: [master-migration]
    paths:
      - .github/workflows/image-production-v2-review-bridge.yml

permissions:
  actions: read
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master-migration

      - name: Locate completed one-shot generation run and artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_HEAD: 639f6087c796ac61787682aff377850165fb1e55
          WORKFLOW_FILE: image-production-v2-dr-grinspoon-malawi-preflight.yml
        shell: bash
        run: |
          python - <<'PY'
          import os, json, time, urllib.request, zipfile, io
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          target = os.environ['TARGET_HEAD']
          wf = os.environ['WORKFLOW_FILE']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'strain-atlas-image-review-bridge',
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          run = None
          for _ in range(40):
              data = get_json(f'https://api.github.com/repos/{repo}/actions/workflows/{wf}/runs?branch=master-migration&event=push&per_page=10')
              candidates = [x for x in data.get('workflow_runs', []) if x.get('head_sha') == target]
              if candidates:
                  run = sorted(candidates, key=lambda x: x['id'], reverse=True)[0]
                  if run.get('status') == 'completed':
                      break
              time.sleep(10)

          if not run:
              raise SystemExit('generation run not found; no regeneration attempted')
          if run.get('status') != 'completed':
              raise SystemExit('generation run did not complete; no regeneration attempted')

          meta = {
              'runId': run['id'],
              'status': run.get('status'),
              'conclusion': run.get('conclusion'),
              'headSha': run.get('head_sha'),
              'workflowPath': run.get('path'),
          }

          arts = get_json(f'https://api.github.com/repos/{repo}/actions/runs/{run["id"]}/artifacts')
          live = [a for a in arts.get('artifacts', []) if not a.get('expired') and a.get('name', '').startswith('image-production-v2-dr-grinspoon-malawi-')]
          if not live:
              raise SystemExit('generation artifact not found; no regeneration attempted')
          art = live[0]
          meta['artifactId'] = art['id']
          meta['artifactName'] = art['name']

          req = urllib.request.Request(art['archive_download_url'], headers=headers)
          with urllib.request.urlopen(req, timeout=60) as r:
              payload = r.read()
          dest = Path('.image-transfer/review/image-production-v2-dr-grinspoon-malawi')
          dest.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(payload)) as z:
              safe = [n for n in z.namelist() if not Path(n).is_absolute() and '..' not in Path(n).parts]
              for n in safe:
                  target_path = dest / n
                  if n.endswith('/'):
                      target_path.mkdir(parents=True, exist_ok=True)
                  else:
                      target_path.parent.mkdir(parents=True, exist_ok=True)
                      target_path.write_bytes(z.read(n))
          (dest/'bridge-metadata.json').write_text(json.dumps(meta, indent=2)+'\n', encoding='utf-8')
          print(json.dumps(meta))
          PY

      - name: Commit review-only bridge files
        run: |
          git config user.name strain-atlas-bot
          git config user.email actions@users.noreply.github.com
          git add .image-transfer/review/image-production-v2-dr-grinspoon-malawi
          if git diff --cached --quiet; then
            echo 'No review bridge changes to commit.'
          else
            git commit -m 'Bridge one-shot Dr Grinspoon and Malawi candidates for review'
            git push origin HEAD:master-migration
          fi
