name: FILTER UX V1 Final Live Once
"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/filter-ux-v1-final-live-once.yml"

permissions:
  contents: write
  actions: write
  pages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLIC_URL: https://blazea-x.github.io/strain-atlas/
      CATALOG_URL: https://raw.githubusercontent.com/Blazea-x/strain-atlas/master-migration/runtime/catalog.json
      PUBLICATION_URL: https://raw.githubusercontent.com/Blazea-x/strain-atlas/master-migration/production/publication.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard clean main and record source state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/filter-ux-v1-final
          git fetch origin main master-migration
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/filter-ux-v1-final-live-once.yml"
          git rev-parse HEAD^ > /tmp/filter-ux-v1-final/source-main-before-helper.txt
          git rev-parse origin/master-migration > /tmp/filter-ux-v1-final/master-at-run-start.txt

      - name: Dispatch current main to Pages and require success
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-public-ui-pages.yml --ref main
          for i in $(seq 1 75); do
            json="$(gh run list --workflow deploy-public-ui-pages.yml --limit 30 --json databaseId,headSha,status,conclusion,event,createdAt,url --jq '[.[] | select(.headSha == env.GITHUB_SHA and .event == "workflow_dispatch")][0]')"
            if [ -n "$json" ] && [ "$json" != "null" ]; then
              status="$(printf '%s' "$json" | jq -r .status)"
              if [ "$status" = "completed" ]; then
                conclusion="$(printf '%s' "$json" | jq -r .conclusion)"
                printf '%s\n' "$json" > /tmp/filter-ux-v1-final/pages-run.json
                printf '%s' "$json" | jq -r .databaseId > /tmp/filter-ux-v1-final/pages-run-id.txt
                test "$conclusion" = "success"
                break
              fi
            fi
            sleep 4
          done
          test -s /tmp/filter-ux-v1-final/pages-run.json
          gh api "repos/$GITHUB_REPOSITORY/pages" > /tmp/filter-ux-v1-final/pages.json

      - name: Wait for FILTER UX V1 bytes on public Pages
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            html="$(curl -fsSL --retry 2 --max-time 15 "$PUBLIC_URL?filteruxv1=$GITHUB_RUN_ID" || true)"
            if printf '%s' "$html" | grep -q 'id="filter-disclosure"' \
              && printf '%s' "$html" | grep -q 'preview/app.js?v=6' \
              && printf '%s' "$html" | grep -q 'data-explore="hybrid"' \
              && ! printf '%s' "$html" | grep -q 'data-explore="unclassified"'; then
              printf '%s' "$html" > /tmp/filter-ux-v1-final/public-index.html
              exit 0
            fi
            sleep 4
          done
          echo "FILTER UX V1 bytes not visible on public Pages" >&2
          exit 1

      - name: Install browser test dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q selenium
          command -v google-chrome
          command -v chromedriver

      - name: Run 390px and 430px public browser E2E
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/filter-ux-v1-final/e2e.py <<'PY'
          import json, os, re, time, traceback, urllib.request
          from datetime import datetime
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.chrome.service import Service
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait, Select
          from selenium.webdriver.support import expected_conditions as EC

          OUT = Path('/tmp/filter-ux-v1-final')
          BASE = os.environ['PUBLIC_URL']
          CATALOG_URL = os.environ['CATALOG_URL']
          PUBLICATION_URL = os.environ['PUBLICATION_URL']

          def load_json(url):
              req = urllib.request.Request(url, headers={'User-Agent':'filter-ux-v1-e2e'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          catalog = load_json(CATALOG_URL)
          publication = load_json(PUBLICATION_URL)
          cultivars = catalog['cultivars']
          by_id = {c['id']: c for c in cultivars}
          entities = catalog.get('entities', {})
          ids_all = {c['id'] for c in cultivars}

          type_labels = {
              'sativa':'SATIVA','indica':'INDICA','hybrid':'HYBRID',
              'sativa-dominant-hybrid':'SATIVA系 HYBRID','indica-dominant-hybrid':'INDICA系 HYBRID',
              'balanced-hybrid':'BALANCED HYBRID','unknown':'未分類'
          }
          role_labels = {'originator':'ORIGINATOR','breeder':'BREEDER','seedCompany':'SEED COMPANY','producer':'PRODUCER','brand':'BRAND','distributor':'DISTRIBUTOR'}

          def text(x):
              return '' if x is None else str(x)

          def search_blob(c):
              vals = [c.get('id'), c.get('name'), c.get('jp')]
              vals += c.get('aliases') or []
              typ = (c.get('classification') or {}).get('type')
              vals += [typ, type_labels.get(typ, typ)]
              vals += [(c.get('breeding') or {}).get('generation')]
              lin = c.get('lineage') or {}
              vals += [lin.get('display')] + (lin.get('parents') or []) + [lin.get('note')]
              vals += ((c.get('aromas') or {}).get('items') or [])
              vals += ((c.get('terpenes') or {}).get('items') or [])
              vals += [(c.get('origin') or {}).get('text'), (c.get('history') or {}).get('text')]
              for rel in c.get('relations') or []:
                  ent = entities.get(rel.get('entityId'), {})
                  vals.append(ent.get('name') or rel.get('entityId'))
                  vals.extend(role_labels.get(r, r) for r in (rel.get('roles') or []))
              return ' '.join(text(v) for v in vals if v is not None and text(v).strip()).lower()

          def gen_sort_key(v):
              if v == 'S1': return (0,1,v)
              m = re.fullmatch(r'F([1-9][0-9]*)', v)
              if m: return (1,int(m.group(1)),v)
              m = re.fullmatch(r'BX([1-9][0-9]*)', v)
              if m: return (2,int(m.group(1)),v)
              if v == 'IBL': return (3,0,v)
              return (4,0,v.lower())

          generations = sorted({text((c.get('breeding') or {}).get('generation')).strip() for c in cultivars
                                if text((c.get('breeding') or {}).get('generation')).strip()
                                and text((c.get('breeding') or {}).get('generation')).strip().lower() != 'unknown'}, key=gen_sort_key)

          breeder_map = {}
          seedcompany_entities = set()
          for c in cultivars:
              for rel in c.get('relations') or []:
                  roles = rel.get('roles') or []
                  eid = rel.get('entityId')
                  if 'seedCompany' in roles: seedcompany_entities.add(eid)
                  if 'breeder' in roles:
                      name = text((entities.get(eid) or {}).get('name')).strip()
                      if name: breeder_map[eid] = name
          breeder_entries = sorted(breeder_map.items(), key=lambda kv: kv[1].lower())
          seedcompany_only = seedcompany_entities - set(breeder_map)

          def parse_ts(s):
              if not s: return float('-inf')
              try: return datetime.fromisoformat(s.replace('Z','+00:00')).timestamp()
              except Exception: return float('-inf')
          pub = []
          for i,e in enumerate(publication.get('entries') or []):
              if e.get('state') == 'published' and e.get('strainId') in ids_all:
                  pub.append((e,i))
          pub.sort(key=lambda pair: (-parse_ts(pair[0].get('publishedAt')), -pair[1], text(pair[0].get('strainId'))))
          latest_expected = [e.get('strainId') for e,i in pub[:6]]

          def expected(type_key='all', gens=None, breeder='', query=''):
              gens = set(gens or [])
              type_ids = ids_all if type_key == 'all' else set((catalog.get('explore') or {}).get(type_key) or [])
              q = query.lower().strip()
              out=[]
              for c in cultivars:
                  if c['id'] not in type_ids: continue
                  g = text((c.get('breeding') or {}).get('generation')).strip()
                  if gens and g not in gens: continue
                  if breeder:
                      ok = any(rel.get('entityId') == breeder and 'breeder' in (rel.get('roles') or []) for rel in (c.get('relations') or []))
                      if not ok: continue
                  if q and q not in search_blob(c): continue
                  out.append(c['id'])
              return out

          opts = Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--window-size=430,1800')
          driver = webdriver.Chrome(service=Service('/usr/bin/chromedriver'), options=opts)
          wait = WebDriverWait(driver, 35)
          report = {
              'catalog_count': len(cultivars), 'generation_values': generations,
              'breeders': [{'id':i,'name':n} for i,n in breeder_entries],
              'latest_expected': latest_expected, 'searches': {}, 'combinations': {}, 'viewports': {}
          }

          def js(script, *args): return driver.execute_script(script, *args)
          def wait_loaded():
              wait.until(lambda d: len(d.find_elements(By.CSS_SELECTOR, '#cultivar-grid [data-strain-id]')) == len(cultivars))
              wait.until(lambda d: d.find_element(By.ID,'catalog-total').text.strip() != '収録数を読み込み中')
              wait.until(lambda d: len(d.find_elements(By.CSS_SELECTOR,'#latest-grid [data-strain-id]')) == len(latest_expected))
          def visible_ids(): return [e.get_attribute('data-strain-id') for e in driver.find_elements(By.CSS_SELECTOR,'#cultivar-grid [data-strain-id]')]
          def latest_ids(): return [e.get_attribute('data-strain-id') for e in driver.find_elements(By.CSS_SELECTOR,'#latest-grid [data-strain-id]')]
          def set_query(q):
              inp=driver.find_element(By.ID,'search')
              js("arguments[0].value=arguments[1];arguments[0].dispatchEvent(new Event('input',{bubbles:true}));", inp, q)
              time.sleep(.08)
          def click_type(k):
              b=driver.find_element(By.CSS_SELECTOR,f'[data-explore="{k}"]')
              js('arguments[0].click()', b); time.sleep(.08)
          def set_breeder(eid):
              sel=Select(driver.find_element(By.ID,'breeder-filter')); sel.select_by_value(eid); time.sleep(.08)
          def toggle_gen(g):
              b=driver.find_element(By.CSS_SELECTOR, f'[data-generation="{g}"]'); js('arguments[0].click()',b); time.sleep(.08)
          def reset_all(clear_query=True):
              click_type('all')
              for b in driver.find_elements(By.CSS_SELECTOR,'[data-generation].is-active'):
                  js('arguments[0].click()', b)
              set_breeder('')
              if clear_query: set_query('')
              time.sleep(.08)
          def assert_ids(exp, label):
              got=visible_ids(); exp=list(exp)
              assert set(got)==set(exp) and len(got)==len(exp), f'{label}: got {got}, expected {exp}'
              return len(got)
          def choose_nonempty(predicate):
              for c in cultivars:
                  if predicate(c): return c
              return None
          def in_type(c,k): return c['id'] in set((catalog.get('explore') or {}).get(k) or [])
          def breeder_ids(c): return [r.get('entityId') for r in (c.get('relations') or []) if 'breeder' in (r.get('roles') or [])]

          try:
              driver.get(BASE + '?filteruxfinal=' + os.environ.get('GITHUB_RUN_ID','0'))
              wait_loaded()
              assert len(cultivars) == catalog.get('counts',{}).get('cultivars',len(cultivars))
              assert driver.find_element(By.ID,'catalog-total').text.strip() == f'{len(cultivars)}品種を収録'
              assert latest_ids() == latest_expected and len(latest_expected)==6
              initial_latest = latest_ids()

              type_buttons = driver.find_elements(By.CSS_SELECTOR,'#explore [data-explore]')
              assert [b.get_attribute('data-explore') for b in type_buttons] == ['all','sativa','indica','hybrid']
              assert [re.sub(r'\s+\d+$','',b.text.strip()) for b in type_buttons] == ['すべて','SATIVA系','INDICA系','HYBRID']
              assert not driver.find_elements(By.CSS_SELECTOR,'[data-explore="unclassified"]')
              assert not driver.find_elements(By.CSS_SELECTOR,'.all-cultivars-section .explore')
              assert driver.find_element(By.ID,'explore').rect['y'] < driver.find_element(By.ID,'search').rect['y']
              assert driver.find_element(By.ID,'filter-disclosure').get_attribute('open') is None
              assert driver.find_element(By.ID,'cultivars')

              for key in ['all','sativa','indica','hybrid']:
                  reset_all(); click_type(key)
                  count=assert_ids(expected(type_key=key), 'TYPE '+key)
                  report['combinations']['type_'+key]=count
              reset_all()

              driver.find_element(By.CSS_SELECTOR,'#filter-disclosure summary').click(); time.sleep(.1)
              assert driver.find_element(By.ID,'filter-disclosure').get_attribute('open') is not None
              gen_ui=[b.get_attribute('data-generation') for b in driver.find_elements(By.CSS_SELECTOR,'#generation-options [data-generation]')]
              assert gen_ui == generations
              assert 'unknown' not in [g.lower() for g in gen_ui]
              options=Select(driver.find_element(By.ID,'breeder-filter')).options
              breeder_ui=[(o.get_attribute('value'),o.text.strip()) for o in options[1:]]
              assert breeder_ui == breeder_entries
              assert not (set(v for v,n in breeder_ui) & seedcompany_only)

              if len(generations) >= 2:
                  ga,gb=generations[:2]
                  reset_all(); toggle_gen(ga); report['combinations']['generation_a']=assert_ids(expected(gens=[ga]),'GEN A')
                  reset_all(); toggle_gen(gb); report['combinations']['generation_b']=assert_ids(expected(gens=[gb]),'GEN B')
                  reset_all(); toggle_gen(ga); toggle_gen(gb); report['combinations']['generation_or']=assert_ids(expected(gens=[ga,gb]),'GEN OR')
              reset_all()

              for q in ['Bubble Gum','Wedding Cake','Humboldt CSI','S1','Kush']:
                  set_query(q); report['searches'][q]=assert_ids(expected(query=q),'SEARCH '+q); set_query('')
              set_query('zzzz-no-cultivar-filter-ux-v1')
              assert_ids([], 'ZERO')
              assert driver.find_element(By.ID,'empty').is_displayed()
              assert '該当する品種はありません' in driver.find_element(By.ID,'empty').text
              set_query('')

              reset_all(); click_type('hybrid'); set_query('Kush')
              report['combinations']['hybrid_search']=assert_ids(expected(type_key='hybrid',query='Kush'),'HYBRID+SEARCH')
              assert driver.find_element(By.CSS_SELECTOR,'[data-explore="hybrid"]').get_attribute('aria-pressed')=='true'
              set_query(''); reset_all()

              if 'S1' in generations:
                  toggle_gen('S1'); set_query('Kush')
                  report['combinations']['s1_search']=assert_ids(expected(gens=['S1'],query='Kush'),'S1+SEARCH')
                  assert driver.find_element(By.CSS_SELECTOR,'[data-generation="S1"]').get_attribute('aria-pressed')=='true'
                  set_query(''); reset_all()

              if breeder_entries:
                  beid,bname=breeder_entries[0]
                  set_breeder(beid); report['combinations']['breeder']=assert_ids(expected(breeder=beid),'BREEDER')
                  related=expected(breeder=beid)
                  q=by_id[related[0]]['name'].split()[0] if related else bname.split()[0]
                  set_query(q); report['combinations']['breeder_search']=assert_ids(expected(breeder=beid,query=q),'BREEDER+SEARCH')
                  set_query(''); reset_all()

              c_tg=choose_nonempty(lambda c: any(in_type(c,k) for k in ['sativa','indica','hybrid']) and text((c.get('breeding') or {}).get('generation')).strip() in generations)
              if c_tg:
                  tk=next(k for k in ['sativa','indica','hybrid'] if in_type(c_tg,k)); g=text((c_tg.get('breeding') or {}).get('generation')).strip()
                  click_type(tk); toggle_gen(g); report['combinations']['type_generation']=assert_ids(expected(type_key=tk,gens=[g]),'TYPE+GEN'); reset_all()

              c_tb=choose_nonempty(lambda c: any(in_type(c,k) for k in ['sativa','indica','hybrid']) and bool(breeder_ids(c)))
              if c_tb:
                  tk=next(k for k in ['sativa','indica','hybrid'] if in_type(c_tb,k)); beid=breeder_ids(c_tb)[0]
                  click_type(tk); set_breeder(beid); report['combinations']['type_breeder']=assert_ids(expected(type_key=tk,breeder=beid),'TYPE+BREEDER'); reset_all()

              c_gb=choose_nonempty(lambda c: text((c.get('breeding') or {}).get('generation')).strip() in generations and bool(breeder_ids(c)))
              if c_gb:
                  g=text((c_gb.get('breeding') or {}).get('generation')).strip(); beid=breeder_ids(c_gb)[0]
                  toggle_gen(g); set_breeder(beid); report['combinations']['generation_breeder']=assert_ids(expected(gens=[g],breeder=beid),'GEN+BREEDER'); reset_all()

              c_all=choose_nonempty(lambda c: any(in_type(c,k) for k in ['sativa','indica','hybrid']) and text((c.get('breeding') or {}).get('generation')).strip() in generations and bool(breeder_ids(c)))
              if c_all:
                  tk=next(k for k in ['sativa','indica','hybrid'] if in_type(c_all,k)); g=text((c_all.get('breeding') or {}).get('generation')).strip(); beid=breeder_ids(c_all)[0]; q=c_all['name'].split()[0]
                  click_type(tk); toggle_gen(g); set_breeder(beid); set_query(q)
                  report['combinations']['all_axes']=assert_ids(expected(type_key=tk,gens=[g],breeder=beid,query=q),'ALL AXES')
                  assert driver.find_element(By.CSS_SELECTOR,f'[data-explore="{tk}"]').get_attribute('aria-pressed')=='true'
                  assert driver.find_element(By.CSS_SELECTOR,f'[data-generation="{g}"]').get_attribute('aria-pressed')=='true'

                  clear=driver.find_element(By.ID,'clear-filters'); assert clear.is_enabled(); js('arguments[0].click()',clear); time.sleep(.1)
                  assert driver.find_element(By.ID,'search').get_attribute('value') == q
                  assert driver.find_element(By.CSS_SELECTOR,'[data-explore="all"]').get_attribute('aria-pressed')=='true'
                  assert not driver.find_elements(By.CSS_SELECTOR,'[data-generation].is-active')
                  assert Select(driver.find_element(By.ID,'breeder-filter')).first_selected_option.get_attribute('value')==''
                  assert_ids(expected(query=q),'CLEAR PRESERVES QUERY')
                  set_query('')
              reset_all()
              assert latest_ids()==initial_latest

              for sid,display,g in [('wedding-cake-s1','Wedding Cake','S1'),('bubba-kush-s1','Bubba Kush','S1'),('f1-durb-s1','F1 Durb','S1'),('ak-47','AK-47','F1')]:
                  if sid in by_id:
                      card=driver.find_element(By.CSS_SELECTOR,f'#cultivar-grid [data-strain-id="{sid}"]')
                      assert card.find_element(By.CSS_SELECTOR,'.tile-display-name').text.strip()==display
                      assert card.find_element(By.CSS_SELECTOR,'.generation-badge').text.strip()==g

              reset_all(); card=driver.find_element(By.CSS_SELECTOR,'#cultivar-grid [data-strain-id="wedding-cake"]')
              js("window.scrollTo(0, arguments[0].getBoundingClientRect().top + window.scrollY - 100)", card); time.sleep(.2)
              before=js('return window.scrollY'); js('arguments[0].click()',card)
              wait.until(lambda d: d.find_element(By.ID,'detail-dialog').get_attribute('open') is not None)
              detail=driver.find_element(By.ID,'detail-shell'); detail_text=detail.text
              for token in ['系譜 / LINEAGE','香り / AROMA','テルペン / TERPENE','歴史 / HISTORY','出典 / SOURCES']:
                  assert token in detail_text
              sources=detail.find_elements(By.CSS_SELECTOR,'.detail-sources .detail-toggle'); assert sources
              js('arguments[0].click()',sources[0]); time.sleep(.1)
              assert detail.find_elements(By.CSS_SELECTOR,'.source-detail-link')
              close=detail.find_element(By.CSS_SELECTOR,'.close-detail'); js('arguments[0].click()',close)
              wait.until(lambda d: d.find_element(By.ID,'detail-dialog').get_attribute('open') is None)
              time.sleep(.25); after=js('return window.scrollY'); assert abs(after-before) < 30

              driver.get(BASE + '?strain=wedding-cake&filteruxfinal=' + os.environ.get('GITHUB_RUN_ID','0'))
              wait.until(lambda d: d.find_element(By.ID,'detail-dialog').get_attribute('open') is not None)
              assert '正式登録名: Wedding Cake' in driver.find_element(By.ID,'detail-shell').text

              driver.get(BASE + '?filteruxfinal=footer' + os.environ.get('GITHUB_RUN_ID','0')); wait_loaded()
              footer=driver.find_element(By.CSS_SELECTOR,'#catalog-meta a[href="#cultivars"]'); assert footer.text.strip()=='品種一覧'
              js('arguments[0].click()',footer); wait.until(lambda d: d.execute_script('return location.hash')=='#cultivars')
              target=driver.find_element(By.ID,'cultivars'); assert abs(target.rect['y']-js('return window.scrollY')) < 250

              for width in [390,430]:
                  driver.set_window_size(width,1800); driver.get(BASE + f'?filteruxfinal={width}-' + os.environ.get('GITHUB_RUN_ID','0')); wait_loaded()
                  overflow=js('return document.documentElement.scrollWidth - document.documentElement.clientWidth')
                  assert overflow <= 1, f'overflow {width}: {overflow}'
                  summary=driver.find_element(By.CSS_SELECTOR,'#filter-disclosure summary'); js('arguments[0].click()',summary); time.sleep(.1)
                  assert driver.find_element(By.ID,'filter-disclosure').get_attribute('open') is not None
                  elems=[driver.find_element(By.ID,'search'),driver.find_element(By.ID,'explore'),driver.find_element(By.ID,'generation-options'),driver.find_element(By.ID,'breeder-filter'),driver.find_element(By.ID,'clear-filters')]
                  for e in elems:
                      r=e.rect; assert r['x'] >= -1 and r['x']+r['width'] <= width+1, (width,e.get_attribute('id'),r)
                  for b in driver.find_elements(By.CSS_SELECTOR,'#explore [data-explore]'):
                      assert b.rect['height'] >= 39
                  assert summary.rect['height'] >= 43
                  if driver.find_elements(By.CSS_SELECTOR,'#generation-options [data-generation]'):
                      assert driver.find_elements(By.CSS_SELECTOR,'#generation-options [data-generation]')[0].rect['height'] >= 39
                  assert driver.find_element(By.ID,'breeder-filter').rect['height'] >= 41
                  report['viewports'][str(width)]={'horizontal_overflow':overflow,'type_filter_above_search':driver.find_element(By.ID,'explore').rect['y'] < driver.find_element(By.ID,'search').rect['y']}
                  driver.save_screenshot(str(OUT/f'public-{width}.png'))

              report['robots_meta'] = driver.find_element(By.CSS_SELECTOR,'meta[name="robots"]').get_attribute('content')
              report['latest_ids'] = initial_latest
              report['status']='PASS'
              (OUT/'e2e-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
              (OUT/'PASS').write_text('PASS\n')
          except Exception:
              (OUT/'e2e-failure.txt').write_text(traceback.format_exc())
              raise
          finally:
              driver.quit()
          PY
          python /tmp/filter-ux-v1-final/e2e.py

      - name: Confirm master-migration remained unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master-migration
          git rev-parse origin/master-migration > /tmp/filter-ux-v1-final/master-at-run-end.txt
          test "$(cat /tmp/filter-ux-v1-final/master-at-run-start.txt)" = "$(cat /tmp/filter-ux-v1-final/master-at-run-end.txt)"

      - name: Upload final verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filter-ux-v1-final-live-${{ github.run_id }}
          path: /tmp/filter-ux-v1-final
          if-no-files-found: error

      - name: Remove one-shot final verifier
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status=FAIL
          test -f /tmp/filter-ux-v1-final/PASS && status=PASS
          deploy=none
          test -f /tmp/filter-ux-v1-final/pages-run-id.txt && deploy="$(cat /tmp/filter-ux-v1-final/pages-run-id.txt)"
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          if [ -f .github/workflows/filter-ux-v1-final-live-once.yml ]; then
            git rm .github/workflows/filter-ux-v1-final-live-once.yml
            git config user.name filter-ux-v1-final-bot
            git config user.email actions@users.noreply.github.com
            git commit -m "Remove FILTER UX V1 final verifier run ${GITHUB_RUN_ID} deploy ${deploy} ${status} [skip ci]"
            git push origin HEAD:main
          fi
