name: Cross-Provider Google Retry Observer

on:
  push:
    branches: [master-migration]
    paths: ['.github/workflows/cross-provider-google-retry-observer.yml']

permissions:
  contents: write
  actions: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_HEAD: 7d3f1b0a8c8acb50f61e28944bf9eefd7648a66a
      TARGET_WORKFLOW: cross-provider-google-architecture-retry.yml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master-migration
          fetch-depth: 1
      - name: Wait for Google retry and record metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os,json,time,urllib.request
          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']; target=os.environ['TARGET_HEAD']; wf=os.environ['TARGET_WORKFLOW']
          url=f'https://api.github.com/repos/{repo}/actions/workflows/{wf}/runs?event=push&per_page=20'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          found=None
          for _ in range(200):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: j=json.load(r)
              matches=[x for x in j.get('workflow_runs',[]) if x.get('head_sha')==target]
              if matches:
                  found=matches[0]
                  if found.get('status')=='completed': break
              time.sleep(8)
          if not found: raise SystemExit('target Google retry run not found')
          out={k:found.get(k) for k in ('id','name','head_sha','status','conclusion','html_url','created_at','updated_at','run_number','run_attempt')}
          out['artifactName']=f"cross-provider-google-architecture-retry-{found['id']}"
          os.makedirs('docs/benchmark-results',exist_ok=True)
          with open('docs/benchmark-results/cross-provider-google-retry-run-latest.json','w') as f: json.dump(out,f,indent=2); f.write('\n')
          print(json.dumps(out))
          PY
      - name: Commit observer record
        shell: bash
        run: |
          git config user.name strain-atlas-image-benchmark-observer
          git config user.email actions@users.noreply.github.com
          git add docs/benchmark-results/cross-provider-google-retry-run-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '[IMAGE V2] Record Google retry benchmark run id'
          git push origin HEAD:master-migration
