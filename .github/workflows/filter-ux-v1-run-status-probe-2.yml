name: FILTER UX V1 Run Status Probe 2
"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/filter-ux-v1-run-status-probe-2.yml"
permissions:
  contents: write
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh run status
        shell: bash
        run: |
          set -euo pipefail
          gh run list --limit 20 --json databaseId,name,workflowName,headSha,status,conclusion,event,createdAt,url > .github/filter-ux-v1-run-status.json
          git config user.name filter-ux-v1-probe-bot
          git config user.email actions@users.noreply.github.com
          git add .github/filter-ux-v1-run-status.json
          git commit -m "Refresh FILTER UX V1 run status [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Remove probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          git rm .github/workflows/filter-ux-v1-run-status-probe-2.yml
          git config user.name filter-ux-v1-probe-bot
          git config user.email actions@users.noreply.github.com
          git commit -m "Remove FILTER UX V1 second run probe [skip ci]"
          git push origin HEAD:main
