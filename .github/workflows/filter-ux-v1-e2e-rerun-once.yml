name: FILTER UX V1 E2E Rerun Once
"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/filter-ux-v1-e2e-rerun-once.yml"
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PUBLIC_URL: https://blazea-x.github.io/strain-atlas/
      CATALOG_URL: https://raw.githubusercontent.com/Blazea-x/strain-atlas/master-migration/runtime/catalog.json
      PUBLICATION_URL: https://raw.githubusercontent.com/Blazea-x/strain-atlas/master-migration/production/publication.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record immutable data head
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/filter-ux-v1-e2e-rerun
          git fetch origin master-migration
          git rev-parse origin/master-migration > /tmp/filter-ux-v1-e2e-rerun/master-start.txt
      - name: Install browser runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q selenium
          command -v google-chrome
          command -v chromedriver
      - name: Run corrected public E2E
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/filter-ux-v1-e2e-rerun/e2e.py.gz.b64 <<'B64'

B64
          base64 -d /tmp/filter-ux-v1-e2e-rerun/e2e.py.gz.b64 | gzip -dc > /tmp/filter-ux-v1-e2e-rerun/e2e.py
          python /tmp/filter-ux-v1-e2e-rerun/e2e.py
      - name: Verify data head unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master-migration
          git rev-parse origin/master-migration > /tmp/filter-ux-v1-e2e-rerun/master-end.txt
          test "$(cat /tmp/filter-ux-v1-e2e-rerun/master-start.txt)" = "$(cat /tmp/filter-ux-v1-e2e-rerun/master-end.txt)"
      - name: Upload E2E artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filter-ux-v1-e2e-rerun-${{ github.run_id }}
          path: /tmp/filter-ux-v1-e2e-rerun
          if-no-files-found: error
      - name: Remove one-shot E2E rerun
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status=FAIL
          test -f /tmp/filter-ux-v1-e2e-rerun/PASS && status=PASS
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          if [ -f .github/workflows/filter-ux-v1-e2e-rerun-once.yml ]; then
            git rm .github/workflows/filter-ux-v1-e2e-rerun-once.yml
            git config user.name filter-ux-v1-e2e-rerun-bot
            git config user.email actions@users.noreply.github.com
            git commit -m "Remove FILTER UX V1 E2E rerun ${GITHUB_RUN_ID} ${status} [skip ci]"
            git push origin HEAD:main
          fi
