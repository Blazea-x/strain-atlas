name: IMAGE V2 Kali Mist AI Horde Model Benchmark

on:
  push:
    branches: [master-migration]
    paths: ['.github/workflows/image-model-benchmark-kali-mist.yml']

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master-migration
          fetch-depth: 1
      - run: python -m pip install --disable-pip-version-check --no-cache-dir 'requests>=2.31,<3' 'Pillow>=10,<12'
      - name: Run 5-model x 2-seed benchmark
        env:
          AI_HORDE_KEY: '0000000000'
        shell: bash
        run: |
          python - <<'PY'
          import requests,json,time,hashlib,io,base64,os,re
          from pathlib import Path
          from PIL import Image
          from concurrent.futures import ThreadPoolExecutor,as_completed

          BASE='https://aihorde.net/api/v2'; KEY='0000000000'; OUT=Path('benchmark-artifact'); OUT.mkdir()
          mp=Path('production/manifests/kali-mist.json'); before=hashlib.sha256(mp.read_bytes()).hexdigest(); m=json.loads(mp.read_text())
          assert m['strainId']=='kali-mist' and m['revision']==1 and m['attempt']==1 and m['approvalStatus']=='pending'
          assert m['visualPreparationHash']=='0c038a0ae42544a1137574a7635255424937c06684cd6240931ac1d8ce27011d'
          prompt=m['promptSnapshot']; evidence=m['evidenceSnapshot']
          common='photorealistic botanical reference photograph, single mature living female cannabis plant, botanically plausible morphology, cultivar-specific plant architecture clearly visible, mature female flowers clearly visible, natural branching, internodes and leaf arrangement, realistic cannabis inflorescences, single continuous photographic frame, neutral non-distracting background'
          negative='illustration, painting, anime, cartoon, collage, split panel, text, watermark, logo, packaging, people, smoke, artificial plastic flowers, cotton-like flowers, brush-like flowers, repeated identical cone flowers'
          final=f"{prompt}\n\n{common} ### {negative}"
          sess=requests.Session(); sess.headers.update({'apikey':KEY,'Client-Agent':'CannabisStrainsWisdom-ModelBenchmark:1.0:github.com/Blazea-x/strain-atlas','Accept':'application/json'})
          hb=sess.get(BASE+'/status/heartbeat',timeout=30); hb.raise_for_status(); modes=sess.get(BASE+'/status/modes',timeout=30); modes.raise_for_status();
          if modes.json().get('maintenance_mode'): raise SystemExit('AI Horde maintenance mode')
          live=sess.get(BASE+'/status/models?type=image',timeout=30); live.raise_for_status(); live=[x for x in live.json() if int(x.get('count') or 0)>0]
          pos={'icbinp':12,'photo':10,'photograph':10,'realistic':9,'realism':9,'epicrealism':10,'juggernaut':7,'photon':7,'analog':6,'cyberrealistic':8,'majicmix':6,'deliberate':5,'dreamshaper':4,'albedo':5}
          neg=['anime','pony','furry','hentai','cartoon','comic','pixel','logo','waifu','illustration','disney','manga','nsfw']
          def score(x):
            n=x['name'].lower(); s=sum(v for k,v in pos.items() if k in n); s+=min(int(x.get('count') or 0),10)*0.15
            if any(k in n for k in neg): s-=50
            return s
          ranked=sorted(live,key=lambda x:(score(x),int(x.get('count') or 0)),reverse=True)
          selected=[x for x in ranked if score(x)>0][:5]
          if len(selected)<5:
            for x in ranked:
              if x not in selected and not any(k in x['name'].lower() for k in neg): selected.append(x)
              if len(selected)==5: break
          if len(selected)<5: raise SystemExit(f'Only {len(selected)} suitable live image models found')
          models=[x['name'] for x in selected]
          (OUT/'model-selection.json').write_text(json.dumps({'selected':selected,'availableLiveModelCount':len(live),'selectionMethod':'current live worker availability + photography/realism name capability heuristic; anime/illustration-specialist exclusions'},indent=2,ensure_ascii=False))
          params_base={'cfg_scale':7,'sampler_name':'k_euler_a','height':768,'width':512,'steps':24,'n':1}
          tasks=[]; seeds=[104729,130363]
          for mi,model in enumerate(models):
            for si,seed in enumerate(seeds):
              p=dict(params_base); p['seed']=str(seed+mi*1000)
              payload={'prompt':final,'params':p,'models':[model],'nsfw':False,'censor_nsfw':True,'r2':True,'shared':False,'slow_workers':True,'dry_run':False}
              t0=time.monotonic(); r=sess.post(BASE+'/generate/async',json=payload,timeout=30); r.raise_for_status(); gid=r.json().get('id')
              if not gid: raise RuntimeError('missing generation id')
              tasks.append({'model':model,'modelIndex':mi+1,'seedIndex':si+1,'seedRequested':p['seed'],'gid':gid,'submittedMono':t0,'submittedAt':time.time()})
              time.sleep(0.35)
          (OUT/'submitted.json').write_text(json.dumps(tasks,indent=2,ensure_ascii=False))

          def one(t):
            s=requests.Session(); s.headers.update({'apikey':KEY,'Client-Agent':'CannabisStrainsWisdom-ModelBenchmark:1.0:github.com/Blazea-x/strain-atlas','Accept':'application/json'})
            start=t['submittedMono']; seen=False; deadline=time.monotonic()+1500
            while time.monotonic()<deadline:
              c=s.get(BASE+'/generate/check/'+t['gid'],timeout=30); c.raise_for_status(); j=c.json()
              if j.get('faulted'): raise RuntimeError('faulted')
              if int(j.get('processing') or 0)>0 or int(j.get('finished') or 0)>0: seen=True
              if j.get('done'): break
              if not seen and time.monotonic()-start>900: raise TimeoutError('queue timeout')
              time.sleep(5)
            else: raise TimeoutError('generation timeout')
            st=s.get(BASE+'/generate/status/'+t['gid'],timeout=30); st.raise_for_status(); gs=st.json().get('generations') or []
            if len(gs)!=1: raise RuntimeError(f'expected one generation got {len(gs)}')
            g=gs[0]; ref=g.get('img')
            if ref.startswith(('http://','https://')):
              rr=s.get(ref,timeout=60); rr.raise_for_status(); data=rr.content
            else: data=base64.b64decode(ref,validate=True)
            with Image.open(io.BytesIO(data)) as im: im.verify()
            with Image.open(io.BytesIO(data)) as im: w,h,fmt=im.width,im.height,im.format
            ext={'JPEG':'jpg','PNG':'png','WEBP':'webp'}.get(fmt.upper(),'img'); safe=re.sub(r'[^A-Za-z0-9._-]+','_',t['model'])[:70]
            fn=f"model-{t['modelIndex']:02d}__{safe}__seed-{t['seedIndex']}__{g.get('seed')}.{ext}"
            (OUT/fn).write_bytes(data)
            return {**t,'status':'success','file':fn,'modelReturned':g.get('model'),'seedReturned':g.get('seed'),'jobId':g.get('id'),'workerId':g.get('worker_id'),'workerName':g.get('worker_name'),'elapsedSeconds':round(time.monotonic()-start,1),'byteLength':len(data),'sha256':hashlib.sha256(data).hexdigest(),'dimensions':{'width':w,'height':h},'format':fmt}
          results=[]
          with ThreadPoolExecutor(max_workers=10) as ex:
            fut={ex.submit(one,t):t for t in tasks}
            for f in as_completed(fut):
              t=fut[f]
              try: r=f.result(); print('DONE',r['modelReturned'],r['seedReturned'],r['elapsedSeconds'],r['sha256'],flush=True); results.append(r)
              except Exception as e: results.append({**t,'status':'failed','error':repr(e),'elapsedSeconds':round(time.monotonic()-t['submittedMono'],1)}); print('FAIL',t['model'],e,flush=True)
          results.sort(key=lambda x:(x['modelIndex'],x['seedIndex']))
          after=hashlib.sha256(mp.read_bytes()).hexdigest(); assert before==after
          protected=os.popen("git status --porcelain -- strains production runtime UPLOAD_IMAGES_HERE").read().strip(); assert not protected
          summary={'benchmark':'Kali Mist AI Horde Model Benchmark','status':'COMPLETE' if sum(x['status']=='success' for x in results)==10 else 'INCOMPLETE','humanModelSelection':'REQUIRED','productionPromotion':'NOT PERFORMED','productionMutationCount':0,'mainMutationCount':0,'manifestRevision':m['revision'],'attempt':m['attempt'],'visualPreparationHash':m['visualPreparationHash'],'promptSnapshotSha256':hashlib.sha256(prompt.encode()).hexdigest(),'evidenceSnapshotSha256':hashlib.sha256(json.dumps(evidence,sort_keys=True,separators=(',',':')).encode()).hexdigest(),'models':models,'results':results}
          (OUT/'benchmark-summary.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False))
          print(json.dumps(summary,ensure_ascii=False))
          PY
      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kali-mist-model-benchmark-${{ github.run_id }}
          path: benchmark-artifact/
          if-no-files-found: error
          retention-days: 14
