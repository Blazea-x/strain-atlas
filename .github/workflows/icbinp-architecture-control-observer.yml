name: ICBINP Architecture Control Test Observer

on:
  push:
    branches: [master-migration]
    paths: ['.github/workflows/icbinp-architecture-control-observer.yml']

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {ref: master-migration, fetch-depth: 1, persist-credentials: true}
      - name: Discover retry run, expose status, then wait for completion
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: bf7dbee110254f74a8c7e63fd9822f5548470846
          OBSERVER_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          git config user.name 'strain-atlas-image-benchmark-observer'
          git config user.email 'actions@users.noreply.github.com'
          python - <<'PY'
          import json,os,time,urllib.request,subprocess
          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']; target=os.environ['TARGET_SHA']
          url=f'https://api.github.com/repos/{repo}/actions/workflows/icbinp-architecture-control-retry-a.yml/runs?branch=master-migration&event=push&per_page=20'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def fetch():
            req=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          data=fetch(); runs=data.get('workflow_runs',[]); matches=[x for x in runs if x.get('head_sha')==target]
          found=max(matches,key=lambda x:x['id']) if matches else None
          os.makedirs('docs/benchmark-results',exist_ok=True)
          discovery={'observerRunId':int(os.environ['OBSERVER_RUN_ID']),'targetHeadSha':target,'targetRunFound':bool(found),'targetRun':None if not found else {'runId':found['id'],'name':found.get('name'),'headSha':found.get('head_sha'),'status':found.get('status'),'conclusion':found.get('conclusion'),'htmlUrl':found.get('html_url'),'createdAt':found.get('created_at'),'updatedAt':found.get('updated_at')}}
          open('docs/benchmark-results/icbinp-architecture-control-retry-discovery.json','w').write(json.dumps(discovery,indent=2)+'\n')
          subprocess.run(['git','add','docs/benchmark-results/icbinp-architecture-control-retry-discovery.json'],check=True)
          subprocess.run(['git','commit','-m','[IMAGE V2] Expose architecture retry run discovery'],check=True)
          subprocess.run(['git','push','origin','HEAD:master-migration'],check=True)
          if not found: raise SystemExit('architecture retry run not found')
          for _ in range(280):
            data=fetch(); matches=[x for x in data.get('workflow_runs',[]) if x.get('head_sha')==target]
            if matches:
              found=max(matches,key=lambda x:x['id'])
              if found.get('status')=='completed': break
            time.sleep(8)
          if not found or found.get('status')!='completed': raise SystemExit('architecture retry run did not complete')
          out={'runId':found['id'],'name':found.get('name'),'headSha':found.get('head_sha'),'status':found.get('status'),'conclusion':found.get('conclusion'),'htmlUrl':found.get('html_url'),'createdAt':found.get('created_at'),'updatedAt':found.get('updated_at')}
          open('docs/benchmark-results/icbinp-architecture-control-retry-run-latest.json','w').write(json.dumps(out,indent=2)+'\n')
          subprocess.run(['git','add','docs/benchmark-results/icbinp-architecture-control-retry-run-latest.json'],check=True)
          subprocess.run(['git','commit','-m','[IMAGE V2] Record ICBINP architecture retry run id'],check=True)
          subprocess.run(['git','push','origin','HEAD:master-migration'],check=True)
          print(json.dumps(out))
          PY
          test -z "$(git status --porcelain -- strains production runtime UPLOAD_IMAGES_HERE)"
