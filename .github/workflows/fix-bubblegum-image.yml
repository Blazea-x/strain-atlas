name: Fix Bubble Gum primary image

on:
  push:
    branches: [master-migration]
    paths:
      - '.github/workflows/fix-bubblegum-image.yml'

permissions:
  contents: write

jobs:
  rebuild-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: master-migration

      - name: Reconstruct and verify Bubble Gum image
        run: |
          cat .image-transfer/bubble-gum/part-*.b64 | base64 -d > strains/bubble-gum/images/generated/primary.webp
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('strains/bubble-gum/images/generated/primary.webp')
          data=p.read_bytes()
          assert len(data)==21278, len(data)
          assert hashlib.sha256(data).hexdigest()=='e51debbdf91b3b991e11512c5eba6dbb87bb4be77fb9214274e73e62a1710b07'
          assert data[:4]==b'RIFF' and data[8:12]==b'WEBP'
          print('Bubble Gum image verified:', len(data), hashlib.sha256(data).hexdigest())
          PY
          file strains/bubble-gum/images/generated/primary.webp

      - name: Commit verified image
        run: |
          git config user.name 'strain-atlas-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add strains/bubble-gum/images/generated/primary.webp
          git commit -m 'Fix Bubble Gum primary image binary'
          git push origin HEAD:master-migration
