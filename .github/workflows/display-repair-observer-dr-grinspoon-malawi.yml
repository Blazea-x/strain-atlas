name: Display Repair Observer - Dr Grinspoon Generation

on:
  push:
    branches: [master-migration]
    paths:
      - .github/workflows/display-repair-observer-dr-grinspoon-malawi.yml

permissions:
  actions: read
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_HEAD: 66559c32eb73bd59e5e95f8f24a4a24eff7d4714
      WORKFLOW_FILE: display-repair-generate-dr-grinspoon.yml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master-migration
          fetch-depth: 0
      - name: Wait for exact generation run and record metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; target=os.environ['TARGET_HEAD']; workflow=os.environ['WORKFLOW_FILE']
          api='https://api.github.com'; headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get_json(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          run=None
          for _ in range(120):
              data=get_json(f'{api}/repos/{repo}/actions/workflows/{workflow}/runs?branch=master-migration&per_page=20')
              matches=[x for x in data.get('workflow_runs',[]) if x.get('head_sha')==target and x.get('event')=='push']
              if matches:
                  run=matches[0]
                  if run.get('status')=='completed': break
              time.sleep(10)
          out=Path('.display-repair-staging'); out.mkdir(exist_ok=True)
          if not run or run.get('status')!='completed':
              marker={'status':'OBSERVER_TIMEOUT','targetHead':target}
          else:
              arts=get_json(f'{api}/repos/{repo}/actions/runs/{run["id"]}/artifacts').get('artifacts',[])
              marker={'status':'GENERATION_COMPLETED','runId':run['id'],'conclusion':run.get('conclusion'),'headSha':run.get('head_sha'),'artifactCount':len(arts)}
              if arts:
                  marker.update({'artifactId':arts[0]['id'],'artifactName':arts[0]['name']})
          (out/'dr-generation-observer.json').write_text(json.dumps(marker,indent=2)+'\n')
          print(json.dumps(marker))
          PY
      - name: Commit observer metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name strain-atlas-display-repair
          git config user.email actions@users.noreply.github.com
          git add .display-repair-staging/dr-generation-observer.json
          git commit -m "[DISPLAY REPAIR] Record Dr Grinspoon generation run"
          git pull --rebase origin master-migration
          git push origin HEAD:master-migration
