name: Display Repair Observer - Dr Grinspoon + Malawi

on:
  push:
    branches: [master-migration]
    paths:
      - .github/workflows/display-repair-observer-dr-grinspoon-malawi.yml

permissions:
  actions: read
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PREFLIGHT_HEAD: 135e602642d1b9ebd1d1a5bf789a123e37aefb1d
      WORKFLOW_FILE: display-repair-preflight-dr-grinspoon-malawi.yml
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master-migration
          fetch-depth: 0

      - name: Wait for exact preflight run and stage its artifact
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io, json, os, time, urllib.request, zipfile
          from pathlib import Path

          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          target=os.environ['PREFLIGHT_HEAD']
          workflow=os.environ['WORKFLOW_FILE']
          api='https://api.github.com'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get_json(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.load(r)
          run=None
          for _ in range(120):
              data=get_json(f'{api}/repos/{repo}/actions/workflows/{workflow}/runs?branch=master-migration&per_page=20')
              matches=[x for x in data.get('workflow_runs',[]) if x.get('head_sha')==target and x.get('event')=='push']
              if matches:
                  run=matches[0]
                  if run.get('status')=='completed': break
              time.sleep(10)
          if not run or run.get('status')!='completed':
              raise RuntimeError('Exact preflight run did not complete within observer window')
          artifacts=get_json(f'{api}/repos/{repo}/actions/runs/{run["id"]}/artifacts')
          if len(artifacts.get('artifacts',[]))!=1:
              raise RuntimeError(f'Expected exactly one preflight artifact, got {len(artifacts.get("artifacts",[]))}')
          art=artifacts['artifacts'][0]
          req=urllib.request.Request(f'{api}/repos/{repo}/actions/artifacts/{art["id"]}/zip',headers=headers)
          with urllib.request.urlopen(req,timeout=60) as r:
              z=zipfile.ZipFile(io.BytesIO(r.read()))
              out=Path('.display-repair-staging')
              out.mkdir(exist_ok=True)
              z.extractall(out)
          marker={
              'preflightRunId':run['id'],'preflightRunConclusion':run.get('conclusion'),
              'preflightHeadSha':run.get('head_sha'),'artifactId':art['id'],'artifactName':art['name']
          }
          (Path('.display-repair-staging')/'observer.json').write_text(json.dumps(marker,indent=2)+'\n')
          if run.get('conclusion')!='success':
              raise RuntimeError(f'Preflight conclusion was {run.get("conclusion")}')
          print(json.dumps(marker))
          PY

      - name: Commit staging artifact for visual inspection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name strain-atlas-display-repair
          git config user.email actions@users.noreply.github.com
          git add .display-repair-staging
          test -f .display-repair-staging/preflight-summary.json
          test -f .display-repair-staging/dr-grinspoon.jpg
          test -f .display-repair-staging/malawi-recovered.webp
          git commit -m "[DISPLAY REPAIR] Stage reviewed candidates"
          git push origin HEAD:master-migration
