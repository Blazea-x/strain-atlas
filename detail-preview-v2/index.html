<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#06100c">
<title>Cannabis Strain Wisdom | Detail Preview V2</title>
<style>
:root{--bg:#06100c;--panel:rgba(7,20,14,.64);--text:#eef3ef;--muted:#829089;--gold:#d5bc72;--line:rgba(255,255,255,.07)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100dvh;background:radial-gradient(circle at 50% -10%,rgba(38,75,50,.18),transparent 35%),#06100c}.shell{width:min(100%,560px);margin:0 auto;padding-bottom:40px}.previewbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:rgba(4,14,9,.88);border-bottom:1px solid rgba(255,255,255,.06);backdrop-filter:blur(18px)}.previewbar strong{font-size:10px;letter-spacing:.15em;color:#b9c5bd}.switcher{display:flex;gap:5px;overflow-x:auto;padding:8px 10px 9px;scrollbar-width:none;border-bottom:1px solid rgba(255,255,255,.045)}.switcher::-webkit-scrollbar{display:none}.switcher button{flex:0 0 auto;border:1px solid rgba(255,255,255,.08);border-radius:999px;background:rgba(255,255,255,.025);color:#9aa9a0;padding:6px 9px;font-size:8px;font-weight:750}.switcher button.active{border-color:rgba(213,188,114,.28);background:rgba(213,188,114,.08);color:#ead79c}.hero{position:relative}.hero img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#0b1711}.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(transparent,rgba(6,16,11,.96))}.hero-copy{position:relative;z-index:2;margin-top:-54px;padding:0 18px 17px}.hero-copy h1{margin:0;font-size:28px;line-height:1.08;letter-spacing:-.03em}.hero-copy p{margin:8px 0 0;color:#87988e;font-size:10px;letter-spacing:.03em}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;padding:8px 12px}.card{--accent:120,150,130;position:relative;overflow:hidden;border:1px solid rgba(var(--accent),.18);border-radius:15px;background:linear-gradient(145deg,rgba(var(--accent),.095),rgba(var(--accent),.018) 44%,rgba(4,14,9,.62)),rgba(7,20,14,.48);box-shadow:inset 0 1px 0 rgba(255,255,255,.055),0 8px 25px rgba(0,0,0,.10);backdrop-filter:blur(19px) saturate(118%)}.card:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 94% 3%,rgba(var(--accent),.23),transparent 31%);opacity:.72}.card:after{content:"";position:absolute;left:0;top:14px;bottom:14px;width:2px;border-radius:2px;background:rgba(var(--accent),.72);box-shadow:0 0 14px rgba(var(--accent),.38)}.card.static{min-height:54px;padding:10px 11px}.card.wide{grid-column:1/-1}.card.entity,.card.origin{min-height:60px}.card.sensory{min-height:68px}.card.lineage{--accent:207,163,79}.card.aroma{--accent:182,106,139}.card.terpene{--accent:83,166,176}.card.history{--accent:142,118,185}.card.type{--accent:77,168,144}.card.generation{--accent:166,139,195}.card.entity{--accent:91,138,181}.card.origin{--accent:87,153,119}.card.sources{--accent:206,171,91}.label{position:relative;z-index:2;color:rgb(var(--accent));font-size:7px;font-weight:900;letter-spacing:.18em}.value{position:relative;z-index:2;margin-top:6px;font-size:12px;font-weight:780;line-height:1.38}.mini .value{font-size:13px}.meta{position:relative;z-index:2;margin-top:5px;color:#85928b;font-size:7.5px;line-height:1.4}.chips{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.chip{padding:4px 7px;border:1px solid rgba(var(--accent),.24);border-radius:999px;background:rgba(var(--accent),.075);color:#d6dfda;font-size:8px}.actionable{grid-column:1/-1;padding:11px 62px 11px 12px;min-height:78px}.actionable .value{font-size:13px}.detail-rail{position:absolute;z-index:4;right:0;top:0;bottom:0;width:54px;min-height:54px;border:0;border-left:1px solid rgba(var(--accent),.22);background:linear-gradient(180deg,rgba(var(--accent),.11),rgba(var(--accent),.035));color:rgb(var(--accent));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.detail-rail small{font-size:5.5px;font-weight:900;letter-spacing:.14em}.detail-rail b{font-size:23px;line-height:.8;font-weight:400;transition:transform .16s ease}.actionable.open .detail-rail b{transform:rotate(90deg)}.actionable.open{border-color:rgba(var(--accent),.34);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 0 24px rgba(var(--accent),.08)}.deep{position:relative;z-index:2;display:none;margin-top:10px;padding-top:9px;border-top:1px solid rgba(var(--accent),.14);color:#c0cbc4;font-size:10px;line-height:1.72}.actionable.open .deep{display:block}.confidence{display:inline-flex;align-items:center;gap:5px;margin-left:5px;color:#92a097;font-size:7px;font-weight:750}.confidence i{width:5px;height:5px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}.confidence.a{color:#9ec6a0}.confidence.b{color:#c2aa76}.confidence.c{color:#ae9885}.confidence.unknown{color:#74827a}.footer-meta{padding:3px 14px 8px;color:#53635a;font-size:6.5px;text-align:right;letter-spacing:.08em}.empty{padding:30px;text-align:center;color:#89968f}@media(min-width:700px){.grid{gap:9px;padding:10px 16px}.hero-copy{padding-left:22px;padding-right:22px}}
</style>
</head>
<body>
<div class="shell">
<header class="previewbar"><strong>DETAIL UX PREVIEW V2</strong><span id="state" style="font-size:7px;color:#718078">LOADING</span></header>
<div class="switcher" id="switcher"></div>
<main id="view"><div class="empty">読み込み中…</div></main>
</div>
<script>
const DATA='https://raw.githubusercontent.com/Blazea-x/strain-atlas/master-migration/runtime/catalog.json';
const ASSET='https://raw.githubusercontent.com/Blazea-x/strain-atlas/master-migration/';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const typeLabel={sativa:'SATIVA','indica':'INDICA',hybrid:'HYBRID','sativa-dominant-hybrid':'SATIVA系 HYBRID','indica-dominant-hybrid':'INDICA系 HYBRID','balanced-hybrid':'BALANCED HYBRID',unknown:'UNKNOWN'};
const roleLabel={originator:'ORIGINATOR',breeder:'BREEDER',seedCompany:'SEED COMPANY',producer:'PRODUCER',brand:'BRAND',distributor:'DISTRIBUTOR'};
let catalog,current='super-lemon-haze';
const evidence=c=>{if(!c||c.status==='unknown')return '<span class="confidence unknown"><i></i>UNKNOWN</span>';const cl=(c.confidence||'').toLowerCase();return `<span class="confidence ${cl}"><i></i>${esc((c.status||'').toUpperCase())} / ${esc(c.confidence||'')}</span>`};
const chips=(items)=>items?.length?`<div class="chips">${items.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`:'<div class="meta">未確認</div>';
const card=(cls,label,value,meta='')=>`<section class="card static ${cls}"><div class="label">${label}</div><div class="value">${value}</div>${meta?`<div class="meta">${meta}</div>`:''}</section>`;
function actionCard(cls,label,summary,deep,meta=''){
 const id='d-'+Math.random().toString(36).slice(2,9);
 return `<section class="card actionable ${cls}" data-action-card><div class="label">${label}</div><div class="value">${summary}</div>${meta?`<div class="meta">${meta}</div>`:''}<button class="detail-rail" type="button" aria-expanded="false" aria-controls="${id}" data-open><small>DETAIL</small><b>›</b></button><div class="deep" id="${id}">${deep}</div></section>`;
}
function render(id){
 current=id; const c=catalog.cultivars.find(x=>x.id===id); if(!c)return;
 document.querySelectorAll('.switcher button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
 const visual=(c.visuals||[]).find(v=>v.role==='primary')||(c.visuals||[])[0];
 const entities=(c.relations||[]).map(r=>{const e=catalog.entities?.[r.entityId];return e?`${esc(e.name)} <small style="color:#7f8e86;font-size:7px">${esc((r.roles||[]).map(x=>roleLabel[x]||x).join(' / '))}</small> ${evidence(r)}`:''}).filter(Boolean).join('<br>')||'未確認';
 const lineageNote=c.lineage?.note||''; const lineageSummary=esc(c.lineage?.display||'未確認');
 const lineageCard=lineageNote.length>110?actionCard('lineage','LINEAGE',lineageSummary,esc(lineageNote),evidence(c.lineage)):card('wide lineage','LINEAGE',lineageSummary,`${evidence(c.lineage)}${lineageNote?`<div style="margin-top:5px;color:#aebbb3;font-size:8.5px;line-height:1.55">${esc(lineageNote)}</div>`:''}`);
 const historyText=c.history?.text||''; const historyNote=c.history?.note||''; const historyDeep=[historyText,historyNote].filter(Boolean).join(' ');
 const historyCard=!historyText?'':historyDeep.length>125?actionCard('history','HISTORY',esc(historyText.length>90?historyText.slice(0,90)+'…':historyText),esc(historyDeep),evidence(c.history)):card('wide history','HISTORY',esc(historyText),evidence(c.history));
 const origin=c.origin?card('wide origin','ORIGIN',esc(c.origin.text||'未確認'),evidence(c.origin)):'';
 const sourceIds=[...(c.lineage?.sourceRefs||[]),...(c.aromas?.sourceRefs||[]),...(c.terpenes?.sourceRefs||[]),...(c.origin?.sourceRefs||[]),...(c.history?.sourceRefs||[]),...(c.relations||[]).flatMap(r=>r.sourceRefs||[])];
 const uniq=[...new Set(sourceIds)]; const srcs=uniq.map(x=>catalog.sources?.[x]).filter(Boolean);
 const sourceDeep=srcs.length?srcs.map(s=>`<div style="margin:0 0 9px"><a href="${esc(s.url)}" target="_blank" rel="noopener" style="color:#d8c17c;text-decoration:none;font-weight:750">${esc(s.publisher)} / ${esc(s.title)}</a><div style="color:#708078;font-size:7px;margin-top:2px">${esc(s.sourceType)} · checked ${esc(s.checkedAt)}</div></div>`).join(''):'出典なし';
 const sourceCard=actionCard('sources','SOURCES',`${srcs.length} SOURCES`,sourceDeep,'EVIDENCE');
 document.getElementById('view').innerHTML=`<section class="hero">${visual?`<img src="${ASSET+esc(visual.src)}" alt="${esc(visual.alt||'')}">`:''}</section><div class="hero-copy"><h1>${esc(c.name)}</h1><p>${c.jp?esc(c.jp):'日本語表記は現在未確認'} ・ ${esc((c.status||'').toUpperCase())}</p></div><div class="grid">${card('mini type','TYPE',esc(typeLabel[c.classification?.type]||c.classification?.type||'UNKNOWN'))}${card('mini generation','GENERATION',esc(c.breeding?.generation||'unknown'))}${card('wide entity','BREEDER / ENTITY',entities)}${origin}${lineageCard}${`<section class="card static wide sensory aroma"><div class="label">AROMA</div>${chips(c.aromas?.items||[])}<div class="meta">${evidence(c.aromas)}</div></section>`}${`<section class="card static wide sensory terpene"><div class="label">TERPENE</div>${chips(c.terpenes?.items||[])}<div class="meta">${evidence(c.terpenes)}</div></section>`}${historyCard}</div><div class="footer-meta">UPDATED ${esc(c.updatedAt||'-')} · CHECKED ${esc(c.checkedAt||'-')}</div><div class="grid" style="padding-top:0">${sourceCard}</div>`;
 document.querySelectorAll('[data-open]').forEach(btn=>btn.addEventListener('click',()=>{const card=btn.closest('[data-action-card]');const open=!card.classList.contains('open');document.querySelectorAll('[data-action-card].open').forEach(x=>{x.classList.remove('open');x.querySelector('[data-open]')?.setAttribute('aria-expanded','false')});card.classList.toggle('open',open);btn.setAttribute('aria-expanded',open?'true':'false')}));
}
fetch(DATA).then(r=>r.json()).then(data=>{catalog=data;document.getElementById('state').textContent='READY';const sw=document.getElementById('switcher');sw.innerHTML=data.cultivars.map(c=>`<button type="button" data-id="${esc(c.id)}">${esc(c.name)}</button>`).join('');sw.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>render(b.dataset.id)));render(data.cultivars.some(c=>c.id===current)?current:data.cultivars[0].id)}).catch(e=>{document.getElementById('state').textContent='ERROR';document.getElementById('view').innerHTML='<div class="empty">データを読み込めませんでした。</div>'});
</script>
</body>
</html>
