<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#06100c">
<title>Cannabis Strain Wisdom | Detail Preview V2</title>
<style>
:root{--bg:#06100c;--text:#eef3ef;--muted:#829089;--gold:#d5bc72}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100dvh;background:radial-gradient(circle at 50% -10%,rgba(38,75,50,.20),transparent 35%),#06100c}.shell{width:min(100%,560px);margin:0 auto;padding-bottom:40px}.previewbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;background:rgba(4,14,9,.88);border-bottom:1px solid rgba(255,255,255,.06);backdrop-filter:blur(18px)}.previewbar strong{font-size:11px;letter-spacing:.15em;color:#c7d1cb}.switcher{display:flex;gap:6px;overflow-x:auto;padding:9px 10px 10px;scrollbar-width:none;border-bottom:1px solid rgba(255,255,255,.045)}.switcher::-webkit-scrollbar{display:none}.switcher button{flex:0 0 auto;border:1px solid rgba(255,255,255,.08);border-radius:999px;background:rgba(255,255,255,.025);color:#a8b4ad;padding:7px 10px;font-size:10px;font-weight:760}.switcher button.active{border-color:rgba(213,188,114,.38);background:rgba(213,188,114,.12);color:#f1d891}.hero{position:relative}.hero img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#0b1711}.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(transparent,rgba(6,16,11,.96))}.hero-copy{position:relative;z-index:2;margin-top:-58px;padding:0 18px 18px}.hero-copy h1{margin:0;font-size:31px;line-height:1.08;letter-spacing:-.03em}.hero-copy p{margin:9px 0 0;color:#95a39b;font-size:12px;line-height:1.45;letter-spacing:.02em}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:9px 12px}.card{--accent:126,140,132;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.09);border-radius:15px;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.012) 48%,rgba(4,14,9,.78)),rgba(7,20,14,.56);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 8px 26px rgba(0,0,0,.10);backdrop-filter:blur(19px) saturate(112%)}.card:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 94% 3%,rgba(var(--accent),.10),transparent 34%);opacity:.55}.card:after{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:2px;background:rgba(var(--accent),.34);box-shadow:0 0 8px rgba(var(--accent),.16)}.card.static{min-height:50px;padding:10px 11px}.card.wide{grid-column:1/-1}.card.solo{grid-column:1/-1;min-height:52px}.card.entity{min-height:56px}.card.origin{min-height:0}.card.sensory{min-height:62px}.card.type,.card.generation,.card.entity,.card.origin,.card.aroma,.card.terpene{--accent:126,140,132}.card.lineage{--accent:160,138,84}.card.history{--accent:120,106,160}.card.sources{--accent:176,148,82}.label{position:relative;z-index:2;display:flex;align-items:center;color:#d7dfda;font-size:9px;font-weight:950;letter-spacing:.15em;text-shadow:none}.value{position:relative;z-index:2;margin-top:7px;font-size:14px;font-weight:790;line-height:1.45}.mini .value{font-size:15.5px}.meta{position:relative;z-index:2;margin-top:6px;color:#94a199;font-size:9.5px;line-height:1.5}.chips{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.chip{--chip:180,180,180;display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid rgba(var(--chip),.34);border-radius:999px;background:rgba(255,255,255,.035);color:#edf2ef;font-size:10.5px;line-height:1.2}.chip-dot{width:9px;height:9px;flex:0 0 9px;border-radius:50%;background:rgb(var(--chip));box-shadow:0 0 5px rgba(var(--chip),.95),0 0 13px rgba(var(--chip),.62)}.actionable{grid-column:1/-1;padding:12px 68px 12px 12px;min-height:76px}.actionable .value{font-size:15px}.detail-rail{position:absolute;z-index:4;right:0;top:0;bottom:0;width:60px;min-height:56px;border:0;border-left:1px solid rgba(255,255,255,.10);background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015));color:#cfd7d2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.detail-rail small{font-size:7px;font-weight:950;letter-spacing:.14em}.detail-rail b{font-size:26px;line-height:.8;font-weight:400;transition:transform .16s ease}.actionable.open{padding-right:12px;border-color:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 12px 32px rgba(0,0,0,.14)}.actionable.open>.label,.actionable.open>.value,.actionable.open>.meta{padding-right:64px}.actionable.open .detail-rail{bottom:auto;height:68px}.actionable.open .detail-rail b{transform:rotate(90deg)}.deep{position:relative;z-index:2;display:none;margin-top:14px;padding:15px 2px 4px;border-top:1px solid rgba(255,255,255,.08);color:#dce4df;font-size:14px;line-height:1.86;letter-spacing:.004em}.actionable.open .deep{display:block}.deep-heading{margin:0 0 10px;color:#cfd7d2;font-size:9px;font-weight:950;letter-spacing:.15em}.deep p{margin:0 0 14px}.deep p:last-child{margin-bottom:0}.deep-note{padding-top:11px;border-top:1px solid rgba(255,255,255,.06);color:#aeb9b2;font-size:12px;line-height:1.78}.deep a{font-size:13px!important}.confidence{display:inline-flex;align-items:center;gap:7px;margin-left:6px;color:#92a097;font-size:9px;font-weight:820;letter-spacing:.015em}.confidence i{width:7px;height:7px;flex:0 0 7px;border-radius:50%;background:currentColor;box-shadow:0 0 5px currentColor,0 0 12px currentColor}.confidence.a{color:#69d783}.confidence.b{color:#efbd50}.confidence.c{color:#e58c64}.confidence.unknown{color:#83908a}.footer-meta{padding:4px 14px 9px;color:#67766e;font-size:8.5px;text-align:right;letter-spacing:.07em}.empty{padding:30px;text-align:center;color:#89968f;font-size:14px}@media(min-width:700px){.grid{gap:10px;padding:10px 16px}.hero-copy{padding-left:22px;padding-right:22px}}
</style>
</head>
<body>
<div class="shell">
<header class="previewbar"><strong>DETAIL UX PREVIEW V2</strong><span id="state" style="font-size:8px;color:#718078">LOADING</span></header>
<div class="switcher" id="switcher"></div>
<main id="view"><div class="empty">読み込み中…</div></main>
</div>
<script>
const DATA='https://raw.githubusercontent.com/Blazea-x/strain-atlas/master-migration/runtime/catalog.json';
const ASSET='https://raw.githubusercontent.com/Blazea-x/strain-atlas/master-migration/';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const typeLabel={sativa:'SATIVA','indica':'INDICA',hybrid:'HYBRID','sativa-dominant-hybrid':'SATIVA系 HYBRID','indica-dominant-hybrid':'INDICA系 HYBRID','balanced-hybrid':'BALANCED HYBRID',unknown:'UNKNOWN'};
const roleLabel={originator:'ORIGINATOR',breeder:'BREEDER',seedCompany:'SEED COMPANY',producer:'PRODUCER',brand:'BRAND',distributor:'DISTRIBUTOR'};
const historyHeadlines={
 'wedding-cake':'2018 SoCal Cup 1位 / 2019 Leafly SOTY / 系譜説の変遷',
 'bubble-gum':'Indiana由来から複数ブリーダー系統へ',
 'og-kush':'West Coast OGファミリーの基盤',
 'strawberry-banana-s1':'Original Strawberry BananaからS1へ',
 'super-lemon-haze':'2008・2009年の主要カップで1位'
};
const sensoryColor=(item,kind)=>{
 const x=String(item||'').toLowerCase();
 if(kind==='aroma'){
  if(/strawberry|ストロベリー|berry|ベリー/.test(x))return '242,78,125';
  if(/banana|バナナ/.test(x))return '242,204,66';
  if(/bubble|バブルガム|sweet|スイート/.test(x))return '232,103,190';
  if(/gas|fuel|フューエル|ガス/.test(x))return '242,132,62';
  if(/vanilla|バニラ/.test(x))return '232,195,132';
  if(/lemon|レモン|citrus|シトラス/.test(x))return '217,221,75';
  if(/pine|パイン/.test(x))return '65,182,108';
  if(/floral|フローラル|haze|ヘイズ/.test(x))return '180,105,218';
  if(/earth|アーシー|wood|ウッド/.test(x))return '157,132,82';
  if(/pepper|ペッパー/.test(x))return '224,99,73';
  return '198,112,162';
 }
 if(/limonene/.test(x))return '238,205,61';
 if(/myrcene/.test(x))return '72,190,107';
 if(/caryophyllene/.test(x))return '190,104,211';
 if(/terpinolene/.test(x))return '64,185,207';
 return '86,169,207';
};
let catalog,current='wedding-cake';
const evidence=c=>{if(!c||c.status==='unknown')return '<span class="confidence unknown"><i></i>UNKNOWN</span>';const cl=(c.confidence||'').toLowerCase();return `<span class="confidence ${cl}"><i></i>${esc((c.status||'').toUpperCase())} / ${esc(c.confidence||'')}</span>`};
const chips=(items,kind)=>items?.length?`<div class="chips">${items.map(x=>`<span class="chip" style="--chip:${sensoryColor(x,kind)}"><i class="chip-dot" aria-hidden="true"></i><span>${esc(x)}</span></span>`).join('')}</div>`:'';
const card=(cls,label,value,meta='')=>`<section class="card static ${cls}"><div class="label">${label}</div><div class="value">${value}</div>${meta?`<div class="meta">${meta}</div>`:''}</section>`;
function actionCard(cls,label,summary,deep,meta=''){
 const id='d-'+Math.random().toString(36).slice(2,9);
 return `<section class="card actionable ${cls}" data-action-card><div class="label">${label}</div><div class="value">${summary}</div>${meta?`<div class="meta">${meta}</div>`:''}<button class="detail-rail" type="button" aria-expanded="false" aria-controls="${id}" data-open><small>DETAIL</small><b>›</b></button><div class="deep" id="${id}">${deep}</div></section>`;
}
const meaningfulList=claim=>claim&&claim.status!=='unknown'&&Array.isArray(claim.items)&&claim.items.length>0;
const lineageDeep=c=>`<div class="deep-heading">BACKGROUND / EVIDENCE</div><p>${esc(c.lineage?.note||'追加情報なし')}</p>`;
const historyDeep=c=>`<div class="deep-heading">FULL HISTORY</div><p>${esc(c.history?.text||'')}</p>${c.history?.note?`<p class="deep-note">${esc(c.history.note)}</p>`:''}`;
function render(id){
 current=id;const c=catalog.cultivars.find(x=>x.id===id);if(!c)return;
 document.querySelectorAll('.switcher button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
 const visual=(c.visuals||[]).find(v=>v.role==='primary')||(c.visuals||[])[0];
 const entityRows=(c.relations||[]).map(r=>{const e=catalog.entities?.[r.entityId];return e?`${esc(e.name)} <small style="color:#8f9d95;font-size:9px">${esc((r.roles||[]).map(x=>roleLabel[x]||x).join(' / '))}</small> ${evidence(r)}`:''}).filter(Boolean);
 const entityCard=entityRows.length?card('wide entity','BREEDER / ENTITY',entityRows.join('<br>')):'';
 const generation=c.breeding?.generation||'unknown';
 const generationCard=generation!=='unknown'?card('mini generation','GENERATION',esc(generation)):'';
 const typeClass=generationCard?'mini type':'mini type solo';
 const lineageNote=c.lineage?.note||'';
 const lineageSummary=esc(c.lineage?.display||'未確認');
 const lineageCard=lineageNote.length>145?actionCard('lineage','LINEAGE',lineageSummary,lineageDeep(c),evidence(c.lineage)):card('wide lineage','LINEAGE',lineageSummary,`${evidence(c.lineage)}${lineageNote?`<div style="margin-top:7px;color:#c2ccc6;font-size:11px;line-height:1.65">${esc(lineageNote)}</div>`:''}`);
 const origin=c.origin&&c.origin.status!=='unknown'?card('wide origin','ORIGIN',esc(c.origin.text||'未確認'),evidence(c.origin)):'';
 const aroma=meaningfulList(c.aromas)?`<section class="card static wide sensory aroma"><div class="label">AROMA</div>${chips(c.aromas.items,'aroma')}<div class="meta">${evidence(c.aromas)}</div></section>`:'';
 const terpene=meaningfulList(c.terpenes)?`<section class="card static wide sensory terpene"><div class="label">TERPENE</div>${chips(c.terpenes.items,'terpene')}<div class="meta">${evidence(c.terpenes)}</div></section>`:'';
 const historyText=c.history?.status!=='unknown'?(c.history?.text||''):'';
 const historyNote=c.history?.note||'';
 const historyDeepLength=(historyText+historyNote).length;
 const historyHeadline=historyHeadlines[c.id]||'背景・受賞・変遷を詳しく見る';
 const historyCard=!historyText?'':historyDeepLength>155?actionCard('history','HISTORY',esc(historyHeadline),historyDeep(c),evidence(c.history)):card('wide history','HISTORY',esc(historyText),evidence(c.history));
 const sourceIds=[...(c.lineage?.sourceRefs||[]),...(c.aromas?.sourceRefs||[]),...(c.terpenes?.sourceRefs||[]),...(c.origin?.sourceRefs||[]),...(c.history?.sourceRefs||[]),...(c.relations||[]).flatMap(r=>r.sourceRefs||[])];
 const uniq=[...new Set(sourceIds)];const srcs=uniq.map(x=>catalog.sources?.[x]).filter(Boolean);
 const sourceDeep=srcs.length?`<div class="deep-heading">SOURCE LIST</div>`+srcs.map(s=>`<div style="margin:0 0 15px"><a href="${esc(s.url)}" target="_blank" rel="noopener" style="color:#e8ce7f;text-decoration:none;font-weight:820">${esc(s.publisher)} / ${esc(s.title)}</a><div style="color:#87968e;font-size:9.5px;margin-top:5px">${esc(s.sourceType)} · checked ${esc(s.checkedAt)}</div></div>`).join(''):'出典なし';
 const sourceCard=actionCard('sources','SOURCES',`${srcs.length} SOURCES`,sourceDeep,'EVIDENCE');
 document.getElementById('view').innerHTML=`<section class="hero">${visual?`<img src="${ASSET+esc(visual.src)}" alt="${esc(visual.alt||'')}">`:''}</section><div class="hero-copy"><h1>${esc(c.name)}</h1><p>${c.jp?esc(c.jp):'日本語表記は現在未確認'} ・ ${esc((c.status||'').toUpperCase())}</p></div><div class="grid">${card(typeClass,'TYPE',esc(typeLabel[c.classification?.type]||c.classification?.type||'UNKNOWN'))}${generationCard}${entityCard}${origin}${lineageCard}${aroma}${terpene}${historyCard}</div><div class="footer-meta">UPDATED ${esc(c.updatedAt||'-')} · CHECKED ${esc(c.checkedAt||'-')}</div><div class="grid" style="padding-top:0">${sourceCard}</div>`;
 document.querySelectorAll('[data-open]').forEach(btn=>btn.addEventListener('click',()=>{const box=btn.closest('[data-action-card]');const open=!box.classList.contains('open');document.querySelectorAll('[data-action-card].open').forEach(x=>{x.classList.remove('open');x.querySelector('[data-open]')?.setAttribute('aria-expanded','false')});box.classList.toggle('open',open);btn.setAttribute('aria-expanded',open?'true':'false')}));
}
fetch(DATA).then(r=>r.json()).then(data=>{catalog=data;document.getElementById('state').textContent='READY';const sw=document.getElementById('switcher');sw.innerHTML=data.cultivars.map(c=>`<button type="button" data-id="${esc(c.id)}">${esc(c.name)}</button>`).join('');sw.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>render(b.dataset.id)));render(data.cultivars.some(c=>c.id===current)?current:data.cultivars[0].id)}).catch(()=>{document.getElementById('state').textContent='ERROR';document.getElementById('view').innerHTML='<div class="empty">データを読み込めませんでした。</div>'});
</script>
</body>
</html>
