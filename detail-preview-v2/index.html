<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#06100c">
<title>Cannabis Strain Wisdom | Detail Preview V2</title>
<style>
:root{--bg:#06100c;--text:#eef3ef;--muted:#829089;--gold:#d5bc72}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100dvh;background:radial-gradient(circle at 50% -10%,rgba(38,75,50,.20),transparent 35%),#06100c}.shell{width:min(100%,560px);margin:0 auto;padding-bottom:40px}.previewbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:rgba(4,14,9,.88);border-bottom:1px solid rgba(255,255,255,.06);backdrop-filter:blur(18px)}.previewbar strong{font-size:10px;letter-spacing:.15em;color:#b9c5bd}.switcher{display:flex;gap:5px;overflow-x:auto;padding:8px 10px 9px;scrollbar-width:none;border-bottom:1px solid rgba(255,255,255,.045)}.switcher::-webkit-scrollbar{display:none}.switcher button{flex:0 0 auto;border:1px solid rgba(255,255,255,.08);border-radius:999px;background:rgba(255,255,255,.025);color:#9aa9a0;padding:6px 9px;font-size:8px;font-weight:750}.switcher button.active{border-color:rgba(213,188,114,.38);background:rgba(213,188,114,.12);color:#f1d891}.hero{position:relative}.hero img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#0b1711}.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(transparent,rgba(6,16,11,.96))}.hero-copy{position:relative;z-index:2;margin-top:-54px;padding:0 18px 17px}.hero-copy h1{margin:0;font-size:28px;line-height:1.08;letter-spacing:-.03em}.hero-copy p{margin:8px 0 0;color:#87988e;font-size:10px;letter-spacing:.03em}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;padding:8px 12px}.card{--accent:120,150,130;position:relative;overflow:hidden;border:1px solid rgba(var(--accent),.28);border-radius:15px;background:linear-gradient(145deg,rgba(var(--accent),.16),rgba(var(--accent),.035) 48%,rgba(4,14,9,.68)),rgba(7,20,14,.50);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 8px 26px rgba(0,0,0,.11);backdrop-filter:blur(19px) saturate(124%)}.card:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 94% 3%,rgba(var(--accent),.38),transparent 34%);opacity:.78}.card:after{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:2px;background:rgba(var(--accent),.94);box-shadow:0 0 16px rgba(var(--accent),.56)}.card.static{min-height:44px;padding:8px 10px}.card.wide{grid-column:1/-1}.card.solo{grid-column:1/-1;min-height:46px}.card.entity{min-height:50px}.card.origin{min-height:0}.card.sensory{min-height:54px}.card.lineage{--accent:225,170,63}.card.aroma{--accent:212,93,145}.card.terpene{--accent:59,181,196}.card.history{--accent:161,120,215}.card.type{--accent:45,190,151}.card.generation{--accent:187,132,224}.card.entity{--accent:74,151,213}.card.origin{--accent:58,173,112}.card.sources{--accent:224,181,68}.label{position:relative;z-index:2;color:rgb(var(--accent));font-size:7px;font-weight:950;letter-spacing:.18em;text-shadow:0 0 11px rgba(var(--accent),.20)}.value{position:relative;z-index:2;margin-top:5px;font-size:12px;font-weight:790;line-height:1.38}.mini .value{font-size:13px}.meta{position:relative;z-index:2;margin-top:4px;color:#85928b;font-size:7.5px;line-height:1.4}.chips{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.chip{padding:4px 7px;border:1px solid rgba(var(--accent),.34);border-radius:999px;background:rgba(var(--accent),.11);color:#e0e7e2;font-size:8px}.actionable{grid-column:1/-1;padding:10px 64px 10px 11px;min-height:68px}.actionable .value{font-size:13px}.detail-rail{position:absolute;z-index:4;right:0;top:0;bottom:0;width:56px;min-height:54px;border:0;border-left:1px solid rgba(var(--accent),.34);background:linear-gradient(180deg,rgba(var(--accent),.20),rgba(var(--accent),.055));color:rgb(var(--accent));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.detail-rail small{font-size:5.7px;font-weight:950;letter-spacing:.15em}.detail-rail b{font-size:24px;line-height:.8;font-weight:400;transition:transform .16s ease}.actionable.open{padding-right:11px;border-color:rgba(var(--accent),.48);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 0 30px rgba(var(--accent),.12)}.actionable.open>.label,.actionable.open>.value,.actionable.open>.meta{padding-right:58px}.actionable.open .detail-rail{bottom:auto;height:62px}.actionable.open .detail-rail b{transform:rotate(90deg)}.deep{position:relative;z-index:2;display:none;margin-top:12px;padding:13px 2px 3px;border-top:1px solid rgba(var(--accent),.22);color:#d3ddd6;font-size:12.5px;line-height:1.88;letter-spacing:.005em}.actionable.open .deep{display:block}.deep-heading{margin:0 0 8px;color:rgb(var(--accent));font-size:7px;font-weight:950;letter-spacing:.17em}.deep p{margin:0 0 12px}.deep p:last-child{margin-bottom:0}.deep-note{padding-top:10px;border-top:1px solid rgba(var(--accent),.12);color:#9eaaa3;font-size:10.5px;line-height:1.75}.deep a{font-size:11.5px!important}.confidence{display:inline-flex;align-items:center;gap:5px;margin-left:5px;color:#92a097;font-size:7px;font-weight:780}.confidence i{width:5px;height:5px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}.confidence.a{color:#9fd5a0}.confidence.b{color:#d8b665}.confidence.c{color:#cda07e}.confidence.unknown{color:#74827a}.footer-meta{padding:3px 14px 8px;color:#53635a;font-size:6.5px;text-align:right;letter-spacing:.08em}.empty{padding:30px;text-align:center;color:#89968f}@media(min-width:700px){.grid{gap:9px;padding:10px 16px}.hero-copy{padding-left:22px;padding-right:22px}}
</style>
</head>
<body>
<div class="shell">
<header class="previewbar"><strong>DETAIL UX PREVIEW V2</strong><span id="state" style="font-size:7px;color:#718078">LOADING</span></header>
<div class="switcher" id="switcher"></div>
<main id="view"><div class="empty">読み込み中…</div></main>
</div>
<script>
const DATA='https://raw.githubusercontent.com/Blazea-x/strain-atlas/master-migration/runtime/catalog.json';
const ASSET='https://raw.githubusercontent.com/Blazea-x/strain-atlas/master-migration/';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const typeLabel={sativa:'SATIVA','indica':'INDICA',hybrid:'HYBRID','sativa-dominant-hybrid':'SATIVA系 HYBRID','indica-dominant-hybrid':'INDICA系 HYBRID','balanced-hybrid':'BALANCED HYBRID',unknown:'UNKNOWN'};
const roleLabel={originator:'ORIGINATOR',breeder:'BREEDER',seedCompany:'SEED COMPANY',producer:'PRODUCER',brand:'BRAND',distributor:'DISTRIBUTOR'};
const historyHeadlines={
 'wedding-cake':'2018 SoCal Cup 1位 / 2019 Leafly SOTY / 系譜説の変遷',
 'bubble-gum':'Indiana由来から複数ブリーダー系統へ',
 'og-kush':'West Coast OGファミリーの基盤',
 'strawberry-banana-s1':'Original Strawberry BananaからS1へ',
 'super-lemon-haze':'2008・2009年の主要カップで1位'
};
let catalog,current='wedding-cake';
const evidence=c=>{if(!c||c.status==='unknown')return '<span class="confidence unknown"><i></i>UNKNOWN</span>';const cl=(c.confidence||'').toLowerCase();return `<span class="confidence ${cl}"><i></i>${esc((c.status||'').toUpperCase())} / ${esc(c.confidence||'')}</span>`};
const chips=items=>items?.length?`<div class="chips">${items.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`:'';
const card=(cls,label,value,meta='')=>`<section class="card static ${cls}"><div class="label">${label}</div><div class="value">${value}</div>${meta?`<div class="meta">${meta}</div>`:''}</section>`;
function actionCard(cls,label,summary,deep,meta=''){
 const id='d-'+Math.random().toString(36).slice(2,9);
 return `<section class="card actionable ${cls}" data-action-card><div class="label">${label}</div><div class="value">${summary}</div>${meta?`<div class="meta">${meta}</div>`:''}<button class="detail-rail" type="button" aria-expanded="false" aria-controls="${id}" data-open><small>DETAIL</small><b>›</b></button><div class="deep" id="${id}">${deep}</div></section>`;
}
const meaningfulList=claim=>claim&&claim.status!=='unknown'&&Array.isArray(claim.items)&&claim.items.length>0;
const lineageDeep=c=>`<div class="deep-heading">BACKGROUND / EVIDENCE</div><p>${esc(c.lineage?.note||'追加情報なし')}</p>`;
const historyDeep=c=>`<div class="deep-heading">FULL HISTORY</div><p>${esc(c.history?.text||'')}</p>${c.history?.note?`<p class="deep-note">${esc(c.history.note)}</p>`:''}`;
function render(id){
 current=id;const c=catalog.cultivars.find(x=>x.id===id);if(!c)return;
 document.querySelectorAll('.switcher button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
 const visual=(c.visuals||[]).find(v=>v.role==='primary')||(c.visuals||[])[0];
 const entityRows=(c.relations||[]).map(r=>{const e=catalog.entities?.[r.entityId];return e?`${esc(e.name)} <small style="color:#7f8e86;font-size:7px">${esc((r.roles||[]).map(x=>roleLabel[x]||x).join(' / '))}</small> ${evidence(r)}`:''}).filter(Boolean);
 const entityCard=entityRows.length?card('wide entity','BREEDER / ENTITY',entityRows.join('<br>')):'';
 const generation=c.breeding?.generation||'unknown';
 const generationCard=generation!=='unknown'?card('mini generation','GENERATION',esc(generation)):'';
 const typeClass=generationCard?'mini type':'mini type solo';
 const lineageNote=c.lineage?.note||'';
 const lineageSummary=esc(c.lineage?.display||'未確認');
 const lineageCard=lineageNote.length>145?actionCard('lineage','LINEAGE',lineageSummary,lineageDeep(c),evidence(c.lineage)):card('wide lineage','LINEAGE',lineageSummary,`${evidence(c.lineage)}${lineageNote?`<div style="margin-top:5px;color:#b6c1ba;font-size:9px;line-height:1.58">${esc(lineageNote)}</div>`:''}`);
 const origin=c.origin&&c.origin.status!=='unknown'?card('wide origin','ORIGIN',esc(c.origin.text||'未確認'),evidence(c.origin)):'';
 const aroma=meaningfulList(c.aromas)?`<section class="card static wide sensory aroma"><div class="label">AROMA</div>${chips(c.aromas.items)}<div class="meta">${evidence(c.aromas)}</div></section>`:'';
 const terpene=meaningfulList(c.terpenes)?`<section class="card static wide sensory terpene"><div class="label">TERPENE</div>${chips(c.terpenes.items)}<div class="meta">${evidence(c.terpenes)}</div></section>`:'';
 const historyText=c.history?.status!=='unknown'?(c.history?.text||''):'';
 const historyNote=c.history?.note||'';
 const historyDeepLength=(historyText+historyNote).length;
 const historyHeadline=historyHeadlines[c.id]||'背景・受賞・変遷を詳しく見る';
 const historyCard=!historyText?'':historyDeepLength>155?actionCard('history','HISTORY',esc(historyHeadline),historyDeep(c),evidence(c.history)):card('wide history','HISTORY',esc(historyText),evidence(c.history));
 const sourceIds=[...(c.lineage?.sourceRefs||[]),...(c.aromas?.sourceRefs||[]),...(c.terpenes?.sourceRefs||[]),...(c.origin?.sourceRefs||[]),...(c.history?.sourceRefs||[]),...(c.relations||[]).flatMap(r=>r.sourceRefs||[])];
 const uniq=[...new Set(sourceIds)];const srcs=uniq.map(x=>catalog.sources?.[x]).filter(Boolean);
 const sourceDeep=srcs.length?`<div class="deep-heading">SOURCE LIST</div>`+srcs.map(s=>`<div style="margin:0 0 13px"><a href="${esc(s.url)}" target="_blank" rel="noopener" style="color:#e2c773;text-decoration:none;font-weight:800">${esc(s.publisher)} / ${esc(s.title)}</a><div style="color:#788980;font-size:8px;margin-top:4px">${esc(s.sourceType)} · checked ${esc(s.checkedAt)}</div></div>`).join(''):'出典なし';
 const sourceCard=actionCard('sources','SOURCES',`${srcs.length} SOURCES`,sourceDeep,'EVIDENCE');
 document.getElementById('view').innerHTML=`<section class="hero">${visual?`<img src="${ASSET+esc(visual.src)}" alt="${esc(visual.alt||'')}">`:''}</section><div class="hero-copy"><h1>${esc(c.name)}</h1><p>${c.jp?esc(c.jp):'日本語表記は現在未確認'} ・ ${esc((c.status||'').toUpperCase())}</p></div><div class="grid">${card(typeClass,'TYPE',esc(typeLabel[c.classification?.type]||c.classification?.type||'UNKNOWN'))}${generationCard}${entityCard}${origin}${lineageCard}${aroma}${terpene}${historyCard}</div><div class="footer-meta">UPDATED ${esc(c.updatedAt||'-')} · CHECKED ${esc(c.checkedAt||'-')}</div><div class="grid" style="padding-top:0">${sourceCard}</div>`;
 document.querySelectorAll('[data-open]').forEach(btn=>btn.addEventListener('click',()=>{const box=btn.closest('[data-action-card]');const open=!box.classList.contains('open');document.querySelectorAll('[data-action-card].open').forEach(x=>{x.classList.remove('open');x.querySelector('[data-open]')?.setAttribute('aria-expanded','false')});box.classList.toggle('open',open);btn.setAttribute('aria-expanded',open?'true':'false')}));
}
fetch(DATA).then(r=>r.json()).then(data=>{catalog=data;document.getElementById('state').textContent='READY';const sw=document.getElementById('switcher');sw.innerHTML=data.cultivars.map(c=>`<button type="button" data-id="${esc(c.id)}">${esc(c.name)}</button>`).join('');sw.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>render(b.dataset.id)));render(data.cultivars.some(c=>c.id===current)?current:data.cultivars[0].id)}).catch(()=>{document.getElementById('state').textContent='ERROR';document.getElementById('view').innerHTML='<div class="empty">データを読み込めませんでした。</div>'});
</script>
</body>
</html>
